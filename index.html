<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Știri în neștire</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5F63" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neștire">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --paper: #F1EFE7;
    --paper-raised: #E9E6DA;
    --ink: #20241F;
    --ink-soft: #5B6058;
    --rule: #D8D4C7;
    --teal: #2C5F63;
    --brick: #8B3E32;
    --nav-highlight: var(--teal);
    --max-width: 640px;
    --font-title: 'Source Serif 4', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --content-scale: 1;
    --navbar-top-h: 44px; /* inaltimea reala a barei fixe de sus - actualizata din JS */
    --tabs-h: 45px; /* inaltimea reala a randului de taburi de categorii - actualizata din JS */
  }

  html[data-theme="dark"] {
    --paper: #181B18;
    --paper-raised: #21251F;
    --ink: #ECE8DC;
    --ink-soft: #9AA098;
    --rule: #33372F;
    --teal: #6FB3AC;
    --brick: #D98F7C;
    --nav-highlight: #E6D9A0;
  }

  html[data-font-size="1"] { --content-scale: 0.9; }
  html[data-font-size="2"] { --content-scale: 1; }
  html[data-font-size="3"] { --content-scale: 1.15; }
  html[data-font-size="4"] { --content-scale: 1.3; }
  html[data-font-size="5"] { --content-scale: 1.45; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    transition: background 0.15s ease, color 0.15s ease;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: var(--max-width);
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }

  /* Masthead */
  header.masthead {
    padding: calc(env(safe-area-inset-top, 0px) + 44px + 1.5rem) 1.1rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .masthead-text {
    min-width: 0; /* esential: fara asta, un flex-item nu se micsoreaza sub latimea lui "naturala" */
    flex: 1;
  }

  .wordmark {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: clamp(1.05rem, 5.8vw, 1.7rem);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
  }

  .tagline {
    margin: 0.35rem 0 0;
    font-size: clamp(0.66rem, 2.6vw, 0.85rem);
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .offline-download-btn {
    all: unset;
    display: block;
    max-width: 100%;
    box-sizing: border-box;
    margin: 0.4rem 0 0;
    font-size: 0.75rem;
    color: var(--teal);
    cursor: pointer;
    border-bottom: 1px dotted var(--teal);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .offline-download-btn:hover { opacity: 0.8; }
  .offline-download-btn:disabled { opacity: 0.5; cursor: default; }

  .offline-status {
    margin: 0.3rem 0 0;
    font-size: 0.75rem;
    color: var(--teal);
    display: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .offline-status.visible { display: block; }

  button.icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--ink-soft);
    padding: 0.3rem 0.45rem;
    line-height: 1;
    border-radius: 999px;
    border: 1px solid var(--teal);
  }
  button.icon-btn:hover, button.icon-btn:focus-visible { background: var(--paper-raised); }
  button.icon-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .header-actions { display: flex; gap: 0.15rem; flex-shrink: 0; }

  /* Bara de cautare */
  .search-bar {
    display: none;
    padding: 0.75rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }
  .search-bar.visible { display: block; }
  .search-bar input {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
  }
  .search-bar input:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

  /* Pagina de setari (randata in #main, ca si vizualizarea unui articol) */
  .settings-page { padding: 0.5rem 1.25rem 3.75rem; }
  .help-link-btn {
    all: unset;
    display: block;
    box-sizing: border-box;
    width: 100%;
    text-align: center;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--teal);
    background: var(--paper-raised);
    border: 1px solid var(--teal);
    border-radius: 10px;
    padding: 0.7rem 1rem;
    margin-bottom: 1.2rem;
  }
  .help-link-btn:hover { background: var(--paper); }
  .help-text p {
    font-size: calc(0.88rem * var(--content-scale));
    line-height: 1.55;
    color: var(--ink);
    margin: 0 0 0.7rem;
  }
  .help-text p:last-child { margin-bottom: 0; }
  .help-text strong { color: var(--ink); }

  .settings-group { margin-bottom: 0.85rem; }
  .settings-group:last-child { margin-bottom: 0; }

  .settings-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    margin: 0 0 0.35rem;
  }

  .segmented {
    display: flex;
    gap: 0.3rem;
    flex-wrap: wrap;
  }

  .segmented button {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.72rem;
    padding: 0.26rem 0.5rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  #shadeGroup button {
    padding: 0.35rem;
    display: inline-flex;
  }
  .shade-dot {
    width: 1.15rem;
    height: 1.15rem;
    border-radius: 50%;
    border: 1px solid var(--rule);
    display: block;
  }

  .settings-row {
    display: flex;
    gap: 1.1rem;
  }
  .settings-col { flex: 1; min-width: 0; }

  /* ---- Setari: liste de ordonare (categorii, surse) ---- */
  .settings-hint { font-size: 0.78rem; color: var(--ink-soft); margin: 0 0 0.5rem; line-height: 1.45; }
  .order-group-label {
    font-size: 0.7rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0.9rem 0 0.3rem;
  }
  .order-list { list-style: none; margin: 0; padding: 0; position: relative; }
  .order-row {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.28rem 0.25rem;
    border-bottom: 1px solid var(--rule);
    background: var(--paper);
    font-size: 0.88rem;
  }
  .order-row.dragging {
    position: relative;
    z-index: 5;
    background: var(--paper-raised);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    border-radius: 8px;
  }
  .drag-handle {
    touch-action: none;           /* doar manerul preia gestul; restul randului lasa derularea normala */
    cursor: grab;
    color: var(--ink-soft);
    padding: 0.35rem 0.3rem;
    font-size: 1rem;
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .order-row.dragging .drag-handle { cursor: grabbing; }
  .order-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.45rem; }
  .order-main input { accent-color: var(--teal); width: 1.05rem; height: 1.05rem; flex-shrink: 0; }
  .order-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-tag { font-size: 0.66rem; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 4px; padding: 0.05rem 0.3rem; flex-shrink: 0; }
  .order-arrows { display: flex; gap: 0.15rem; flex-shrink: 0; }
  .order-arrows button {
    all: unset; cursor: pointer; color: var(--teal); font-size: 0.85rem;
    width: 1.7rem; height: 1.7rem; display: grid; place-items: center; border-radius: 6px;
  }
  .order-arrows button:hover { background: var(--paper-raised); }
  .order-arrows button:disabled { opacity: 0.25; cursor: default; }
  .order-drop-line {
    position: absolute; left: 0; right: 0; height: 3px; border-radius: 2px;
    background: var(--nav-highlight); pointer-events: none; display: none;
  }

  .select-all-btn {
    all: unset;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--teal);
    margin-top: 0.4rem;
    display: inline-block;
  }

  /* ---- Categorii (sus) si selectorul de surse, fixate la derulare ---- */
  /* Fundal usor translucid, cu estompare: continutul care trece pe dedesubt ramane
     vag vizibil, efect modern discret (cu fundal solid ca rezerva pe browsere vechi). */
  nav.tabs {
    position: sticky;
    top: var(--navbar-top-h, 44px);
    z-index: 30;
    background: var(--paper);
    background: color-mix(in srgb, var(--paper) 90%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    backdrop-filter: saturate(1.4) blur(10px);
    display: flex;
    flex-wrap: wrap;           /* categoriile trec pe al doilea rand, fara derulare laterala */
    gap: 0.35rem;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--rule);
  }

  nav.tabs-sub {
    position: sticky;
    top: calc(var(--navbar-top-h, 44px) + var(--tabs-h, 45px));
    z-index: 29;
    display: none;
    padding: 0.35rem 1rem;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-raised);
    background: color-mix(in srgb, var(--paper-raised) 92%, transparent);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    backdrop-filter: saturate(1.4) blur(10px);
  }
  nav.tabs-sub.visible { display: block; }

  .tab {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.84rem;
    padding: 0.36rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  @media (hover: hover) { .tab:hover { border-color: var(--teal); color: var(--ink); } }
  .tab:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .tab[aria-pressed="true"] {
    background: var(--paper-raised);
    background: color-mix(in srgb, var(--teal) 16%, transparent);
    color: var(--ink);
    border-color: var(--teal);
    font-weight: 600;
  }

  /* Rezumatul surselor: un singur rand, se deschide la atingere */
  .source-summary {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-size: 0.84rem;
    color: var(--ink);
    padding: 0.3rem 0;
    -webkit-tap-highlight-color: transparent;
  }
  .source-summary:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
  .ss-label { color: var(--ink-soft); flex-shrink: 0; }
  .ss-value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .ss-chevron { color: var(--teal); transition: transform 0.2s; flex-shrink: 0; }
  .source-summary[aria-expanded="true"] .ss-chevron { transform: rotate(180deg); }

  .source-panel {
    position: absolute;
    left: 0;
    right: 0;
    top: 100%;
    max-height: min(60vh, 440px);
    overflow-y: auto;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--rule);
    border-radius: 0 0 14px 14px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    padding: 0.7rem 1rem 0.9rem;
  }
  .source-panel[hidden] { display: none; }
  .source-panel:not([hidden]) { animation: nestire-panel-in 0.16s ease-out; }
  @keyframes nestire-panel-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .panel-group-label {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0.7rem 0 0.4rem;
  }
  .panel-group-label:first-child { margin-top: 0; }
  .panel-chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .panel-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 0.85rem; gap: 0.5rem; }
  .panel-link { all: unset; cursor: pointer; font-size: 0.8rem; color: var(--teal); }
  .panel-done {
    all: unset;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--paper);
    background: var(--teal);
    padding: 0.4rem 1rem;
    border-radius: 999px;
  }

  /* Bare de derulare subtiri, in culorile aplicatiei (inainte: albe si groase pe desktop) */
  * { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Bara de navigare (inapoi/inainte) - fixata, mereu vizibila, fara scroll */
  nav.nav-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: var(--max-width);
    min-height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--paper);
    z-index: 40;
  }
  nav.nav-bar#navBarTop {
    top: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 0.5rem);
    border-bottom: 1px solid var(--rule);
  }
  nav.nav-bar#navBarBottom {
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
    border-top: 1px solid var(--rule);
  }
  .nav-btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--nav-highlight);
    border: 1px solid var(--teal);
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
  }
  .nav-btn:disabled {
    color: var(--ink-soft);
    border-color: var(--rule);
    opacity: 0.5;
    cursor: default;
  }
  .nav-btn:not(:disabled):hover { background: var(--paper-raised); }

  .font-size-label {
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .font-size-slider {
    width: 4rem;
    accent-color: var(--teal);
    cursor: pointer;
  }

  /* Lista de articole, cu poza mica optionala */
  main { flex: 1; padding: 0.25rem 0 calc(env(safe-area-inset-bottom, 0px) + 44px + 2.5rem); }

  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { border-bottom: 1px solid var(--rule); position: relative; }

  button.item-btn {
    all: unset;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    padding: 1rem 2.6rem 1rem 1.25rem;
    cursor: pointer;
    box-sizing: border-box;
  }
  button.item-btn:hover, button.item-btn:focus-visible { background: var(--paper-raised); }
  button.item-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }

  .fav-star {
    all: unset;
    position: absolute;
    top: 0.85rem;
    right: 1rem;
    cursor: pointer;
    font-size: 1.15rem;
    line-height: 1;
    color: var(--rule);
    padding: 0.2rem;
  }
  .fav-star.active { color: var(--nav-highlight); }
  .fav-star:hover { color: var(--teal); }

  .item-thumb {
    flex: 0 0 auto;
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 8px;
    object-fit: cover;
    background: var(--paper-raised);
  }
  .item-text { flex: 1; min-width: 0; }

  .item-title {
    font-family: var(--font-title);
    font-weight: 600;
    font-size: calc(1.11rem * var(--content-scale));
    line-height: 1.3;
    margin: 0 0 0.5rem;
    color: var(--ink);
    overflow-wrap: anywhere;
  }
  .item-title.is-read { color: var(--ink-soft); font-weight: 400; }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.81rem;
    color: var(--ink-soft);
  }

  .source-tag { font-weight: 600; }

  /* Reading view */
  .reading { padding: 0.5rem 1.25rem 3.75rem; }

  button.back-btn {
    all: unset;
    display: inline-block;
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--teal);
    padding: 0.75rem 0;
  }
  button.back-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .reading-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .fav-star-reading {
    all: unset;
    cursor: pointer;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--rule);
    padding: 0.4rem;
  }
  .fav-star-reading.active { color: var(--nav-highlight); }
  .reading-actions { display: flex; align-items: center; gap: 0.3rem; }
  .share-btn {
    all: unset;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--teal);
    border: 1px solid var(--teal);
    border-radius: 999px;
    padding: 0.25rem 0.7rem;
  }
  .share-btn:hover { background: var(--paper-raised); }
  .list-sentinel { height: 1px; }
  .reading-failure {
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin: 0.5rem 0 1rem;
    background: var(--paper-raised);
  }
  .reading-failure strong { display: block; margin-bottom: 0.4rem; }
  .reading-failure p { margin: 0 0 0.8rem; color: var(--ink-soft); line-height: 1.5; }
  .reading-note { font-size: 0.82rem; color: var(--ink-soft); font-style: italic; margin: 0.5rem 0 1rem; }
  button.icon-btn.spinning { animation: nestire-spin 0.9s linear infinite; }
  @keyframes nestire-spin { to { transform: rotate(360deg); } }
  .source-down { font-size: 0.68rem; color: var(--brick); }
  .offline-info { font-size: 0.8rem; color: var(--ink-soft); margin: 0 0 0.4rem; }

  .reading-meta { font-size: 0.81rem; color: var(--ink-soft); margin-bottom: 0.6rem; }

  .reading-title {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 1.625rem;
    line-height: 1.28;
    margin: 0 0 1.25rem;
    color: var(--ink);
    overflow-wrap: anywhere;
  }

  /* Textul articolului justificat (ca in presa tiparita), cu despartire automata in
     silabe ca sa nu apara spatii mari intre cuvinte pe ecrane inguste. Browserul
     desparte dupa limba articolului (atributul lang de pe .reading). Titlurile raman
     aliniate la stanga: rândurile lor scurte ar arata rau intinse intre margini. */
  html[data-text-align="justify"] .reading-body p {
    text-align: justify;
    text-justify: inter-word;
    -webkit-hyphens: auto;
    hyphens: auto;
    hyphenate-limit-chars: 7 3 3; /* desparte doar cuvinte de minimum 7 litere, cu minimum 3 litere pe fiecare parte */
  }
  .reading-body p {
    font-family: var(--font-title);
    font-size: calc(1.125rem * var(--content-scale));
    line-height: 1.6;
    max-width: 66ch;
    margin: 0 0 1.1em;
    color: var(--ink);
  }

  .reading-source-link {
    display: inline-block;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: var(--ink-soft);
  }

  /* States */
  .state { padding: 3.75rem 1.5rem; text-align: center; color: var(--ink-soft); font-size: 0.94rem; }
  .state strong { display: block; color: var(--ink); font-size: 1.06rem; margin-bottom: 0.4rem; font-weight: 600; }

  .retry-btn {
    margin-top: 0.9rem;
    appearance: none;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  /* Banner "versiune noua" / instalare */
  .update-banner {
    display: none;
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 44px + 0.75rem);
    transform: translateX(-50%);
    max-width: calc(var(--max-width) - 2rem);
    width: calc(100% - 2rem);
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 50;
  }
  .update-banner.visible { display: flex; }
  .update-banner button {
    appearance: none;
    border: 1px solid var(--paper);
    background: transparent;
    color: var(--paper);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="masthead">
      <div class="masthead-text">
        <p class="wordmark">Știri în neștire</p>
        <p class="tagline">Fără cont, fără abonament. Fără reclame, fără zgomot.</p>
        <button class="offline-download-btn" id="offlineDownloadBtn">⬇ Descarcă pentru offline</button>
        <p class="offline-status" id="offlineStatus"></p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" aria-label="Reîmprospătează știrile">↻</button>
        <button class="icon-btn" id="favoritesBtn" aria-label="Favorite">★</button>
        <button class="icon-btn" id="searchBtn" aria-label="Caută" aria-expanded="false">🔍</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Setări">⚙</button>
      </div>
    </header>

    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Caută în titluri…" autocomplete="off">
    </div>

    <nav class="nav-bar" id="navBarTop">
      <button class="nav-btn" id="backBtnTop" aria-label="Înapoi">← Înapoi</button>
      <button class="nav-btn" id="forwardBtnTop" aria-label="Înainte">Înainte →</button>
      <span class="font-size-label">Font</span>
      <input type="range" class="font-size-slider" id="fontSizeSliderTop" min="1" max="5" step="1" aria-label="Mărime font">
    </nav>

    <nav class="tabs" id="tabs"></nav>
    <nav class="tabs tabs-sub" id="subTabs"></nav>
    <main id="main">
      <div class="state">Se încarcă titlurile…</div>
    </main>

    <nav class="nav-bar" id="navBarBottom">
      <button class="nav-btn" id="backBtnBottom" aria-label="Înapoi">← Înapoi</button>
      <button class="nav-btn" id="forwardBtnBottom" aria-label="Înainte">Înainte →</button>
      <span class="font-size-label">Font</span>
      <input type="range" class="font-size-slider" id="fontSizeSliderBottom" min="1" max="5" step="1" aria-label="Mărime font">
    </nav>

    <div class="update-banner" id="updateBanner">
      <span>O versiune nouă e disponibilă.</span>
      <button id="updateReloadBtn">Reîncarcă</button>
    </div>

    <div class="update-banner" id="installBanner">
      <span id="installBannerText">Instalează aplicația pentru acces rapid.</span>
      <span style="display:flex; gap:0.4rem;">
        <button id="installActionBtn">Instalează</button>
        <button id="installDismissBtn" aria-label="Închide">✕</button>
      </span>
    </div>
  </div>

<script>
  // ---- Configurare ----
  const WORKER_URL = 'https://stiri-proxy.tun-app.workers.dev/';
  const SETTINGS_KEY = 'stiriNestireSettings';
  const LAST_FEED_KEY = 'stiriNestireLastFeed'; // instantaneu al ultimei liste incarcate cu succes, pt pornire offline

  function saveLastFeedSnapshot() {
    try { localStorage.setItem(LAST_FEED_KEY, JSON.stringify({ items: allItems, sources: sourceMeta })); } catch {}
  }
  function loadLastFeedSnapshot() {
    try { return JSON.parse(localStorage.getItem(LAST_FEED_KEY) || 'null'); } catch { return null; }
  }

  const SHADE_PRESETS = [
    { id: 'default', label: 'Standard', light: '#20241F', dark: '#ECE8DC' },
    { id: 'warm',    label: 'Alb cald',  light: '#3A2E1E', dark: '#F2E6C9' },
    { id: 'cool',    label: 'Gri rece',  light: '#1E2733', dark: '#C9D6DD' },
    { id: 'sepia',   label: 'Sepia',     light: '#4B3621', dark: '#D9C9A3' }
  ];

  // Fiecare font se descarca doar cand e folosit (inainte: toate 4 la fiecare pornire,
  // blocand afisarea). Pagina de Setari le incarca pe toate, pentru previzualizare.
  const FONT_URLS = {
    classic: 'https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap',
    modern: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap',
    reading: 'https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap'
  };
  const loadedFontPresets = new Set();
  function loadFontPreset(id) {
    if (loadedFontPresets.has(id) || !FONT_URLS[id]) return;
    loadedFontPresets.add(id);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = FONT_URLS[id];
    document.head.appendChild(link);
  }

  const FONT_PRESETS = [
    { id: 'classic', label: 'Clasic', title: "'Source Serif 4', serif", body: "'IBM Plex Sans', sans-serif" },
    { id: 'modern',  label: 'Modern', title: "'Inter', sans-serif", body: "'Inter', sans-serif" },
    { id: 'reading', label: 'Lectură', title: "'Lora', serif", body: "'Lora', serif" }
  ];

  const DEFAULT_SETTINGS = {
    theme: 'system',
    fontSize: '2',
    fontFamily: 'classic',
    shade: 'default',
    selectedSources: null, // null = toate sursele descoperite
    categoryOrder: null, // null = ordinea implicita (CATEGORY_ORDER); altfel, ordine aleasa de utilizator prin drag&drop
    sourceOrder: null, // null = ordinea implicita (descoperire); altfel, ordine aleasa de utilizator prin drag&drop
    activeCategories: null, // null = implicit ['Actualitati']; altfel, ultima selectie facuta de utilizator
    activeSources: null, // null = toate sursele din categoriile active; altfel, ultima ingustare facuta
    hideRead: false, // true = articolele deja deschise nu mai apar in lista
    textAlign: 'justify' // 'justify' | 'left' - alinierea textului din articole
  };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
    } catch {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings(settings) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  }

  let settings = loadSettings();

  // ---- Aplicarea setărilor vizuale ----
  function resolvedTheme() {
    if (settings.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return settings.theme;
  }

  function applyVisualSettings() {
    const theme = resolvedTheme();
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.fontSize = settings.fontSize;
    document.documentElement.dataset.textAlign = settings.textAlign === 'left' ? 'left' : 'justify';

    const shade = SHADE_PRESETS.find(s => s.id === settings.shade) || SHADE_PRESETS[0];
    document.documentElement.style.setProperty('--ink', theme === 'dark' ? shade.dark : shade.light);

    const font = FONT_PRESETS.find(f => f.id === settings.fontFamily) || FONT_PRESETS[0];
    loadFontPreset(font.id);
    document.documentElement.style.setProperty('--font-title', font.title);
    document.documentElement.style.setProperty('--font-body', font.body);

    const themeColorMeta = document.getElementById('themeColorMeta');
    if (themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#181B18' : '#2C5F63');

    // Sincronizam ambele slidere de marime text (sus si jos) cu setarea curenta
    const sliderTop = document.getElementById('fontSizeSliderTop');
    const sliderBottom = document.getElementById('fontSizeSliderBottom');
    if (sliderTop) sliderTop.value = settings.fontSize;
    if (sliderBottom) sliderBottom.value = settings.fontSize;

    if (typeof updateStickyOffsets === 'function') updateStickyOffsets(); // fontul poate schimba usor inaltimea taburilor
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (settings.theme === 'system') applyVisualSettings();
  });

  // ---- Construirea taburilor tip "segmented" ----
  function wireSegmented(groupEl, currentValue, onPick) {
    Array.from(groupEl.children).forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.value === currentValue));
      btn.addEventListener('click', () => {
        onPick(btn.dataset.value);
        Array.from(groupEl.children).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      });
    });
  }

  // ---- Pagina de Setari (randata in #main, navigabila ca un articol) ----
  function navigateToSettings() {
    history.pushState({ view: 'settings' }, '');
    hasForwardEntry = false;
    renderSettingsView();
  }

  function renderSettingsView() {
    currentView = 'settings';
    updateNavButtons();
    window.scrollTo(0, 0);

    mainEl.innerHTML = `
      <div class="settings-page">
        <button class="back-btn" id="backBtn">Înapoi la titluri</button>
        <h1 class="reading-title" style="margin-bottom:0.9rem;">Setări</h1>

        <button class="help-link-btn" id="helpLinkBtn">❓ Ajutor și informații despre aplicație</button>

        <div class="settings-row">
          <div class="settings-col">
            <div class="settings-group">
              <p class="settings-label">Temă</p>
              <div class="segmented" id="themeGroup">
                <button data-value="light">Deschis</button>
                <button data-value="dark">Întunecat</button>
                <button data-value="system">Automat</button>
              </div>
            </div>

            <div class="settings-group">
              <p class="settings-label">Font</p>
              <div class="segmented" id="fontFamilyGroup"></div>
            </div>
          </div>

          <div class="settings-col">
            <div class="settings-group">
              <p class="settings-label">Nuanță text</p>
              <div class="segmented" id="shadeGroup"></div>
            </div>

            <div class="settings-group">
              <p class="settings-label">Articole citite</p>
              <div class="segmented" id="hideReadGroup">
                <button data-value="show">Afișează</button>
                <button data-value="hide">Ascunde</button>
              </div>
            </div>

            <div class="settings-group">
              <p class="settings-label">Aliniere text articol</p>
              <div class="segmented" id="textAlignGroup">
                <button data-value="justify">Justificat</button>
                <button data-value="left">Stânga</button>
              </div>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <p class="settings-label">Ordinea categoriilor</p>
          <p class="settings-hint">Trage de ⠿ sau folosește săgețile. Ordinea se aplică imediat pe prima pagină.</p>
          <ul class="order-list" id="categoryOrderList"></ul>
        </div>

        <div class="settings-group">
          <p class="settings-label">Surse pe prima pagină</p>
          <p class="settings-hint">Bifează sursele pe care vrei să le vezi și aranjează-le în ordinea preferată. Ordinea e folosită în selectorul „Surse" de pe prima pagină.</p>
          <div id="sourceChecklist"></div>
          <button class="select-all-btn" id="selectAllBtn">Selectează toate sursele</button>
        </div>

        <div class="settings-group">
          <p class="settings-label">Articole salvate offline</p>
          <p class="offline-info" id="offlineInfo">Se calculează…</p>
          <button class="select-all-btn" id="offlineClearBtn">Șterge articolele offline</button>
        </div>
      </div>`;

    document.getElementById('backBtn').addEventListener('click', goBackInApp);
    document.getElementById('helpLinkBtn').addEventListener('click', navigateToHelp);

    wireSegmented(document.getElementById('themeGroup'), settings.theme, value => {
      settings.theme = value; saveSettings(settings); applyVisualSettings();
    });

    wireSegmented(document.getElementById('hideReadGroup'), settings.hideRead ? 'hide' : 'show', value => {
      settings.hideRead = value === 'hide'; saveSettings(settings);
    });
    wireSegmented(document.getElementById('textAlignGroup'), settings.textAlign === 'left' ? 'left' : 'justify', value => {
      settings.textAlign = value; saveSettings(settings); applyVisualSettings();
    });

    updateOfflineInfo();
    document.getElementById('offlineClearBtn').addEventListener('click', async () => {
      await offlineClear();
      updateOfflineInfo();
    });

    const fontFamilyGroup = document.getElementById('fontFamilyGroup');
    FONT_PRESETS.forEach(p => loadFontPreset(p.id)); // pentru previzualizarea butoanelor
    FONT_PRESETS.forEach(preset => {
      const btn = document.createElement('button');
      btn.dataset.value = preset.id;
      btn.style.fontFamily = preset.title;
      btn.textContent = preset.label;
      fontFamilyGroup.appendChild(btn);
    });
    wireSegmented(fontFamilyGroup, settings.fontFamily, value => {
      settings.fontFamily = value; saveSettings(settings); applyVisualSettings();
    });

    const shadeGroup = document.getElementById('shadeGroup');
    SHADE_PRESETS.forEach(preset => {
      const btn = document.createElement('button');
      btn.dataset.value = preset.id;
      btn.title = preset.label;
      btn.setAttribute('aria-label', preset.label);
      const previewColor = resolvedTheme() === 'dark' ? preset.dark : preset.light;
      btn.innerHTML = `<span class="shade-dot" style="background:${previewColor}"></span>`;
      shadeGroup.appendChild(btn);
    });
    wireSegmented(shadeGroup, settings.shade, value => {
      settings.shade = value; saveSettings(settings); applyVisualSettings();
    });

    renderCategoryOrderList();
    renderSourceChecklist();
  }

  // ---- Pagina de Ajutor ----
  function navigateToHelp() {
    history.pushState({ view: 'help' }, '');
    hasForwardEntry = false;
    renderHelpView();
  }

  function renderHelpView() {
    currentView = 'help';
    updateNavButtons();
    window.scrollTo(0, 0);

    mainEl.innerHTML = `
      <div class="settings-page">
        <button class="back-btn" id="backBtn">Înapoi la setări</button>
        <h1 class="reading-title" style="margin-bottom:1rem;">Ajutor și informații</h1>
        <button class="help-link-btn" id="shareAppBtn">Recomandă aplicația unui prieten</button>

        <div class="settings-group">
          <p class="settings-label">Cum funcționează aplicația</p>
          <div class="help-text">
            <p><strong>Categorii și surse.</strong> Taburile de sus filtrează lista după subiect (Actualități, Sport, Vremea etc.); poți selecta mai multe deodată. Sub ele, rândul „Surse" se deschide la atingere și îți arată sursele categoriilor alese (la Internațional, grupate pe limbi), ca să îngustezi la una sau câteva. Din Setări alegi ce surse apar și în ce ordine, plus ordinea categoriilor.</p>
            <p><strong>Vremea.</strong> Nu e o sursă anume — adună automat, din toate sursele, orice titlu care pare legat de vreme/meteo/prognoze.</p>
            <p><strong>Căutare.</strong> Iconița 🔍 din header deschide o casetă care filtrează titlurile pe măsură ce tastezi.</p>
            <p><strong>Favorite.</strong> Steluța de pe fiecare titlu (☆/★) salvează articolul într-o listă proprie, accesibilă din iconița ★ din header — rămâne acolo chiar dacă articolul dispare din lista curentă.</p>
            <p><strong>Citite.</strong> Titlurile deja deschise apar estompate, ca să știi ce ai văzut deja.</p>
            <p><strong>Offline.</strong> Linkul „⬇ Descarcă pentru offline" de sub titlul aplicației salvează textul articolelor din secțiunea curentă, ca să le poți citi fără internet (utilă mai ales la drum).</p>
            <p><strong>Setări.</strong> Temă (deschis/întunecat/automat), 3 variante de font, nuanță de culoare a textului și alegerea surselor afișate.</p>
            <p><strong>Mărimea textului.</strong> Slider-ul de lângă butoanele de navigare (sus și jos) mărește doar titlurile din listă și textul articolelor — restul aplicației rămâne la mărimea normală.</p>
            <p><strong>Navigare.</strong> Butoanele ← Înapoi / Înainte → (sus și jos) funcționează ca butoanele unui browser; butonul fizic de „înapoi" al telefonului face același lucru.</p>
            <p><strong>Reîmprospătare.</strong> Butonul ↻ din header aduce ultimele știri. Aplicația se reîmprospătează și singură când revii în ea după mai mult de 5 minute.</p>
            <p><strong>Distribuie.</strong> În pagina unui articol, butonul „Distribuie" trimite linkul articolului original prin aplicațiile telefonului.</p>
            <p><strong>Aliniere.</strong> Textul articolelor e justificat (distribuit egal între margini), cu despărțire automată în silabe. Titlurile rămân aliniate la stânga. Din Setări poți alege și alinierea la stânga pentru text.</p>
            <p><strong>Articole citite.</strong> Din Setări poți alege să ascunzi articolele deja deschise, ca să vezi doar ce e nou.</p>
            <p><strong>Articole în alte limbi.</strong> Pentru sursele în franceză, engleză sau germană, butoanele și mesajele din pagina articolului apar în limba sursei. Dacă textul nu poate fi afișat, pagina spune pe scurt de ce (site blocat, abonament etc.) și oferă linkul către articolul original.</p>
            <p><strong>Ore aproximative (≈).</strong> Unele surse nu publică ora reală a articolului online (de exemplu Ziarul Lumina folosește data ediției tipărite). Pentru acestea, ora marcată cu ≈ e momentul în care aplicația a găsit prima dată articolul.</p>
          </div>
        </div>

        <div class="settings-group">
          <p class="settings-label">Despre conținut</p>
          <div class="help-text">
            <p>Articolele sunt preluate din fluxurile publice RSS/Atom ale surselor selectate — titlu, dată, sursă și, dacă feedul o oferă, o imagine asociată. Drepturile asupra conținutului aparțin publicațiilor originale; deschiderea unui articol în aplicație afișează textul extras, dar linkul către sursa originală e mereu disponibil.</p>
            <p>Ordinea și frecvența știrilor depind în întregime de fiecare sursă — aplicația nu întârzie și nu grăbește nimic, doar centralizează ce publică ele.</p>
          </div>
        </div>

        <div class="settings-group">
          <p class="settings-label">Confidențialitate</p>
          <div class="help-text">
            <p>Aplicația nu cere cont, nu afișează reclame, nu vinde date personale și nu folosește cookie-uri de publicitate. Preferințele tale (temă, font, surse alese, favorite) sunt salvate doar local, pe acest dispozitiv.</p>
            <p>Găzduirea (GitHub Pages și Cloudflare) poate procesa date tehnice minime — adresă IP, informații despre browser — conform politicilor proprii ale acestor servicii, independent de aplicație.</p>
          </div>
        </div>

        <div class="settings-group">
          <p class="settings-label">Ce este și ce nu este acest site</p>
          <div class="help-text">
            <p>„Știri în neștire" e un agregator personal de știri. Nu produce jurnalism propriu și nu garantează corectitudinea materialelor publicate de sursele externe. Rolul lui e doar să centralizeze titluri și să faciliteze descoperirea lor — pentru context complet și verificare, consultă întotdeauna articolul-sursă.</p>
          </div>
        </div>
      </div>`;

    document.getElementById('backBtn').addEventListener('click', goBackInApp);
    const shareAppBtn = document.getElementById('shareAppBtn');
    shareAppBtn.addEventListener('click', () =>
      shareLink('Știri în neștire — știri fără reclame', new URL('./', location.href).href, shareAppBtn));
  }

  // ---- Pagina de Favorite ----
  function navigateToFavorites() {
    history.pushState({ view: 'favorites' }, '');
    hasForwardEntry = false;
    renderFavoritesView();
  }

  function renderFavoritesView() {
    currentView = 'favorites';
    updateNavButtons();
    window.scrollTo(0, 0);

    mainEl.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'settings-page';
    wrap.innerHTML = `
      <button class="back-btn" id="backBtn">Înapoi la titluri</button>
      <h1 class="reading-title" style="margin-bottom:1rem;">Favorite</h1>`;
    mainEl.appendChild(wrap);
    document.getElementById('backBtn').addEventListener('click', goBackInApp);

    if (favorites.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'state';
      empty.textContent = 'Niciun articol favorit încă. Apasă pe steluță lângă un titlu ca să-l salvezi aici.';
      wrap.appendChild(empty);
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list';
    ul.style.margin = '0 -1.25rem'; // aliniaza cu marginile paginii, la fel ca lista principala

    favorites.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item';

      const btn = document.createElement('button');
      btn.className = 'item-btn';
      if (item.image) {
        const img = document.createElement('img');
        img.className = 'item-thumb';
        img.src = `${WORKER_URL}?image=${encodeURIComponent(item.image)}`;
        img.alt = '';
        img.loading = 'lazy';
        img.addEventListener('error', () => img.remove());
        btn.appendChild(img);
      }
      const textWrap = document.createElement('div');
      textWrap.className = 'item-text';
      const title = document.createElement('p');
      title.className = 'item-title' + (readLinks.has(item.link) ? ' is-read' : '');
      title.textContent = item.title;
      const meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.innerHTML = `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span>`;
      textWrap.appendChild(title);
      textWrap.appendChild(meta);
      btn.appendChild(textWrap);
      btn.addEventListener('click', () => navigateToArticle(item));

      const star = document.createElement('button');
      star.className = 'fav-star active';
      star.setAttribute('aria-label', 'Scoate din favorite');
      star.textContent = '★';
      star.addEventListener('click', () => {
        toggleFavorite(item);
        renderFavoritesView(); // reafisam lista, fara elementul scos
      });

      li.appendChild(btn);
      li.appendChild(star);
      ul.appendChild(li);
    });
    wrap.appendChild(ul);
  }

  // ---- Header: buton de cautare (butoanele statice, cablate o singura data) ----
  function initHeaderButtons() {
    document.getElementById('settingsBtn').addEventListener('click', () => {
      navigateToSettings();
    });
    document.getElementById('favoritesBtn').addEventListener('click', () => {
      navigateToFavorites();
    });
    document.getElementById('offlineDownloadBtn').addEventListener('click', downloadOfflineArticles);
    document.getElementById('refreshBtn').addEventListener('click', () => loadFeed({ mode: 'manual' }));

    // Slider-ul de marime text - doua instante (sus/jos), tinute sincronizate
    const sliderTop = document.getElementById('fontSizeSliderTop');
    const sliderBottom = document.getElementById('fontSizeSliderBottom');
    function onFontSizeInput(e) {
      settings.fontSize = e.target.value;
      saveSettings(settings);

  // Reordonare verticala, prin maner (⠿). Doar manerul preia gestul (touch-action: none),
  // deci derularea paginii ramane normala oriunde altundeva pe rand - fara conflictele
  // dintre atingere, tragere si derulare avute pe butoanele orizontale.
  function makeVerticalSortable(list, onChange) {
    const line = document.createElement('div');
    line.className = 'order-drop-line';
    list.appendChild(line);

    list.querySelectorAll('.drag-handle').forEach(handle => {
      handle.addEventListener('contextmenu', e => e.preventDefault());
      handle.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        e.preventDefault();
        const row = handle.closest('.order-row');
        const pointerId = e.pointerId;
        const startY = e.clientY;
        const startScroll = window.scrollY;
        let lastY = e.clientY;
        let dropIndex = null;
        let autoScroll = null;
        row.classList.add('dragging');
        try { handle.setPointerCapture(pointerId); } catch {}

        const rows = () => [...list.querySelectorAll('.order-row')].filter(r => r !== row);
        function update() {
          row.style.transform = `translateY(${lastY - startY + window.scrollY - startScroll}px)`;
          const others = rows();
          dropIndex = others.length;
          for (let i = 0; i < others.length; i++) {
            const r = others[i].getBoundingClientRect();
            if (lastY < r.top + r.height / 2) { dropIndex = i; break; }
          }
          const listTop = list.getBoundingClientRect().top;
          let y;
          if (others.length === 0) y = 0;
          else if (dropIndex >= others.length) y = others[others.length - 1].getBoundingClientRect().bottom - listTop;
          else y = others[dropIndex].getBoundingClientRect().top - listTop;
          line.style.top = `${y - 1.5}px`;
          line.style.display = 'block';
        }
        function tick() {
          // derulare automata cand tragi aproape de marginea ecranului
          const edge = 90;
          let dy = 0;
          if (lastY < edge) dy = -8; else if (lastY > window.innerHeight - edge) dy = 8;
          if (dy) { window.scrollBy(0, dy); update(); }
          autoScroll = requestAnimationFrame(tick);
        }
        function onMove(ev) {
          if (ev.pointerId !== pointerId) return;
          ev.preventDefault();
          lastY = ev.clientY;
          update();
        }
        function onUp(ev) {
          if (ev.pointerId !== pointerId) return;
          cancelAnimationFrame(autoScroll);
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
          try { handle.releasePointerCapture(pointerId); } catch {}
          row.classList.remove('dragging');
          row.style.transform = '';
          line.style.display = 'none';
          if (dropIndex !== null) {
            const others = rows();
            if (dropIndex >= others.length) list.insertBefore(row, line);
            else list.insertBefore(row, others[dropIndex]);
            refreshArrowStates(list);
            onChange();
          }
        }
        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        update();
        autoScroll = requestAnimationFrame(tick);
      });
    });

    list.querySelectorAll('.order-arrows button').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.order-row');
        if (btn.dataset.dir === 'up' && row.previousElementSibling) {
          list.insertBefore(row, row.previousElementSibling);
        } else if (btn.dataset.dir === 'down' && row.nextElementSibling && row.nextElementSibling.classList.contains('order-row')) {
          list.insertBefore(row.nextElementSibling, row);
        } else {
          return;
        }
        refreshArrowStates(list);
        onChange();
      });
    });
    refreshArrowStates(list);
  }

  function refreshArrowStates(list) {
    const rowsInList = [...list.querySelectorAll('.order-row')];
    rowsInList.forEach((r, i) => {
      r.querySelector('[data-dir="up"]').disabled = i === 0;
      r.querySelector('[data-dir="down"]').disabled = i === rowsInList.length - 1;

  // ---- Stare ----
  let allItems = [];

  // ---- Citite si Favorite (localStorage - liste mici, doar metadate) ----
  const READ_KEY = 'stiriNestireRead';
  const READ_CAP = 300; // pastram doar ultimele N, ca sa nu creasca la nesfarsit
  const FAV_KEY = 'stiriNestireFavorites';

  function loadReadLinks() {

  }
  function saveReadLinks() {

  function toggleFavorite(item) {

  // ---- Cache offline pentru text de articole (IndexedDB - poate creste mult mai mult) ----
  const OFFLINE_DB_NAME = 'stiriNestireOffline';
  const OFFLINE_STORE = 'articles';

  function openOfflineDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB indisponibil')); return; }
      const req = indexedDB.open(OFFLINE_DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(OFFLINE_STORE)) {
          req.result.createObjectStore(OFFLINE_STORE, { keyPath: 'link' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function offlineGet(link) {
    try {
      const db = await openOfflineDB();
      return await new Promise((resolve, reject) => {
        const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).get(link);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch { return null; }
  }
  async function offlineSet(entry) {
    try {
      const db = await openOfflineDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        tx.objectStore(OFFLINE_STORE).put(entry);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  async function offlineGetAllKeys() {
    try {
      const db = await openOfflineDB();
      return await new Promise((resolve, reject) => {
        const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    } catch { return []; }
  }

  async function offlineClear() {
    try {
      const db = await openOfflineDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        tx.objectStore(OFFLINE_STORE).clear();
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  // Articolele offline mai vechi de 14 zile se sterg singure la pornire,
  // ca spatiul ocupat pe telefon sa nu creasca la nesfarsit.
  const OFFLINE_MAX_AGE_MS = 14 * 24 * 60 * 60 * 1000;
  async function offlinePrune() {
    try {
      const db = await openOfflineDB();
      const limit = Date.now() - OFFLINE_MAX_AGE_MS;
      await new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        const req = tx.objectStore(OFFLINE_STORE).openCursor();
        req.onsuccess = () => {
          const cursor = req.result;
          if (!cursor) return;
          if (!cursor.value.cachedAt || cursor.value.cachedAt < limit) cursor.delete();
          cursor.continue();
        };
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  async function updateOfflineInfo() {
    const el = document.getElementById('offlineInfo');
    if (!el) return;
    const count = (await offlineGetAllKeys()).length;
    el.textContent = count === 0
      ? 'Niciun articol salvat. (Se șterg automat după 14 zile.)'
      : `${count} ${count === 1 ? 'articol salvat' : 'articole salvate'}. Se șterg automat după 14 zile.`;
  }

  // Descarca, la cerere (buton), textul articolelor din sectiunea curent
  // selectata, fara poze (doar text - cat mai usor). Sare peste ce e deja
  // descarcat, ca sa nu reia acelasi lucru de fiecare data.
  async function downloadOfflineArticles() {
    const btn = document.getElementById('offlineDownloadBtn');
    const statusEl = document.getElementById('offlineStatus');
    const setStatus = text => {
      statusEl.textContent = text;
      statusEl.classList.toggle('visible', Boolean(text));
    };

    const pool = poolItems();
    if (pool.length === 0) {
      setStatus('Nimic de descărcat momentan.');
      setTimeout(() => setStatus(''), 2500);
      return;
    }
    const cachedKeys = new Set(await offlineGetAllKeys());
    const toDownload = pool.filter(i => !cachedKeys.has(i.link)).slice(0, 40);
    if (toDownload.length === 0) {
      setStatus('Ai deja tot descărcat pentru offline.');
      setTimeout(() => setStatus(''), 2500);
      return;
    }

    if (btn) btn.disabled = true;
    setStatus(`Se pregătesc ${toDownload.length} articole pentru offline…`);

    let done = 0;
    let idx = 0;
    async function worker() {
      while (idx < toDownload.length) {
        const item = toDownload[idx++];
        try {
          const res = await fetch(`${WORKER_URL}?article=${encodeURIComponent(item.link)}`);
          const data = await res.json();
          await offlineSet({ link: item.link, title: item.title, source: item.source, date: item.date, text: data.text || '', cachedAt: Date.now() });
        } catch {}
        done++;
        setStatus(`Se pregătesc articole pentru offline… (${done}/${toDownload.length})`);
      }
    }
    await Promise.all([worker(), worker(), worker()]); // 3 cereri simultane
    setStatus(`Gata — ${toDownload.length} articole salvate pentru offline.`);
    setTimeout(() => setStatus(''), 3000);
    if (btn) btn.disabled = false;
  }

  const CATEGORY_LABELS = {
    Actualitati: 'Actualități',
    Vremea: 'Vremea',
    Sport: 'Sport',
    Financiar: 'Financiar',
    IT: 'IT/Tech',
    Religie: 'Religie',
    Cultura: 'Cultură',
    International: 'Internațional'
  };
  const CATEGORY_ORDER = ['Actualitati', 'Vremea', 'Sport', 'Financiar', 'IT', 'Religie', 'Cultura', 'International'];

  // 'Vremea' nu e o categorie legata de o sursa anume - e un filtru dupa cuvinte
  // cheie in titlu, aplicat peste sursele de Actualitati generale (nu Sport,
  // Religie, Financiar, IT sau Cultura - acolo vremea n-are ce cauta).
  // Ca sa evitam fals-pozitive (ex. "vreme" insemnand si "timp", "furtuna"
  // folosit metaforic despre scandaluri), cerem fie un semnal PUTERNIC de unul
  // singur (ANM, cod rosu/portocaliu/galben, "fenomene meteo", viscol, canicula),
  // fie cel putin DOUA semnale slabe impreuna (ploi, temperaturi, frig, etc.).
  // Potrivirea ignora diacriticele: multe site-uri scriu inca "ş/ţ" cu sedila, altele
  // "ș/ț" cu virgula, altele deloc - toate devin aici aceleasi litere simple.
  function normalizeForMatch(str) {
    return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function normalizedKeywords(list) {
    return [...new Set(list.map(normalizeForMatch))];
  }
  const WEATHER_STRONG = normalizedKeywords([
    'anm', 'cod rosu', 'cod portocaliu', 'cod galben',
    'prognoza meteo', 'fenomene meteo', 'alerta meteo', 'avertizare meteo',
    'viscol', 'canicul', 'ninsoare', 'ninsori', 'meteorolog',
    'val de caldura', 'val de frig'
  ]);
  // Fiecare cuvant slab e distinct ("vremea" nu mai numara dublu, fiind inclus in "vreme").
  const WEATHER_WEAK = normalizedKeywords([
    'ploi', 'ploaie', 'vreme', 'temperatur', 'grade',
    'racoare', 'frig', 'caldura', 'meteo',
    'seceta', 'inundat', 'grindin', 'polei',
    'zapada', 'inghet', 'prognoz', 'furtun', 'vijelie'
  ]);
  // Cuvintele foarte scurte (ex. "anm") se cauta doar ca vorba intreaga.
  function containsKeyword(text, keyword) {
    if (keyword.length <= 3) return new RegExp(`\\b${keyword}\\b`).test(text);
    return text.includes(keyword);
  }
  // Doar sursele romanesti de actualitate: vremea n-are ce cauta la Sport sau IT,
  // iar in titlurile straine abrevieri ca "ANM" ar da potriviri false.
  function isGeneralNewsSource(sourceName) {
    const meta = sourceMeta.find(s => s.name === sourceName);
    return Boolean(meta && meta.category === 'Actualitati' && meta.country === 'RO');
  }
  function isWeatherItem(item) {
    if (!isGeneralNewsSource(item.source)) return false;
    const t = normalizeForMatch(item.title);
    if (WEATHER_STRONG.some(k => containsKeyword(t, k))) return true;
    return WEATHER_WEAK.filter(k => containsKeyword(t, k)).length >= 2;
  }
  function hasWeatherItems() {
    const names = new Set(effectiveSources());
    return allItems.some(i => names.has(i.source) && isWeatherItem(i));
  }

  const tabsEl = document.getElementById('tabs');
  const subTabsEl = document.getElementById('subTabs');
  const mainEl = document.getElementById('main');

  // Masoara inaltimile reale ale barei fixe de sus si ale randului de taburi de
  // categorii, si le pune in variabile CSS - astfel randul de taburi si cel de
  // surse (position: sticky) se lipesc exact sub bara fixa, indiferent de
  // safe-area (notch) sau de cat de mare e fontul ales de utilizator.
  function updateStickyOffsets() {
    const navBarTop = document.getElementById('navBarTop');
    if (navBarTop) {
      document.documentElement.style.setProperty('--navbar-top-h', `${navBarTop.getBoundingClientRect().height}px`);
    }
    if (tabsEl && tabsEl.getBoundingClientRect().height > 0) {
      document.documentElement.style.setProperty('--tabs-h', `${tabsEl.getBoundingClientRect().height}px`);
    }
  }
  window.addEventListener('resize', updateStickyOffsets);
  window.addEventListener('orientationchange', updateStickyOffsets);
  window.addEventListener('load', updateStickyOffsets); // fonturile Google incarcate cu putin timp in urma pot schimba usor inaltimile

  // ---- Utilitare culoare pe sursă ----
  const TAG_PALETTE = ['#2C5F63', '#8B3E32', '#6B5B95', '#4C6E3C', '#8A6D1F', '#3D5A80'];
  function colorForSource(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return TAG_PALETTE[hash % TAG_PALETTE.length];
  }

  // O sursa poate raporta o data din viitor (eroare/programare editoriala, ex.
  // Ziarul Lumina foloseste data editiei tiparite de duminica pentru tot ce
  // publica online in cursul saptamanii). Nu avem cum sa aflam ora reala de
  // publicare in cazul asta, asa ca preferam sa n-o afisam deloc, in loc sa
  // aratam o ora gresita.
  function isFutureDate(dateStr) {
    const parsed = new Date(dateStr).getTime();
    return !isNaN(parsed) && parsed > Date.now();
  }

  function formatRelativeTime(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    const diffMs = Date.now() - date.getTime();
    const diffMin = Math.max(0, Math.round(diffMs / 60000)); // o data din viitor (surse cu erori) devine "chiar acum"
    if (diffMin < 1) return 'chiar acum';
    if (diffMin < 60) return `acum ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `acum ${diffH} h`;
    const diffD = Math.round(diffH / 24);
    return `acum ${diffD} zile`;
  }

  // Timpul folosit la SORTARE: o data din viitor (eroare de sursa) e adusa la "acum",
  // ca sa nu ramana fixata permanent in capul listei, inaintea stirilor reale mai proaspete.
  function effectiveTimestamp(dateStr) {
    const parsed = new Date(dateStr).getTime();
    if (isNaN(parsed)) return 0;
    return Math.min(parsed, Date.now());
  }

  const DATE_LOCALES = { ro: 'ro-RO', fr: 'fr-FR', en: 'en-GB', de: 'de-DE' };
  function formatFullDate(dateStr, lang = 'ro') {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    return date.toLocaleString(DATE_LOCALES[lang] || 'ro-RO', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  // Escapeaza si ghilimelele (varianta veche nu o facea), ca textul sa fie sigur
  // si in interiorul atributelor HTML.
  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function isHttpLink(url) {
    try { const u = new URL(url); return u.protocol === 'https:' || u.protocol === 'http:'; } catch { return false; }
  }
  // Linkurile vin din feed-uri externe: acceptam doar http(s), niciodata "javascript:" etc.
  function safeHref(url) {
    return isHttpLink(url) ? escapeHtml(new URL(url).href) : '#';
  }

  // ---- Sursele "efective" (cele bifate in setari) ----
  function discoveredSourceNames() {
    return sourceMeta.map(s => s.name);
  }
  function effectiveSources() {
    const discovered = discoveredSourceNames();
    return settings.selectedSources ? settings.selectedSources.filter(s => discovered.includes(s)) : discovered;
  }
  // Sursele (cu metadate), bifate in setari, care apartin unei anumite categorii.
  // 'International' = orice sursa cu country !== 'RO', DAR nu si cele deja
  // incadrate la IT/Tech (acelea apar doar acolo, ca sa nu se duplice).
  // 'IT' e singura categorie care accepta si surse internationale (ex. XDA
  // Developers), pentru ca subiectul conteaza mai mult decat tara aici.
  function sourcesInCategory(category) {
    if (category === 'Vremea') return []; // nu e legata de surse, e un filtru pe continut
    const active = new Set(effectiveSources());
    return sourceMeta.filter(s => {
      if (!active.has(s.name)) return false;
      if (category === 'International') return s.country !== 'RO' && s.category !== 'IT';
      if (category === 'IT') return s.category === 'IT';
      return s.category === category && s.country === 'RO';
    });
  }
  // Reuniunea surselor din toate categoriile active (pentru randul secundar de chip-uri)
  function sourcesInActiveCategories() {
    const seen = new Map();
    activeCategories.forEach(cat => {
      sourcesInCategory(cat).forEach(s => seen.set(s.name, s));
    });
    return Array.from(seen.values());
  }
  function poolItems() {
    const names = effectiveSources();
    let items = allItems.filter(i => names.includes(i.source));

    if (activeCategories.size > 0) {
      const structuralCats = Array.from(activeCategories).filter(c => c !== 'Vremea');
      const wantsWeather = activeCategories.has('Vremea');

      let combined = [];
      if (structuralCats.length > 0) {
        const namesInCats = new Set();
        structuralCats.forEach(cat => sourcesInCategory(cat).forEach(s => namesInCats.add(s.name)));
        combined = combined.concat(items.filter(i => namesInCats.has(i.source)));
      }
      if (wantsWeather) {
        combined = combined.concat(items.filter(isWeatherItem));
      }
      const seenLinks = new Set();
      items = combined.filter(i => {
        if (seenLinks.has(i.link)) return false;
        seenLinks.add(i.link);
        return true;
      });
    }

    if (activeSources.size > 0) {
      // Aplicam doar sursele din activeSources care apartin categoriilor curent
      // active (sau, daca nu e nicio categorie activa, orice sursa efectiva).
      // Restul raman memorate in activeSources, fara efect acum, dar gata sa
      // redevina relevante daca utilizatorul reselecteaza categoria potrivita.
      const validScope = activeCategories.size > 0
        ? new Set(sourcesInActiveCategories().map(s => s.name))
        : new Set(names);
      const effectiveNarrow = new Set(Array.from(activeSources).filter(n => validScope.has(n)));
      if (effectiveNarrow.size > 0) {
        items = items.filter(i => effectiveNarrow.has(i.source));
      }
    }
    if (searchQuery) {
      items = items.filter(i => i.title.toLowerCase().includes(searchQuery));
    }
    if (settings.hideRead) {
      items = items.filter(i => !readLinks.has(i.link));
    }
    return items;
  }

  // Aplica o ordine aleasa de utilizator (prin drag&drop) peste o lista de
  // elemente; elementele care nu apar in ordinea salvata raman la coada,
  // in ordinea lor naturala.
  function applyCustomOrder(items, orderArray, keyFn) {
    if (!orderArray || orderArray.length === 0) return items;
    const indexOf = id => { const i = orderArray.indexOf(id); return i === -1 ? Infinity : i; };
    return [...items].sort((a, b) => indexOf(keyFn(a)) - indexOf(keyFn(b)));
  }

  // ---- Randare taburi (categorii, selectie multipla) ----
  // Categoriile care au cel putin o sursa activa, in ordinea aleasa in Setari.
  // (Vremea e vizibila cat timp exista surse romanesti de actualitate.)
  function visibleCategories() {
    return applyCustomOrder(
      CATEGORY_ORDER.filter(c => c === 'Vremea' ? sourcesInCategory('Actualitati').length > 0 : sourcesInCategory(c).length > 0),
      settings.categoryOrder,
      c => c
    );
  }

  function renderTabs() {
    const categories = visibleCategories();
    tabsEl.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.dataset.cat = cat;
      btn.textContent = CATEGORY_LABELS[cat] || cat;
      btn.setAttribute('aria-pressed', String(activeCategories.has(cat)));
      btn.addEventListener('click', () => {
        if (activeCategories.has(cat)) activeCategories.delete(cat); else activeCategories.add(cat);
        // NU stergem activeSources aici - o ingustare facuta intr-o categorie ramane
        // memorata chiar daca deselectezi si reselectezi categoria mai tarziu.
        // poolItems() ignora, fara sa distruga, sursele care nu mai apartin
        // categoriilor curent active.
        saveActiveFilters();
        renderTabs();
        renderSourceChips();
        renderList();
      });
      tabsEl.appendChild(btn);
    });
    // Pe doua randuri inaltimea barei se poate schimba: recalculam pozitia barei de surse.
    updateStickyOffsets();
  }

  // ---- Selectorul de surse: un rand-rezumat care se deschide intr-un panou ----
  // Inlocuieste randul de butoane derulat lateral. Inchis ocupa un singur rand subtire;
  // deschis arata toate sursele pe mai multe randuri, grupate (la Internațional, pe limbi).
  const LANG_LABELS = { fr: 'Franceză', en: 'Engleză', de: 'Germană', ro: 'Română' };
  const LANG_ORDER = ['ro', 'fr', 'en', 'de'];
  let sourcePanelOpen = false;

  function sourcePickerGroups(sources) {
    const cats = visibleCategories().filter(c => activeCategories.has(c) && c !== 'Vremea');
    const groups = [];
    cats.forEach(cat => {
      const inCat = new Set(sourcesInCategory(cat).map(s => s.name));
      const catSources = sources.filter(s => inCat.has(s.name));
      if (catSources.length === 0) return;
      if (cat === 'International') {
        const langs = [...new Set(catSources.map(s => s.lang || 'ro'))]
          .sort((a, b) => (LANG_ORDER.indexOf(a) + 1 || 99) - (LANG_ORDER.indexOf(b) + 1 || 99));
        langs.forEach(l => groups.push({
          label: `${CATEGORY_LABELS[cat]} · ${LANG_LABELS[l] || l}`,
          sources: catSources.filter(s => (s.lang || 'ro') === l)
        }));
      } else {
        groups.push({ label: CATEGORY_LABELS[cat] || cat, sources: catSources });
      }
    });
    return groups;
  }

  function closeSourcePanel() {
    if (!sourcePanelOpen) return;
    sourcePanelOpen = false;
    renderSourceChips();
  }

  function renderSourceChips() {
    subTabsEl.innerHTML = '';
    const sources = activeCategories.size === 0
      ? []
      : applyCustomOrder(sourcesInActiveCategories(), settings.sourceOrder, s => s.name);
    if (sources.length <= 1) {
      subTabsEl.classList.remove('visible');
      sourcePanelOpen = false;
      return;
    }
    subTabsEl.classList.add('visible');

    const selected = sources.filter(s => activeSources.has(s.name)).map(s => s.name);
    const value = selected.length === 0
      ? `Toate (${sources.length})`
      : selected.length <= 2 ? selected.join(', ') : `${selected.slice(0, 2).join(', ')} +${selected.length - 2}`;

    const summary = document.createElement('button');
    summary.className = 'source-summary';
    summary.type = 'button';
    summary.setAttribute('aria-expanded', String(sourcePanelOpen));
    summary.setAttribute('aria-controls', 'sourcePanel');
    summary.innerHTML = `<span class="ss-label">Surse:</span><span class="ss-value">${escapeHtml(value)}</span><span class="ss-chevron" aria-hidden="true">▾</span>`;
    summary.addEventListener('click', () => {
      sourcePanelOpen = !sourcePanelOpen;
      renderSourceChips();
    });
    subTabsEl.appendChild(summary);

    const panel = document.createElement('div');
    panel.className = 'source-panel';
    panel.id = 'sourcePanel';
    panel.hidden = !sourcePanelOpen;
    const groups = sourcePickerGroups(sources);
    const showLabels = groups.length > 1 || (groups[0] && groups[0].label.includes('·'));
    groups.forEach(g => {
      if (showLabels) {
        const lbl = document.createElement('p');
        lbl.className = 'panel-group-label';
        lbl.textContent = g.label;
        panel.appendChild(lbl);
      }
      const chips = document.createElement('div');
      chips.className = 'panel-chips';
      g.sources.forEach(s => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'tab';
        chip.textContent = s.name;
        chip.setAttribute('aria-pressed', String(activeSources.has(s.name)));
        chip.addEventListener('click', () => {
          if (activeSources.has(s.name)) activeSources.delete(s.name); else activeSources.add(s.name);
          saveActiveFilters();
          renderSourceChips();   // panoul ramane deschis: poti alege mai multe surse la rand
          renderList();
        });
        chips.appendChild(chip);
      });
      panel.appendChild(chips);
    });

    const actions = document.createElement('div');
    actions.className = 'panel-actions';
    actions.innerHTML = `<button type="button" class="panel-link" data-act="all">Toate sursele</button>
      <button type="button" class="panel-done" data-act="done">Gata</button>`;
    actions.querySelector('[data-act="all"]').addEventListener('click', () => {
      sources.forEach(s => activeSources.delete(s.name));
      saveActiveFilters();
      sourcePanelOpen = false;
      renderSourceChips();
      renderList();
    });
    actions.querySelector('[data-act="done"]').addEventListener('click', closeSourcePanel);
    panel.appendChild(actions);
    subTabsEl.appendChild(panel);
  }

  // Panoul se inchide la atingere in afara lui sau cu Escape. composedPath() e calculat
  // la momentul evenimentului, deci functioneaza si cand butonul apasat a fost deja
  // inlocuit in pagina (panoul se redeseneaza la fiecare alegere).
  document.addEventListener('click', e => {
    if (sourcePanelOpen && !e.composedPath().includes(subTabsEl)) closeSourcePanel();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSourcePanel();
  });

  // ---- Randare listă ----
  // Ora afisata langa sursa. Datele estimate (Ziarul Lumina cu data editiei tiparite,
  // Historia fara data) sunt marcate cu "≈" - reprezinta momentul in care Worker-ul
  // a vazut prima oara articolul, nu ora oficiala.
  function relTimeText(item) {
    return (item.dateEstimated ? '≈ ' : '') + formatRelativeTime(item.date);
  }

  function buildListItem(item) {
    const li = document.createElement('li');
    li.className = 'item';

    const btn = document.createElement('button');
    btn.className = 'item-btn';

    if (item.image) {
      const img = document.createElement('img');
      img.className = 'item-thumb';
      img.src = `${WORKER_URL}?image=${encodeURIComponent(item.image)}`;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', () => img.remove());
      btn.appendChild(img);
    }

    const textWrap = document.createElement('div');
    textWrap.className = 'item-text';

    const title = document.createElement('p');
    title.className = 'item-title' + (readLinks.has(item.link) ? ' is-read' : '');
    title.textContent = item.title;

    const meta = document.createElement('div');
    meta.className = 'item-meta';
    const sourceTag = `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span>`;
    meta.innerHTML = isFutureDate(item.date)
      ? sourceTag
      : `${sourceTag}<span>·</span><span class="rel-time" data-date="${escapeHtml(item.date)}" data-est="${item.dateEstimated ? 1 : 0}">${escapeHtml(relTimeText(item))}</span>`;

    textWrap.appendChild(title);
    textWrap.appendChild(meta);
    btn.appendChild(textWrap);
    btn.addEventListener('click', () => navigateToArticle(item));

    const star = document.createElement('button');
    star.className = 'fav-star' + (isFavorite(item.link) ? ' active' : '');
    star.setAttribute('aria-label', 'Favorit');
    star.textContent = isFavorite(item.link) ? '★' : '☆';
    star.addEventListener('click', () => {
      toggleFavorite(item);
      star.classList.toggle('active');
      star.textContent = isFavorite(item.link) ? '★' : '☆';
    });

    li.appendChild(btn);
    li.appendChild(star);
    return li;
  }

  // Lista se construieste in transe de cate 50: prima transa imediat, urmatoarele
  // pe masura ce derulezi spre final. Inainte se construiau toate (sute) la fiecare
  // schimbare de tab, ceea ce se simtea pe telefoanele mai slabe.
  const LIST_PAGE_SIZE = 50;
  let listObserver = null;

  function renderList(options = {}) {
    // Daca lista apare din alta pagina (ex. un tab apasat din Setari, Ajutor sau Favorite),
    // inlocuim intrarea curenta din istoric cu lista. Altfel, "inapoi" dintr-un articol
    // deschis ulterior ar fi dus la pagina de dinainte, nu la titluri.
    if (history.state && history.state.view && history.state.view !== 'list') {
      history.replaceState({ view: 'list' }, '');
      hasForwardEntry = false;
    }
    currentView = 'list';
    const filtered = poolItems();

    if (listObserver) { listObserver.disconnect(); listObserver = null; }
    mainEl.innerHTML = '';

    if (filtered.length === 0) {
      const state = document.createElement('div');
      state.className = 'state';
      const onlyWeather = activeCategories.size === 1 && activeCategories.has('Vremea');
      state.textContent = onlyWeather
        ? 'Nicio știre despre vreme în acest moment. Secțiunea se completează singură când sursele publică prognoze sau avertizări meteo.'
        : settings.hideRead
          ? 'Nicio știre necitită de afișat momentan.'
          : 'Nicio știre de afișat momentan.';
      mainEl.appendChild(state);
      updateNavButtons();
      if (!options.keepScroll) window.scrollTo(0, 0);
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list';
    const sentinel = document.createElement('div');
    sentinel.className = 'list-sentinel';
    mainEl.appendChild(ul);
    mainEl.appendChild(sentinel);

    let rendered = 0;
    function renderMore() {
      const next = filtered.slice(rendered, rendered + LIST_PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      next.forEach(item => fragment.appendChild(buildListItem(item)));
      ul.appendChild(fragment);
      rendered += next.length;
      if (rendered >= filtered.length) {
        if (listObserver) { listObserver.disconnect(); listObserver = null; }
        sentinel.remove();
      }
    }
    renderMore();

    if (rendered < filtered.length) {
      if ('IntersectionObserver' in window) {
        listObserver = new IntersectionObserver(entries => {
          if (entries.some(e => e.isIntersecting)) renderMore();
        }, { rootMargin: '800px' });
        listObserver.observe(sentinel);
      } else {
        while (rendered < filtered.length) renderMore();
      }
    }

    updateNavButtons();
    if (!options.keepScroll) window.scrollTo(0, 0);
  }

  // Orele relative ("acum 5 min") se actualizeaza singure, cat timp aplicatia e deschisa.
  setInterval(() => {
    document.querySelectorAll('.rel-time').forEach(el => {
      el.textContent = (el.dataset.est === '1' ? '≈ ' : '') + formatRelativeTime(el.dataset.date);
    });
  }, 60000);

  // ---- Vizualizare articol ----
  function navigateToArticle(item) {
    const from = currentView === 'favorites' ? 'favorites' : 'list';
    history.pushState({ view: 'article', item, from }, '');
    hasForwardEntry = false; // o navigare noua taie orice ramura de "inainte" existenta
    renderArticleView(item, from);
  }

  // ---- Pagina articolului, in limba sursei ----
  // Cine deschide un articol din Le Figaro citeste oricum in franceza: butoanele si
  // mesajele din pagina articolului apar in aceeasi limba (limba vine de la Worker,
  // declarata per sursa). Restul aplicatiei ramane in romana.

    ro: {

      failTitle: 'Textul articolului nu poate fi afișat aici',
      reasons: {
        blocked: 'Site-ul publicației blochează citirea automată a articolelor.',

        timeout: 'Site-ul publicației nu a răspuns la timp. Încearcă din nou peste puțin timp.',

      }
    },
    fr: {
      back: 'Retour aux titres', backFav: 'Retour aux favoris', share: 'Partager', shareLabel: 'Partager l’article', copied: 'Lien copié ✓', fav: 'Favori',
      loading: 'Chargement de l’article…', original: 'Lire l’article sur le site d’origine',

        empty: 'Le texte n’a pas pu être extrait : l’article est peut-être réservé aux abonnés ou la page a une structure inhabituelle.',
        timeout: 'Le site du média n’a pas répondu à temps. Réessayez dans un instant.',
        offline: 'Pas de connexion internet, et l’article n’a pas été enregistré hors ligne.',

      }
    },
    en: {
      back: 'Back to headlines', backFav: 'Back to favourites', share: 'Share', shareLabel: 'Share the article', copied: 'Link copied ✓', fav: 'Favourite',
      loading: 'Loading article…', original: 'Read the article on the original site',

        error: 'Something went wrong while loading the article.'
