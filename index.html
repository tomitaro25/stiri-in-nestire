<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Știri în neștire</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5F63" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neștire">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F1EFE7;
    --paper-raised: #E9E6DA;
    --ink: #20241F;
    --ink-soft: #5B6058;
    --rule: #D8D4C7;
    --teal: #2C5F63;
    --brick: #8B3E32;
    --max-width: 640px;
  }

  html[data-theme="dark"] {
    --paper: #181B18;
    --paper-raised: #21251F;
    --ink: #ECE8DC;
    --ink-soft: #9AA098;
    --rule: #33372F;
    --teal: #6FB3AC;
    --brick: #D98F7C;
  }

  html[data-font-size="small"] { font-size: 14.5px; }
  html[data-font-size="medium"] { font-size: 16px; }
  html[data-font-size="large"] { font-size: 18px; }
  html[data-font-size="xlarge"] { font-size: 20.5px; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.15s ease, color 0.15s ease;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: var(--max-width);
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }

  /* Masthead */
  header.masthead {
    padding: 1.5rem 1.1rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .wordmark {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.15;
  }

  .tagline {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  button.icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--ink-soft);
    padding: 0.3rem 0.4rem;
    line-height: 1;
    border-radius: 6px;
  }
  button.icon-btn:hover, button.icon-btn:focus-visible { background: var(--paper-raised); }
  button.icon-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* Settings panel */
  .settings-panel {
    border-bottom: 1px solid var(--rule);
    padding: 1rem 1.1rem 1.2rem;
    display: none;
  }
  .settings-panel.open { display: block; }

  .settings-group { margin-bottom: 1rem; }
  .settings-group:last-child { margin-bottom: 0; }

  .settings-label {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 0 0 0.5rem;
  }

  .segmented {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }

  .segmented button {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.4rem 0.7rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .shade-swatch {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .shade-dot {
    width: 0.85rem;
    height: 0.85rem;
    border-radius: 50%;
    border: 1px solid var(--rule);
  }

  .source-checklist {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .source-check {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
  }
  .source-check input { accent-color: var(--teal); width: 1.05rem; height: 1.05rem; }

  .select-all-btn {
    all: unset;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--teal);
    margin-top: 0.4rem;
    display: inline-block;
  }

  /* Source tabs */
  nav.tabs {
    display: flex;
    gap: 0.25rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
  }

  nav.tabs-sub {
    display: none;
    gap: 0.25rem;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
    background: var(--paper-raised);
  }
  nav.tabs-sub.visible { display: flex; }

  .tab {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.44rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab-sub {
    font-size: 0.78rem;
    padding: 0.32rem 0.7rem;
  }

  .tab[aria-pressed="true"] {
    background: var(--paper-raised);
    color: var(--ink);
    border-color: var(--teal);
    font-weight: 600;
  }

  /* Bara de navigare (inapoi/inainte) */
  nav.nav-bar {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--rule);
  }
  nav.nav-bar.nav-bar-bottom {
    border-bottom: none;
    border-top: 1px solid var(--rule);
    margin-top: auto;
  }
  .nav-btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.85rem;
    color: var(--ink);
    border: 1px solid var(--rule);
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
  }
  .nav-btn:disabled {
    color: var(--ink-soft);
    opacity: 0.4;
    cursor: default;
  }
  .nav-btn:not(:disabled):hover { background: var(--paper-raised); }

  /* Lista de articole, cu poza mica optionala */
  main { flex: 1; padding: 0.25rem 0 2.5rem; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { border-bottom: 1px solid var(--rule); }

  button.item-btn {
    all: unset;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    padding: 1rem 1.25rem;
    cursor: pointer;
    box-sizing: border-box;
  }
  button.item-btn:hover, button.item-btn:focus-visible { background: var(--paper-raised); }
  button.item-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }

  .item-thumb {
    flex: 0 0 auto;
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 8px;
    object-fit: cover;
    background: var(--paper-raised);
  }
  .item-text { flex: 1; min-width: 0; }

  .item-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.11rem;
    line-height: 1.3;
    margin: 0 0 0.5rem;
    color: var(--ink);
  }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.81rem;
    color: var(--ink-soft);
  }

  .source-tag { font-weight: 600; }

  /* Reading view */
  .reading { padding: 0.5rem 1.25rem 3.75rem; }

  button.back-btn {
    all: unset;
    display: inline-block;
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--teal);
    padding: 0.75rem 0;
  }
  button.back-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .reading-meta { font-size: 0.81rem; color: var(--ink-soft); margin-bottom: 0.6rem; }

  .reading-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.625rem;
    line-height: 1.28;
    margin: 0 0 1.25rem;
    color: var(--ink);
  }

  .reading-body p {
    font-family: 'Source Serif 4', serif;
    font-size: 1.125rem;
    line-height: 1.6;
    max-width: 66ch;
    margin: 0 0 1.1em;
    color: var(--ink);
  }

  .reading-source-link {
    display: inline-block;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: var(--ink-soft);
  }

  /* States */
  .state { padding: 3.75rem 1.5rem; text-align: center; color: var(--ink-soft); font-size: 0.94rem; }
  .state strong { display: block; color: var(--ink); font-size: 1.06rem; margin-bottom: 0.4rem; font-weight: 600; }

  .retry-btn {
    margin-top: 0.9rem;
    appearance: none;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  /* Banner "versiune noua" / instalare */
  .update-banner {
    display: none;
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
    transform: translateX(-50%);
    max-width: calc(var(--max-width) - 2rem);
    width: calc(100% - 2rem);
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 50;
  }
  .update-banner.visible { display: flex; }
  .update-banner button {
    appearance: none;
    border: 1px solid var(--paper);
    background: transparent;
    color: var(--paper);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="masthead">
      <div>
        <p class="wordmark">Știri în neștire</p>
        <p class="tagline">Titluri, rapid. Fără reclame, fără zgomot.</p>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Setări" aria-expanded="false">⚙</button>
    </header>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-group">
        <p class="settings-label">Temă</p>
        <div class="segmented" id="themeGroup">
          <button data-value="light">Deschis</button>
          <button data-value="dark">Întunecat</button>
          <button data-value="system">Automat</button>
        </div>
      </div>
      <div class="settings-group">
        <p class="settings-label">Mărime text</p>
        <div class="segmented" id="fontSizeGroup">
          <button data-value="small">Mic</button>
          <button data-value="medium">Normal</button>
          <button data-value="large">Mare</button>
          <button data-value="xlarge">Foarte mare</button>
        </div>
      </div>
      <div class="settings-group">
        <p class="settings-label">Nuanță text</p>
        <div class="segmented" id="shadeGroup"></div>
      </div>
      <div class="settings-group">
        <p class="settings-label">Surse afișate</p>
        <div class="source-checklist" id="sourceChecklist"></div>
        <button class="select-all-btn" id="selectAllBtn">Selectează tot</button>
      </div>
    </div>

    <nav class="nav-bar" id="navBarTop">
      <button class="nav-btn" id="backBtnTop" aria-label="Înapoi">← Înapoi</button>
      <button class="nav-btn" id="forwardBtnTop" aria-label="Înainte">Înainte →</button>
    </nav>

    <nav class="tabs" id="tabs"></nav>
    <nav class="tabs tabs-sub" id="subTabs"></nav>
    <main id="main">
      <div class="state">Se încarcă titlurile…</div>
    </main>

    <nav class="nav-bar nav-bar-bottom" id="navBarBottom">
      <button class="nav-btn" id="backBtnBottom" aria-label="Înapoi">← Înapoi</button>
      <button class="nav-btn" id="forwardBtnBottom" aria-label="Înainte">Înainte →</button>
    </nav>

    <div class="update-banner" id="updateBanner">
      <span>O versiune nouă e disponibilă.</span>
      <button id="updateReloadBtn">Reîncarcă</button>
    </div>

    <div class="update-banner" id="installBanner">
      <span id="installBannerText">Instalează aplicația pentru acces rapid.</span>
      <span style="display:flex; gap:0.4rem;">
        <button id="installActionBtn">Instalează</button>
        <button id="installDismissBtn" aria-label="Închide">✕</button>
      </span>
    </div>
  </div>

<script>
  // ---- Configurare ----
  const WORKER_URL = 'https://stiri-proxy.tomaunguru.workers.dev/';
  const SETTINGS_KEY = 'stiriNestireSettings';

  const SHADE_PRESETS = [
    { id: 'default', label: 'Standard', light: '#20241F', dark: '#ECE8DC' },
    { id: 'warm',    label: 'Alb cald',  light: '#3A2E1E', dark: '#F2E6C9' },
    { id: 'cool',    label: 'Gri rece',  light: '#1E2733', dark: '#C9D6DD' },
    { id: 'sepia',   label: 'Sepia',     light: '#4B3621', dark: '#D9C9A3' }
  ];

  const DEFAULT_SETTINGS = {
    theme: 'system',
    fontSize: 'medium',
    shade: 'default',
    selectedSources: null // null = toate sursele descoperite
  };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
    } catch {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings(settings) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  }

  let settings = loadSettings();

  // ---- Aplicarea setărilor vizuale ----
  function resolvedTheme() {
    if (settings.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return settings.theme;
  }

  function applyVisualSettings() {
    const theme = resolvedTheme();
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.fontSize = settings.fontSize;

    const shade = SHADE_PRESETS.find(s => s.id === settings.shade) || SHADE_PRESETS[0];
    document.documentElement.style.setProperty('--ink', theme === 'dark' ? shade.dark : shade.light);

    const themeColorMeta = document.getElementById('themeColorMeta');
    if (themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#181B18' : '#2C5F63');
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (settings.theme === 'system') applyVisualSettings();
  });

  // ---- Construirea panoului de setări ----
  function wireSegmented(groupEl, currentValue, onPick) {
    Array.from(groupEl.children).forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.value === currentValue));
      btn.addEventListener('click', () => {
        onPick(btn.dataset.value);
        Array.from(groupEl.children).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      });
    });
  }

  function initSettingsPanel() {
    wireSegmented(document.getElementById('themeGroup'), settings.theme, value => {
      settings.theme = value; saveSettings(settings); applyVisualSettings();
    });
    wireSegmented(document.getElementById('fontSizeGroup'), settings.fontSize, value => {
      settings.fontSize = value; saveSettings(settings); applyVisualSettings();
    });

    const shadeGroup = document.getElementById('shadeGroup');
    shadeGroup.innerHTML = '';
    SHADE_PRESETS.forEach(preset => {
      const btn = document.createElement('button');
      btn.dataset.value = preset.id;
      const previewColor = resolvedTheme() === 'dark' ? preset.dark : preset.light;
      btn.innerHTML = `<span class="shade-swatch"><span class="shade-dot" style="background:${previewColor}"></span>${preset.label}</span>`;
      shadeGroup.appendChild(btn);
    });
    wireSegmented(shadeGroup, settings.shade, value => {
      settings.shade = value; saveSettings(settings); applyVisualSettings();
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settingsPanel');
      const isOpen = panel.classList.toggle('open');
      document.getElementById('settingsBtn').setAttribute('aria-expanded', String(isOpen));
    });
  }

  function resetToAllView() {
    activeCategories = new Set();
    activeSources = new Set();
    renderTabs();
    renderSourceChips();
    renderList();
  }

  function renderSourceChecklist() {
    const container = document.getElementById('sourceChecklist');
    container.innerHTML = '';
    const discovered = sourceMeta.map(s => s.name);
    const effectiveSelected = settings.selectedSources || discovered;

    function addHeading(text) {
      const heading = document.createElement('p');
      heading.textContent = text;
      heading.style.cssText = 'font-size:0.72rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin:0.7rem 0 0.3rem;';
      container.appendChild(heading);
    }

    function addSourceCheck(s) {
      const label = document.createElement('label');
      label.className = 'source-check';
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = effectiveSelected.includes(s.name);
      checkbox.addEventListener('change', () => {
        const current = new Set(settings.selectedSources || discovered);
        if (checkbox.checked) current.add(s.name); else current.delete(s.name);
        settings.selectedSources = Array.from(current);
        saveSettings(settings);
        resetToAllView();
      });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(`${s.name} `));
      const tagSpan = document.createElement('span');
      tagSpan.textContent = s.country; // RO, GB, DE, FR ...
      tagSpan.style.cssText = 'font-size:0.68rem;color:var(--ink-soft);border:1px solid var(--rule);border-radius:4px;padding:0.05rem 0.3rem;';
      label.appendChild(tagSpan);
      container.appendChild(label);
    }

    // 1. Sursele romanesti, grupate pe categorie (Actualitati, Sport, ...)
    const roByCategory = {};
    sourceMeta.filter(s => s.country === 'RO').forEach(s => {
      const cat = s.category || 'Altele';
      if (!roByCategory[cat]) roByCategory[cat] = [];
      roByCategory[cat].push(s);
    });
    Object.keys(roByCategory).sort().forEach(cat => {
      addHeading(CATEGORY_LABELS[cat] || cat);
      roByCategory[cat].forEach(addSourceCheck);
    });

    // 2. Sursele internationale, intr-o sectiune separata, indiferent de categoria lor
    const international = sourceMeta.filter(s => s.country !== 'RO');
    if (international.length > 0) {
      addHeading('Internaționale');
      international.forEach(addSourceCheck);
    }

    document.getElementById('selectAllBtn').onclick = () => {
      settings.selectedSources = null;
      saveSettings(settings);
      renderSourceChecklist();
      resetToAllView();
    };
  }

  // ---- Stare ----
  let allItems = [];
  let sourceMeta = []; // [{name, country, category}, ...] - vine de la Worker
  let activeCategories = new Set(['Actualitati']); // implicit: doar sectiunea Actualitati (Stiri)
  let activeSources = new Set(); // gol = toate sursele din categoriile active
  let currentView = 'list'; // 'list' | 'article' - pentru butoanele inapoi/inainte proprii
  let hasForwardEntry = false;

  const CATEGORY_LABELS = {
    Actualitati: 'Actualități',
    Sport: 'Sport',
    Financiar: 'Financiar',
    IT: 'IT',
    Religie: 'Religie',
    Cultura: 'Cultură',
    International: 'Internațional'
  };
  const CATEGORY_ORDER = ['Actualitati', 'Sport', 'Financiar', 'IT', 'Religie', 'Cultura', 'International'];

  const tabsEl = document.getElementById('tabs');
  const subTabsEl = document.getElementById('subTabs');
  const mainEl = document.getElementById('main');

  // ---- Utilitare culoare pe sursă ----
  const TAG_PALETTE = ['#2C5F63', '#8B3E32', '#6B5B95', '#4C6E3C', '#8A6D1F', '#3D5A80'];
  function colorForSource(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return TAG_PALETTE[hash % TAG_PALETTE.length];
  }

  function formatRelativeTime(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    const diffMs = Date.now() - date.getTime();
    const diffMin = Math.max(0, Math.round(diffMs / 60000)); // o data din viitor (surse cu erori) devine "chiar acum"
    if (diffMin < 1) return 'chiar acum';
    if (diffMin < 60) return `acum ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `acum ${diffH} h`;
    const diffD = Math.round(diffH / 24);
    return `acum ${diffD} zile`;
  }

  // Timpul folosit la SORTARE: o data din viitor (eroare de sursa) e adusa la "acum",
  // ca sa nu ramana fixata permanent in capul listei, inaintea stirilor reale mai proaspete.
  function effectiveTimestamp(dateStr) {
    const parsed = new Date(dateStr).getTime();
    if (isNaN(parsed)) return 0;
    return Math.min(parsed, Date.now());
  }

  function formatFullDate(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    return date.toLocaleString('ro-RO', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Sursele "efective" (cele bifate in setari) ----
  function discoveredSourceNames() {
    return sourceMeta.map(s => s.name);
  }
  function effectiveSources() {
    const discovered = discoveredSourceNames();
    return settings.selectedSources ? settings.selectedSources.filter(s => discovered.includes(s)) : discovered;
  }
  // Sursele (cu metadate), bifate in setari, care apartin unei anumite categorii
  // ('International' = orice sursa cu country !== 'RO', indiferent de category)
  function sourcesInCategory(category) {
    const active = new Set(effectiveSources());
    return sourceMeta.filter(s => {
      if (!active.has(s.name)) return false;
      return category === 'International' ? s.country !== 'RO' : (s.category === category && s.country === 'RO');
    });
  }
  // Reuniunea surselor din toate categoriile active (pentru randul secundar de chip-uri)
  function sourcesInActiveCategories() {
    const seen = new Map();
    activeCategories.forEach(cat => {
      sourcesInCategory(cat).forEach(s => seen.set(s.name, s));
    });
    return Array.from(seen.values());
  }
  function poolItems() {
    let names = effectiveSources();
    if (activeCategories.size > 0) {
      const namesInActiveCats = sourcesInActiveCategories().map(s => s.name);
      names = names.filter(n => namesInActiveCats.includes(n));
    }
    if (activeSources.size > 0) {
      names = names.filter(n => activeSources.has(n));
    }
    return allItems.filter(i => names.includes(i.source));
  }

  // ---- Randare taburi (categorii, selectie multipla) ----
  function renderTabs() {
    const active = new Set(effectiveSources());
    const presentRoCategories = new Set(
      sourceMeta.filter(s => active.has(s.name) && s.country === 'RO').map(s => s.category)
    );
    const hasInternational = sourceMeta.some(s => active.has(s.name) && s.country !== 'RO');

    const categories = CATEGORY_ORDER.filter(c =>
      c === 'International' ? hasInternational : presentRoCategories.has(c)
    );

    tabsEl.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = CATEGORY_LABELS[cat] || cat;
      btn.setAttribute('aria-pressed', String(activeCategories.has(cat)));
      btn.addEventListener('click', () => {
        if (activeCategories.has(cat)) activeCategories.delete(cat); else activeCategories.add(cat);
        activeSources = new Set(); // schimbarea categoriilor reseteaza ingustarea pe surse individuale
        renderTabs();
        renderSourceChips();
        renderList();
      });
      tabsEl.appendChild(btn);
    });
  }

  // ---- Randare rand secundar (surse individuale, selectie multipla) ----
  function renderSourceChips() {
    subTabsEl.innerHTML = '';
    if (activeCategories.size === 0) {
      subTabsEl.classList.remove('visible');
      return;
    }
    const sources = sourcesInActiveCategories();
    if (sources.length <= 1) {
      subTabsEl.classList.remove('visible');
      return;
    }
    subTabsEl.classList.add('visible');

    sources.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'tab tab-sub';
      btn.textContent = s.name;
      btn.setAttribute('aria-pressed', String(activeSources.has(s.name)));
      btn.addEventListener('click', () => {
        if (activeSources.has(s.name)) activeSources.delete(s.name); else activeSources.add(s.name);
        renderSourceChips();
        renderList();
      });
      subTabsEl.appendChild(btn);
    });
  }

  // ---- Randare listă ----
  function renderList() {
    currentView = 'list';
    const filtered = poolItems();

    mainEl.innerHTML = '';

    if (filtered.length === 0) {
      const state = document.createElement('div');
      state.className = 'state';
      state.textContent = 'Nicio știre de afișat momentan.';
      mainEl.appendChild(state);
      updateNavButtons();
      window.scrollTo(0, 0);
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list';

    filtered.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item';

      const btn = document.createElement('button');
      btn.className = 'item-btn';

      if (item.image) {
        const img = document.createElement('img');
        img.className = 'item-thumb';
        img.src = item.image;
        img.alt = '';
        img.loading = 'lazy';
        img.addEventListener('error', () => img.remove());
        btn.appendChild(img);
      }

      const textWrap = document.createElement('div');
      textWrap.className = 'item-text';

      const title = document.createElement('p');
      title.className = 'item-title';
      title.textContent = item.title;

      const meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.innerHTML = `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span><span>·</span><span>${formatRelativeTime(item.date)}</span>`;

      textWrap.appendChild(title);
      textWrap.appendChild(meta);
      btn.appendChild(textWrap);
      btn.addEventListener('click', () => navigateToArticle(item));

      li.appendChild(btn);
      ul.appendChild(li);
    });

    mainEl.appendChild(ul);
    updateNavButtons();
    window.scrollTo(0, 0);
  }

  // ---- Vizualizare articol ----
  function navigateToArticle(item) {
    history.pushState({ view: 'article', link: item.link }, '');
    hasForwardEntry = false; // o navigare noua taie orice ramura de "inainte" existenta
    renderArticleView(item);
  }

  async function renderArticleView(item) {
    currentView = 'article';
    updateNavButtons();
    window.scrollTo(0, 0);

    mainEl.innerHTML = `
      <div class="reading">
        <button class="back-btn" id="backBtn">Înapoi la titluri</button>
        <div class="state">Se încarcă articolul…</div>
      </div>`;
    document.getElementById('backBtn').addEventListener('click', goBackInApp);

    try {
      const res = await fetch(`${WORKER_URL}?article=${encodeURIComponent(item.link)}`);
      if (!res.ok) throw new Error('Răspuns invalid de la server');
      const data = await res.json();

      const paragraphs = (data.text || '')
        .split('\n\n')
        .filter(p => p.trim())
        .map(p => `<p>${escapeHtml(p)}</p>`)
        .join('');

      mainEl.innerHTML = `
        <div class="reading">
          <button class="back-btn" id="backBtn">Înapoi la titluri</button>
          <p class="reading-meta"><span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span> · ${formatFullDate(item.date)}</p>
          <h1 class="reading-title">${escapeHtml(item.title)}</h1>
          <div class="reading-body">${paragraphs || '<p>Nu am putut extrage textul acestui articol.</p>'}</div>
          <a class="reading-source-link" href="${item.link}" target="_blank" rel="noopener">Vezi articolul original</a>
        </div>`;
      document.getElementById('backBtn').addEventListener('click', goBackInApp);
    } catch (err) {
      mainEl.innerHTML = `
        <div class="reading">
          <button class="back-btn" id="backBtn">Înapoi la titluri</button>
          <div class="state">
            <strong>Nu am putut încărca articolul</strong>
            A apărut o problemă la extragerea textului. Poți încerca din nou sau deschide articolul original.
            <br><a class="reading-source-link" href="${item.link}" target="_blank" rel="noopener">Vezi articolul original</a>
          </div>
        </div>`;
      document.getElementById('backBtn').addEventListener('click', goBackInApp);
    }
  }

  // ---- Navigare inapoi/inainte (buton fizic al telefonului + butoanele proprii) ----
  function goBackInApp() {
    if (currentView !== 'article') return; // nu avem unde sa mergem inapoi in aplicatie
    history.back();
  }
  function goForwardInApp() {
    if (!hasForwardEntry) return;
    history.forward();
  }
  function updateNavButtons() {
    const backDisabled = currentView !== 'article';
    const forwardDisabled = !hasForwardEntry;
    [document.getElementById('backBtnTop'), document.getElementById('backBtnBottom')].forEach(b => b.disabled = backDisabled);
    [document.getElementById('forwardBtnTop'), document.getElementById('forwardBtnBottom')].forEach(b => b.disabled = forwardDisabled);
  }

  window.addEventListener('popstate', event => {
    const state = event.state;
    if (state && state.view === 'article') {
      hasForwardEntry = false;
      const item = allItems.find(i => i.link === state.link);
      if (item) { renderArticleView(item); return; }
      // linkul nu mai e in lista curenta (rar) - revenim in siguranta la lista
      renderList();
      return;
    }
    const wasArticle = currentView === 'article';
    hasForwardEntry = wasArticle; // tocmai am revenit DE la un articol, deci exista o ramura "inainte"
    renderList();
  });

  [document.getElementById('backBtnTop'), document.getElementById('backBtnBottom')].forEach(b => b.addEventListener('click', goBackInApp));
  [document.getElementById('forwardBtnTop'), document.getElementById('forwardBtnBottom')].forEach(b => b.addEventListener('click', goForwardInApp));

  // ---- Încărcare inițială ----
  async function loadFeed() {
    try {
      const res = await fetch(WORKER_URL);
      if (!res.ok) throw new Error('Răspuns invalid de la server');
      const data = await res.json();

      sourceMeta = data.sources || [];
      allItems = (data.items || []).filter(i => i.title && i.link).sort((a, b) => effectiveTimestamp(b.date) - effectiveTimestamp(a.date));

      history.replaceState({ view: 'list' }, '');
      renderSourceChecklist();
      renderTabs();
      renderSourceChips();
      renderList();
    } catch (err) {
      mainEl.innerHTML = `
        <div class="state">
          <strong>Nu am putut încărca știrile</strong>
          Verifică legătura la internet sau încearcă din nou.
          <br><button class="retry-btn" id="retryBtn">Încearcă din nou</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', loadFeed);
    }
  }

  // ---- Pornire ----
  applyVisualSettings();
  initSettingsPanel();
  loadFeed();

  // ---- Instalare: banner propriu la prima deschidere, in loc sa astepti meniul browserului ----
  const INSTALL_DISMISSED_KEY = 'stiriNestireInstallDismissed';
  let deferredInstallPrompt = null;

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }

  function showInstallBanner(mode) {
    if (isStandalone()) return; // deja instalata/deschisa ca aplicatie
    if (localStorage.getItem(INSTALL_DISMISSED_KEY)) return;
    if (document.getElementById('updateBanner').classList.contains('visible')) return; // update-ul are prioritate

    const banner = document.getElementById('installBanner');
    const textEl = document.getElementById('installBannerText');
    const actionBtn = document.getElementById('installActionBtn');

    if (mode === 'ios') {
      textEl.textContent = 'Adaugă aplicația pe ecranul principal: atinge Distribuire, apoi „Adaugă pe ecranul principal".';
      actionBtn.style.display = 'none';
    } else {
      textEl.textContent = 'Instalează aplicația pentru acces rapid, ca orice altă aplicație.';
      actionBtn.style.display = '';
    }
    banner.classList.add('visible');
  }

  function hideInstallBanner() {
    document.getElementById('installBanner').classList.remove('visible');
  }

  // Android si PC (Chrome/Edge): browserul ne anunta cand aplicatia e instalabila
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    showInstallBanner('android-pc');
  });

  document.getElementById('installActionBtn').addEventListener('click', async () => {
    hideInstallBanner();
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    localStorage.setItem(INSTALL_DISMISSED_KEY, '1');
  });

  document.getElementById('installDismissBtn').addEventListener('click', () => {
    hideInstallBanner();
    localStorage.setItem(INSTALL_DISMISSED_KEY, '1');
  });

  window.addEventListener('appinstalled', () => {
    hideInstallBanner();
    localStorage.setItem(INSTALL_DISMISSED_KEY, '1');
  });

  // iOS (Safari): "beforeinstallprompt" nu exista deloc acolo - aratam noi indicatia manuala
  if (isIOS() && !isStandalone() && !localStorage.getItem(INSTALL_DISMISSED_KEY)) {
    showInstallBanner('ios');
  }

  // ---- Detectare versiune noua a aplicatiei ----
  if ('serviceWorker' in navigator) {
    function showUpdateBanner(waitingWorker) {
      hideInstallBanner(); // update-ul are prioritate fata de promptul de instalare
      const banner = document.getElementById('updateBanner');
      banner.classList.add('visible');
      document.getElementById('updateReloadBtn').onclick = () => {
        waitingWorker.postMessage({ type: 'SKIP_WAITING' });
      };
    }

    let refreshingPage = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshingPage) return;
      refreshingPage = true;
      window.location.reload();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(registration => {
        // Caz 1: exista deja un worker nou, in asteptare, de la o vizita anterioara
        if (registration.waiting) {
          showUpdateBanner(registration.waiting);
        }
        // Caz 2: se instaleaza un worker nou chiar acum, cat timp pagina e deschisa
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(newWorker);
            }
          });
        });
      }).catch(() => {});
    });
  }
</script>
</body>
