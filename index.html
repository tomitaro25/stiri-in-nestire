<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Știri în neștire</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5F63" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neștire">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F1EFE7;
    --paper-raised: #E9E6DA;
    --ink: #20241F;
    --ink-soft: #5B6058;
    --rule: #D8D4C7;
    --teal: #2C5F63;
    --brick: #8B3E32;
    --nav-highlight: var(--teal);
    --max-width: 640px;
    --font-title: 'Source Serif 4', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --content-scale: 1;
  }

  html[data-theme="dark"] {
    --paper: #181B18;
    --paper-raised: #21251F;
    --ink: #ECE8DC;
    --ink-soft: #9AA098;
    --rule: #33372F;
    --teal: #6FB3AC;
    --brick: #D98F7C;
    --nav-highlight: #E6D9A0;
  }

  html[data-font-size="1"] { --content-scale: 0.9; }
  html[data-font-size="2"] { --content-scale: 1; }
  html[data-font-size="3"] { --content-scale: 1.15; }
  html[data-font-size="4"] { --content-scale: 1.3; }
  html[data-font-size="5"] { --content-scale: 1.45; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    transition: background 0.15s ease, color 0.15s ease;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: var(--max-width);
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }

  /* Masthead */
  header.masthead {
    padding: calc(env(safe-area-inset-top, 0px) + 44px + 1.5rem) 1.1rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .wordmark {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.15;
  }

  .tagline {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .offline-download-btn {
    all: unset;
    display: inline-block;
    margin: 0.4rem 0 0;
    font-size: 0.75rem;
    color: var(--teal);
    cursor: pointer;
    border-bottom: 1px dotted var(--teal);
    line-height: 1.2;
  }
  .offline-download-btn:hover { opacity: 0.8; }
  .offline-download-btn:disabled { opacity: 0.5; cursor: default; }

  .offline-status {
    margin: 0.3rem 0 0;
    font-size: 0.75rem;
    color: var(--teal);
    display: none;
  }
  .offline-status.visible { display: block; }

  button.icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--ink-soft);
    padding: 0.3rem 0.45rem;
    line-height: 1;
    border-radius: 999px;
    border: 1px solid var(--teal);
  }
  button.icon-btn:hover, button.icon-btn:focus-visible { background: var(--paper-raised); }
  button.icon-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .header-actions { display: flex; gap: 0.15rem; }

  /* Bara de cautare */
  .search-bar {
    display: none;
    padding: 0.75rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }
  .search-bar.visible { display: block; }
  .search-bar input {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.6rem 0.8rem;
  }
  .search-bar input:focus { outline: 2px solid var(--teal); outline-offset: -1px; }

  /* Pagina de setari (randata in #main, ca si vizualizarea unui articol) */
  .settings-page { padding: 0.5rem 1.25rem 3.75rem; }

  .settings-group { margin-bottom: 0.85rem; }
  .settings-group:last-child { margin-bottom: 0; }

  .settings-label {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    margin: 0 0 0.35rem;
  }

  .segmented {
    display: flex;
    gap: 0.3rem;
    flex-wrap: wrap;
  }

  .segmented button {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.72rem;
    padding: 0.26rem 0.5rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  #shadeGroup button {
    padding: 0.35rem;
    display: inline-flex;
  }
  .shade-dot {
    width: 1.15rem;
    height: 1.15rem;
    border-radius: 50%;
    border: 1px solid var(--rule);
    display: block;
  }

  .settings-row {
    display: flex;
    gap: 1.1rem;
  }
  .settings-col { flex: 1; min-width: 0; }

  .source-checklist {
    column-count: 2;
    column-gap: 1.1rem;
  }
  .source-cat-group {
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    margin-bottom: 0.7rem;
  }
  .source-check {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.85rem;
    margin-bottom: 0.35rem;
  }
  .source-check input { accent-color: var(--teal); width: 1.05rem; height: 1.05rem; flex-shrink: 0; }

  .select-all-btn {
    all: unset;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--teal);
    margin-top: 0.4rem;
    display: inline-block;
  }

  /* Source tabs */
  nav.tabs {
    position: relative;
    display: flex;
    gap: 0.25rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
  }

  nav.tabs-sub {
    position: relative;
    display: none;
    gap: 0.25rem;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
    background: var(--paper-raised);
  }
  nav.tabs-sub.visible { display: flex; }

  .tab {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.44rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
  }
  .tab.dragging {
    cursor: grabbing;
    opacity: 0.65;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    position: relative;
    z-index: 20;
  }

  .tab-drop-indicator {
    position: absolute;
    top: 0.35rem;
    bottom: 0.35rem;
    width: 3px;
    background: var(--nav-highlight);
    border-radius: 2px;
    pointer-events: none;
    display: none;
  }
  .tab-drop-indicator.visible { display: block; }

  .tab-sub {
    font-size: 0.78rem;
    padding: 0.32rem 0.7rem;
  }

  .tab[aria-pressed="true"] {
    background: var(--paper-raised);
    color: var(--ink);
    border-color: var(--teal);
    font-weight: 600;
  }

  /* Bara de navigare (inapoi/inainte) - fixata, mereu vizibila, fara scroll */
  nav.nav-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: var(--max-width);
    min-height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--paper);
    z-index: 40;
  }
  nav.nav-bar#navBarTop {
    top: 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 0.5rem);
    border-bottom: 1px solid var(--rule);
  }
  nav.nav-bar#navBarBottom {
    bottom: 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem);
    border-top: 1px solid var(--rule);
  }
  .nav-btn {
    all: unset;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--nav-highlight);
    border: 1px solid var(--teal);
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
  }
  .nav-btn:disabled {
    color: var(--ink-soft);
    border-color: var(--rule);
    opacity: 0.5;
    cursor: default;
  }
  .nav-btn:not(:disabled):hover { background: var(--paper-raised); }

  .font-size-label {
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .font-size-slider {
    width: 4rem;
    accent-color: var(--teal);
    cursor: pointer;
  }

  /* Lista de articole, cu poza mica optionala */
  main { flex: 1; padding: 0.25rem 0 calc(env(safe-area-inset-bottom, 0px) + 44px + 2.5rem); }

  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { border-bottom: 1px solid var(--rule); position: relative; }

  button.item-btn {
    all: unset;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    width: 100%;
    padding: 1rem 2.6rem 1rem 1.25rem;
    cursor: pointer;
    box-sizing: border-box;
  }
  button.item-btn:hover, button.item-btn:focus-visible { background: var(--paper-raised); }
  button.item-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }

  .fav-star {
    all: unset;
    position: absolute;
    top: 0.85rem;
    right: 1rem;
    cursor: pointer;
    font-size: 1.15rem;
    line-height: 1;
    color: var(--rule);
    padding: 0.2rem;
  }
  .fav-star.active { color: var(--nav-highlight); }
  .fav-star:hover { color: var(--teal); }

  .item-thumb {
    flex: 0 0 auto;
    width: 4.5rem;
    height: 4.5rem;
    border-radius: 8px;
    object-fit: cover;
    background: var(--paper-raised);
  }
  .item-text { flex: 1; min-width: 0; }

  .item-title {
    font-family: var(--font-title);
    font-weight: 600;
    font-size: calc(1.11rem * var(--content-scale));
    line-height: 1.3;
    margin: 0 0 0.5rem;
    color: var(--ink);
  }
  .item-title.is-read { color: var(--ink-soft); font-weight: 400; }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.81rem;
    color: var(--ink-soft);
  }

  .source-tag { font-weight: 600; }

  /* Reading view */
  .reading { padding: 0.5rem 1.25rem 3.75rem; }

  button.back-btn {
    all: unset;
    display: inline-block;
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--teal);
    padding: 0.75rem 0;
  }
  button.back-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .reading-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .fav-star-reading {
    all: unset;
    cursor: pointer;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--rule);
    padding: 0.4rem;
  }
  .fav-star-reading.active { color: var(--nav-highlight); }

  .reading-meta { font-size: 0.81rem; color: var(--ink-soft); margin-bottom: 0.6rem; }

  .reading-title {
    font-family: var(--font-title);
    font-weight: 700;
    font-size: 1.625rem;
    line-height: 1.28;
    margin: 0 0 1.25rem;
    color: var(--ink);
  }

  .reading-body p {
    font-family: var(--font-title);
    font-size: calc(1.125rem * var(--content-scale));
    line-height: 1.6;
    max-width: 66ch;
    margin: 0 0 1.1em;
    color: var(--ink);
  }

  .reading-source-link {
    display: inline-block;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: var(--ink-soft);
  }

  /* States */
  .state { padding: 3.75rem 1.5rem; text-align: center; color: var(--ink-soft); font-size: 0.94rem; }
  .state strong { display: block; color: var(--ink); font-size: 1.06rem; margin-bottom: 0.4rem; font-weight: 600; }

  .retry-btn {
    margin-top: 0.9rem;
    appearance: none;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  /* Banner "versiune noua" / instalare */
  .update-banner {
    display: none;
    position: fixed;
    left: 50%;
    top: calc(env(safe-area-inset-top, 0px) + 44px + 0.75rem);
    transform: translateX(-50%);
    max-width: calc(var(--max-width) - 2rem);
    width: calc(100% - 2rem);
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 50;
  }
  .update-banner.visible { display: flex; }
  .update-banner button {
    appearance: none;
    border: 1px solid var(--paper);
    background: transparent;
    color: var(--paper);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="masthead">
      <div>
        <p class="wordmark">Știri în neștire</p>
        <p class="tagline">Titluri, rapid. Fără reclame, fără zgomot.</p>
        <button class="offline-download-btn" id="offlineDownloadBtn">⬇ Descarcă pentru offline</button>
        <p class="offline-status" id="offlineStatus"></p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="favoritesBtn" aria-label="Favorite">★</button>
        <button class="icon-btn" id="searchBtn" aria-label="Caută" aria-expanded="false">🔍</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Setări">⚙</button>
      </div>
    </header>

    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Caută în titluri…" autocomplete="off">
    </div>

    <nav class="nav-bar" id="navBarTop">
      <button class="nav-btn" id="backBtnTop" aria-label="Înapoi">← Înapoi</button>
      <button class="nav-btn" id="forwardBtnTop" aria-label="Înainte">Înainte →</button>
      <span class="font-size-label">Font</span>
      <input type="range" class="font-size-slider" id="fontSizeSliderTop" min="1" max="5" step="1" aria-label="Mărime font">
    </nav>

    <nav class="tabs" id="tabs"></nav>
    <nav class="tabs tabs-sub" id="subTabs"></nav>
    <main id="main">
      <div class="state">Se încarcă titlurile…</div>
    </main>

    <nav class="nav-bar" id="navBarBottom">
      <button class="nav-btn" id="backBtnBottom" aria-label="Înapoi">← Înapoi</button>
      <button class="nav-btn" id="forwardBtnBottom" aria-label="Înainte">Înainte →</button>
      <span class="font-size-label">Font</span>
      <input type="range" class="font-size-slider" id="fontSizeSliderBottom" min="1" max="5" step="1" aria-label="Mărime font">
    </nav>

    <div class="update-banner" id="updateBanner">
      <span>O versiune nouă e disponibilă.</span>
      <button id="updateReloadBtn">Reîncarcă</button>
    </div>

    <div class="update-banner" id="installBanner">
      <span id="installBannerText">Instalează aplicația pentru acces rapid.</span>
      <span style="display:flex; gap:0.4rem;">
        <button id="installActionBtn">Instalează</button>
        <button id="installDismissBtn" aria-label="Închide">✕</button>
      </span>
    </div>
  </div>

<script>
  // ---- Configurare ----
  const WORKER_URL = 'https://stiri-proxy.tun-app.workers.dev/';
  const SETTINGS_KEY = 'stiriNestireSettings';
  const LAST_FEED_KEY = 'stiriNestireLastFeed'; // instantaneu al ultimei liste incarcate cu succes, pt pornire offline

  function saveLastFeedSnapshot() {
    try { localStorage.setItem(LAST_FEED_KEY, JSON.stringify({ items: allItems, sources: sourceMeta })); } catch {}
  }
  function loadLastFeedSnapshot() {
    try { return JSON.parse(localStorage.getItem(LAST_FEED_KEY) || 'null'); } catch { return null; }
  }

  const SHADE_PRESETS = [
    { id: 'default', label: 'Standard', light: '#20241F', dark: '#ECE8DC' },
    { id: 'warm',    label: 'Alb cald',  light: '#3A2E1E', dark: '#F2E6C9' },
    { id: 'cool',    label: 'Gri rece',  light: '#1E2733', dark: '#C9D6DD' },
    { id: 'sepia',   label: 'Sepia',     light: '#4B3621', dark: '#D9C9A3' }
  ];

  const FONT_PRESETS = [
    { id: 'classic', label: 'Clasic', title: "'Source Serif 4', serif", body: "'IBM Plex Sans', sans-serif" },
    { id: 'modern',  label: 'Modern', title: "'Inter', sans-serif", body: "'Inter', sans-serif" },
    { id: 'reading', label: 'Lectură', title: "'Lora', serif", body: "'Lora', serif" }
  ];

  const DEFAULT_SETTINGS = {
    theme: 'system',
    fontSize: '2',
    fontFamily: 'classic',
    shade: 'default',
    selectedSources: null, // null = toate sursele descoperite
    categoryOrder: null, // null = ordinea implicita (CATEGORY_ORDER); altfel, ordine aleasa de utilizator prin drag&drop
    sourceOrder: null, // null = ordinea implicita (descoperire); altfel, ordine aleasa de utilizator prin drag&drop
    activeCategories: null, // null = implicit ['Actualitati']; altfel, ultima selectie facuta de utilizator
    activeSources: null // null = toate sursele din categoriile active; altfel, ultima ingustare facuta
  };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
    } catch {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings(settings) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  }

  let settings = loadSettings();

  // ---- Aplicarea setărilor vizuale ----
  function resolvedTheme() {
    if (settings.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return settings.theme;
  }

  function applyVisualSettings() {
    const theme = resolvedTheme();
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.fontSize = settings.fontSize;

    const shade = SHADE_PRESETS.find(s => s.id === settings.shade) || SHADE_PRESETS[0];
    document.documentElement.style.setProperty('--ink', theme === 'dark' ? shade.dark : shade.light);

    const font = FONT_PRESETS.find(f => f.id === settings.fontFamily) || FONT_PRESETS[0];
    document.documentElement.style.setProperty('--font-title', font.title);
    document.documentElement.style.setProperty('--font-body', font.body);

    const themeColorMeta = document.getElementById('themeColorMeta');
    if (themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#181B18' : '#2C5F63');

    // Sincronizam ambele slidere de marime text (sus si jos) cu setarea curenta
    const sliderTop = document.getElementById('fontSizeSliderTop');
    const sliderBottom = document.getElementById('fontSizeSliderBottom');
    if (sliderTop) sliderTop.value = settings.fontSize;
    if (sliderBottom) sliderBottom.value = settings.fontSize;
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (settings.theme === 'system') applyVisualSettings();
  });

  // ---- Construirea taburilor tip "segmented" ----
  function wireSegmented(groupEl, currentValue, onPick) {
    Array.from(groupEl.children).forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.value === currentValue));
      btn.addEventListener('click', () => {
        onPick(btn.dataset.value);
        Array.from(groupEl.children).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      });
    });
  }

  // ---- Pagina de Setari (randata in #main, navigabila ca un articol) ----
  function navigateToSettings() {
    history.pushState({ view: 'settings' }, '');
    hasForwardEntry = false;
    renderSettingsView();
  }

  function renderSettingsView() {
    currentView = 'settings';
    updateNavButtons();
    window.scrollTo(0, 0);

    mainEl.innerHTML = `
      <div class="settings-page">
        <button class="back-btn" id="backBtn">Înapoi la titluri</button>
        <h1 class="reading-title" style="margin-bottom:0.9rem;">Setări</h1>

        <div class="settings-row">
          <div class="settings-col">
            <div class="settings-group">
              <p class="settings-label">Temă</p>
              <div class="segmented" id="themeGroup">
                <button data-value="light">Deschis</button>

  // ---- Cache offline pentru text de articole (IndexedDB - poate creste mult mai mult) ----
  const OFFLINE_DB_NAME = 'stiriNestireOffline';
  const OFFLINE_STORE = 'articles';

  function openOfflineDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB indisponibil')); return; }
      const req = indexedDB.open(OFFLINE_DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(OFFLINE_STORE)) {
          req.result.createObjectStore(OFFLINE_STORE, { keyPath: 'link' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function offlineGet(link) {
    try {
      const db = await openOfflineDB();
      return await new Promise((resolve, reject) => {
        const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).get(link);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch { return null; }
  }
  async function offlineSet(entry) {
    try {
      const db = await openOfflineDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        tx.objectStore(OFFLINE_STORE).put(entry);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  async function offlineGetAllKeys() {
    try {
      const db = await openOfflineDB();
      return await new Promise((resolve, reject) => {
        const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    } catch { return []; }
  }

  // Descarca, la cerere (buton), textul articolelor din sectiunea curent
  // selectata, fara poze (doar text - cat mai usor). Sare peste ce e deja
  // descarcat, ca sa nu reia acelasi lucru de fiecare data.
  async function downloadOfflineArticles() {
    const btn = document.getElementById('offlineDownloadBtn');
    const statusEl = document.getElementById('offlineStatus');
    const setStatus = text => {
      statusEl.textContent = text;
      statusEl.classList.toggle('visible', Boolean(text));
    };

    const pool = poolItems();
    if (pool.length === 0) {
      setStatus('Nimic de descărcat momentan.');
      setTimeout(() => setStatus(''), 2500);
      return;
    }
    const cachedKeys = new Set(await offlineGetAllKeys());
    const toDownload = pool.filter(i => !cachedKeys.has(i.link)).slice(0, 40);
    if (toDownload.length === 0) {
      setStatus('Ai deja tot descărcat pentru offline.');
      setTimeout(() => setStatus(''), 2500);
      return;
    }

    if (btn) btn.disabled = true;
    setStatus(`Se pregătesc ${toDownload.length} articole pentru offline…`);

    let done = 0;
    let idx = 0;
    async function worker() {
      while (idx < toDownload.length) {
        const item = toDownload[idx++];
        try {
          const res = await fetch(`${WORKER_URL}?article=${encodeURIComponent(item.link)}`);
          const data = await res.json();
          await offlineSet({ link: item.link, title: item.title, source: item.source, date: item.date, text: data.text || '', cachedAt: Date.now() });
        } catch {}
        done++;
        setStatus(`Se pregătesc articole pentru offline… (${done}/${toDownload.length})`);
      }
    }
    await Promise.all([worker(), worker(), worker()]); // 3 cereri simultane
    setStatus(`Gata — ${toDownload.length} articole salvate pentru offline.`);
    setTimeout(() => setStatus(''), 3000);
    if (btn) btn.disabled = false;
  }

  const CATEGORY_LABELS = {
    Actualitati: 'Actualități',

    Cultura: 'Cultură',
    International: 'Internațional'
  };
  const CATEGORY_ORDER = ['Actualitati', 'Sport', 'Financiar', 'IT', 'Religie', 'Cultura', 'International'];

  const tabsEl = document.getElementById('tabs');
  const subTabsEl = document.getElementById('subTabs');
  const mainEl = document.getElementById('main');

  // ---- Utilitare culoare pe sursă ----
  const TAG_PALETTE = ['#2C5F63', '#8B3E32', '#6B5B95', '#4C6E3C', '#8A6D1F', '#3D5A80'];
  function colorForSource(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return TAG_PALETTE[hash % TAG_PALETTE.length];
  }

  // O sursa poate raporta o data din viitor (eroare/programare editoriala, ex.
  // Ziarul Lumina foloseste data editiei tiparite de duminica pentru tot ce
  // publica online in cursul saptamanii). Nu avem cum sa aflam ora reala de
  // publicare in cazul asta, asa ca preferam sa n-o afisam deloc, in loc sa
  // aratam o ora gresita.
  function isFutureDate(dateStr) {
    const parsed = new Date(dateStr).getTime();
    return !isNaN(parsed) && parsed > Date.now();
  }

  function formatRelativeTime(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    const diffMs = Date.now() - date.getTime();
    const diffMin = Math.max(0, Math.round(diffMs / 60000)); // o data din viitor (surse cu erori) devine "chiar acum"
    if (diffMin < 1) return 'chiar acum';
    if (diffMin < 60) return `acum ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `acum ${diffH} h`;
    const diffD = Math.round(diffH / 24);
    return `acum ${diffD} zile`;
  }

  // Timpul folosit la SORTARE: o data din viitor (eroare de sursa) e adusa la "acum",
  // ca sa nu ramana fixata permanent in capul listei, inaintea stirilor reale mai proaspete.
  function effectiveTimestamp(dateStr) {
    const parsed = new Date(dateStr).getTime();
    if (isNaN(parsed)) return 0;
    return Math.min(parsed, Date.now());
  }

  function formatFullDate(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    return date.toLocaleString('ro-RO', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Sursele "efective" (cele bifate in setari) ----
  function discoveredSourceNames() {
    return sourceMeta.map(s => s.name);
  }
  function effectiveSources() {
    const discovered = discoveredSourceNames();
    return settings.selectedSources ? settings.selectedSources.filter(s => discovered.includes(s)) : discovered;
  }
  // Sursele (cu metadate), bifate in setari, care apartin unei anumite categorii.
  // 'International' = orice sursa cu country !== 'RO', DAR nu si cele deja
  // incadrate la IT/Tech (acelea apar doar acolo, ca sa nu se duplice).
  // 'IT' e singura categorie care accepta si surse internationale (ex. XDA
  // Developers), pentru ca subiectul conteaza mai mult decat tara aici.
  function sourcesInCategory(category) {
    const active = new Set(effectiveSources());
    return sourceMeta.filter(s => {
      if (!active.has(s.name)) return false;
      if (category === 'International') return s.country !== 'RO' && s.category !== 'IT';
      if (category === 'IT') return s.category === 'IT';
      return s.category === category && s.country === 'RO';
    });
  }
  // Reuniunea surselor din toate categoriile active (pentru randul secundar de chip-uri)
  function sourcesInActiveCategories() {
    const seen = new Map();
    activeCategories.forEach(cat => {
      sourcesInCategory(cat).forEach(s => seen.set(s.name, s));
    });
    return Array.from(seen.values());
  }
  function poolItems() {
    let names = effectiveSources();
    if (activeCategories.size > 0) {
      const namesInActiveCats = sourcesInActiveCategories().map(s => s.name);
      names = names.filter(n => namesInActiveCats.includes(n));
    }
    if (activeSources.size > 0) {
      names = names.filter(n => activeSources.has(n));
    }
    let items = allItems.filter(i => names.includes(i.source));
    if (searchQuery) {
      items = items.filter(i => i.title.toLowerCase().includes(searchQuery));
    }
    return items;
  }

  // Aplica o ordine aleasa de utilizator (prin drag&drop) peste o lista de
  // elemente; elementele care nu apar in ordinea salvata raman la coada,
  // in ordinea lor naturala.
  function applyCustomOrder(items, orderArray, keyFn) {
    if (!orderArray || orderArray.length === 0) return items;
    const indexOf = id => { const i = orderArray.indexOf(id); return i === -1 ? Infinity : i; };
    return [...items].sort((a, b) => indexOf(keyFn(a)) - indexOf(keyFn(b)));
  }

  // Reordonare prin tragere (mouse + atingere, via Pointer Events). Fiecare
  // copil al containerului trebuie sa aiba deja un data-dnd-id. Cat timp tragi,
  // NIMIC altceva nu se misca - doar apare o linie subtire care arata unde ar
  // ateriza elementul. Reordonarea reala (mutarea in DOM + onReorder) se
  // intampla o singura data, la eliberare.
  function makeSortable(container, onReorder) {
    let suppressClick = false;
    container.addEventListener('click', e => {
      if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; }
    }, true);

    const indicator = document.createElement('div');
    indicator.className = 'tab-drop-indicator';
    container.appendChild(indicator);

    const items = Array.from(container.children).filter(el => el !== indicator);
    items.forEach(el => {
      el.style.touchAction = 'pan-y'; // lasam scroll-ul vertical al paginii sa treaca; doar mutarea orizontala devine drag
      el.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const dragEl = el;
        const startX = e.clientX;
        const pointerId = e.pointerId;
        let dragging = false;
        let dropIndex = null;

        function siblings() {
          return Array.from(container.children).filter(c => c !== dragEl && c !== indicator);
        }
        function computeDropIndex(clientX) {
          const sibs = siblings();
          for (let i = 0; i < sibs.length; i++) {
            const rect = sibs[i].getBoundingClientRect();
            if (clientX < rect.left + rect.width / 2) return i;
          }
          return sibs.length;
        }
        function showIndicatorAt(index) {
          const sibs = siblings();
          const containerRect = container.getBoundingClientRect();
          let x;
          if (sibs.length === 0) {
            x = container.scrollLeft;
          } else if (index >= sibs.length) {
            const rect = sibs[sibs.length - 1].getBoundingClientRect();
            x = rect.right - containerRect.left + container.scrollLeft;
          } else {
            const rect = sibs[index].getBoundingClientRect();
            x = rect.left - containerRect.left + container.scrollLeft;
          }
          indicator.style.left = `${x - 2}px`;
          indicator.classList.add('visible');
        }

        function onMove(ev) {
          if (ev.pointerId !== pointerId) return;
          const dx = ev.clientX - startX;
          if (!dragging && Math.abs(dx) > 14) {
            dragging = true;
            suppressClick = true;
            dragEl.classList.add('dragging');
            try { dragEl.setPointerCapture(pointerId); } catch {}
          }
          if (!dragging) return;
          ev.preventDefault();
          dragEl.style.transform = `translateX(${dx}px)`;
          dropIndex = computeDropIndex(ev.clientX);
          showIndicatorAt(dropIndex);
        }
        function onUp(ev) {
          if (ev.pointerId !== pointerId) return;
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          window.removeEventListener('pointercancel', onUp);
          indicator.classList.remove('visible');
          if (dragging) {
            dragEl.style.transform = '';
            dragEl.classList.remove('dragging');
            try { dragEl.releasePointerCapture(pointerId); } catch {}

            if (dropIndex !== null) {
              const sibs = siblings();
              if (dropIndex >= sibs.length) {
                container.insertBefore(dragEl, indicator);
              } else {
                container.insertBefore(dragEl, sibs[dropIndex]);
              }
            }
            onReorder(Array.from(container.children).filter(c => c !== indicator).map(c => c.dataset.dndId));
          }
        }
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
      });
    });
  }

  // ---- Randare taburi (categorii, selectie multipla) ----
  function renderTabs() {
    // O categorie apare in bara de taburi doar daca are cel putin o sursa activa
    // (sourcesInCategory stie deja regulile speciale: International exclude IT,
    // iar IT accepta si surse non-RO).
    const categories = applyCustomOrder(
      CATEGORY_ORDER.filter(c => sourcesInCategory(c).length > 0),
      settings.categoryOrder,
      c => c
    );

    tabsEl.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.dataset.dndId = cat;
      btn.textContent = CATEGORY_LABELS[cat] || cat;
      btn.setAttribute('aria-pressed', String(activeCategories.has(cat)));
      btn.addEventListener('click', () => {
        if (activeCategories.has(cat)) activeCategories.delete(cat); else activeCategories.add(cat);
        activeSources = new Set(); // schimbarea categoriilor reseteaza ingustarea pe surse individuale
        saveActiveFilters();
        renderTabs();
        renderSourceChips();
        renderList();
      });
      tabsEl.appendChild(btn);
    });

    makeSortable(tabsEl, newOrder => {
      settings.categoryOrder = newOrder;
      saveSettings(settings);
    });
  }

  // ---- Randare rand secundar (surse individuale, selectie multipla) ----
  function renderSourceChips() {
    subTabsEl.innerHTML = '';
    if (activeCategories.size === 0) {
      subTabsEl.classList.remove('visible');
      return;
    }
    const sources = applyCustomOrder(sourcesInActiveCategories(), settings.sourceOrder, s => s.name);
    if (sources.length <= 1) {
      subTabsEl.classList.remove('visible');
      return;
    }
    subTabsEl.classList.add('visible');

    sources.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'tab tab-sub';
      btn.dataset.dndId = s.name;
      btn.textContent = s.name;
      btn.setAttribute('aria-pressed', String(activeSources.has(s.name)));
      btn.addEventListener('click', () => {
        if (activeSources.has(s.name)) activeSources.delete(s.name); else activeSources.add(s.name);
        saveActiveFilters();
        renderSourceChips();
        renderList();
      });
      subTabsEl.appendChild(btn);
    });

    makeSortable(subTabsEl, newOrder => {
      const prev = settings.sourceOrder || [];
      settings.sourceOrder = [...newOrder, ...prev.filter(n => !newOrder.includes(n))];
      saveSettings(settings);
    });
  }

  // ---- Randare listă ----
  function renderList() {
    currentView = 'list';
    const filtered = poolItems();

    mainEl.innerHTML = '';

    if (filtered.length === 0) {
      const state = document.createElement('div');
      state.className = 'state';
      state.textContent = 'Nicio știre de afișat momentan.';
      mainEl.appendChild(state);
      updateNavButtons();
      window.scrollTo(0, 0);
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list';

    filtered.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item';

      const btn = document.createElement('button');
      btn.className = 'item-btn';

      if (item.image) {
        const img = document.createElement('img');
        img.className = 'item-thumb';
        img.src = `${WORKER_URL}?image=${encodeURIComponent(item.image)}`;
        img.alt = '';
        img.loading = 'lazy';
        img.addEventListener('error', () => img.remove());
        btn.appendChild(img);
      }

      const textWrap = document.createElement('div');
      textWrap.className = 'item-text';

      const title = document.createElement('p');
      title.className = 'item-title' + (readLinks.has(item.link) ? ' is-read' : '');
      title.textContent = item.title;

      const meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.innerHTML = isFutureDate(item.date)
        ? `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span>`
        : `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span><span>·</span><span>${formatRelativeTime(item.date)}</span>`;

      textWrap.appendChild(title);
      textWrap.appendChild(meta);
      btn.appendChild(textWrap);
      btn.addEventListener('click', () => navigateToArticle(item));

      const star = document.createElement('button');
      star.className = 'fav-star' + (isFavorite(item.link) ? ' active' : '');
      star.setAttribute('aria-label', 'Favorit');
      star.textContent = isFavorite(item.link) ? '★' : '☆';
      star.addEventListener('click', () => {
        toggleFavorite(item);
        star.classList.toggle('active');
        star.textContent = isFavorite(item.link) ? '★' : '☆';
      });

      li.appendChild(btn);
      li.appendChild(star);
      ul.appendChild(li);
    });

    mainEl.appendChild(ul);
    updateNavButtons();
    window.scrollTo(0, 0);
  }

  // ---- Vizualizare articol ----
  function navigateToArticle(item) {
    history.pushState({ view: 'article', item }, '');
    hasForwardEntry = false; // o navigare noua taie orice ramura de "inainte" existenta
    renderArticleView(item);
  }

  function readingHeaderHtml(item) {
    return `
      <div class="reading-header">
        <button class="back-btn" id="backBtn">Înapoi la titluri</button>
        <button class="fav-star-reading${isFavorite(item.link) ? ' active' : ''}" id="favStarReading" aria-label="Favorit">${isFavorite(item.link) ? '★' : '☆'}</button>
      </div>`;
  }
  function wireReadingHeader(item) {
    document.getElementById('backBtn').addEventListener('click', goBackInApp);
    const star = document.getElementById('favStarReading');
    star.addEventListener('click', () => {
      toggleFavorite(item);
      star.classList.toggle('active');
      star.textContent = isFavorite(item.link) ? '★' : '☆';
    });
  }

  async function renderArticleView(item) {
    currentView = 'article';
    updateNavButtons();
    window.scrollTo(0, 0);
    markAsRead(item.link);

    mainEl.innerHTML = `
      <div class="reading">
        ${readingHeaderHtml(item)}
        <div class="state">Se încarcă articolul…</div>
      </div>`;
    wireReadingHeader(item);

    function renderBody(text, offlineNotice) {
      const paragraphs = (text || '')
        .split('\n\n')
        .filter(p => p.trim())
        .map(p => `<p>${escapeHtml(p)}</p>`)
        .join('');
      mainEl.innerHTML = `
        <div class="reading">
          ${readingHeaderHtml(item)}
          <p class="reading-meta"><span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span>${isFutureDate(item.date) ? '' : ` · ${formatFullDate(item.date)}`}</p>
          <h1 class="reading-title">${escapeHtml(item.title)}</h1>
          ${offlineNotice ? `<p class="offline-status visible" style="margin-bottom:1rem;">${offlineNotice}</p>` : ''}
          <div class="reading-body">${paragraphs || '<p>Nu am putut extrage textul acestui articol.</p>'}</div>
          <a class="reading-source-link" href="${item.link}" target="_blank" rel="noopener">Vezi articolul original</a>
        </div>`;
      wireReadingHeader(item);
    }

    try {
      const res = await fetch(`${WORKER_URL}?article=${encodeURIComponent(item.link)}`);
      if (!res.ok) throw new Error('Răspuns invalid de la server');
      const data = await res.json();
      renderBody(data.text);
      offlineSet({ link: item.link, title: item.title, source: item.source, date: item.date, text: data.text || '', cachedAt: Date.now() });
    } catch (err) {
      // Fara conexiune (sau eroare de retea) - incercam varianta salvata offline, daca exista
      const cached = await offlineGet(item.link);
      if (cached && cached.text) {
        renderBody(cached.text, 'Text disponibil offline (salvat anterior).');
        return;
      }
      mainEl.innerHTML = `
        <div class="reading">
          ${readingHeaderHtml(item)}
          <div class="state">
            <strong>Nu am putut încărca articolul</strong>
            A apărut o problemă la extragerea textului (posibil fără conexiune, iar articolul nu era salvat offline). Poți încerca din nou sau deschide articolul original.
            <br><a class="reading-source-link" href="${item.link}" target="_blank" rel="noopener">Vezi articolul original</a>
          </div>
        </div>`;
      wireReadingHeader(item);
    }
  }

  // ---- Navigare inapoi/inainte (buton fizic al telefonului + butoanele proprii) ----
  function goBackInApp() {
    if (currentView === 'list') return; // nu avem unde sa mergem inapoi in aplicatie
    history.back();
  }
  function goForwardInApp() {
    if (!hasForwardEntry) return;
    history.forward();
  }
  function updateNavButtons() {
    const backDisabled = currentView === 'list';
    const forwardDisabled = !hasForwardEntry;
    [document.getElementById('backBtnTop'), document.getElementById('backBtnBottom')].forEach(b => b.disabled = backDisabled);
    [document.getElementById('forwardBtnTop'), document.getElementById('forwardBtnBottom')].forEach(b => b.disabled = forwardDisabled);
  }

  window.addEventListener('popstate', event => {
    const state = event.state;
    if (state && state.view === 'article' && state.item) {
      hasForwardEntry = false;
      renderArticleView(state.item);
      return;
    }
    if (state && state.view === 'settings') {
      hasForwardEntry = false;
      renderSettingsView();
      return;
    }
    if (state && state.view === 'favorites') {
      hasForwardEntry = false;
      renderFavoritesView();
      return;
    }
    const wasSubPage = currentView !== 'list';
    hasForwardEntry = wasSubPage; // tocmai am revenit DE la un articol/setari/favorite, deci exista o ramura "inainte"
    renderList();
  });

  [document.getElementById('backBtnTop'), document.getElementById('backBtnBottom')].forEach(b => b.addEventListener('click', goBackInApp));
  [document.getElementById('forwardBtnTop'), document.getElementById('forwardBtnBottom')].forEach(b => b.addEventListener('click', goForwardInApp));

  // ---- Încărcare inițială ----
  async function loadFeed() {
    try {
      const res = await fetch(WORKER_URL);
      if (!res.ok) throw new Error('Răspuns invalid de la server');
      const data = await res.json();

      sourceMeta = data.sources || [];
      allItems = (data.items || []).filter(i => i.title && i.link).sort((a, b) => effectiveTimestamp(b.date) - effectiveTimestamp(a.date));
      saveLastFeedSnapshot();

      history.replaceState({ view: 'list' }, '');
      renderTabs();
      renderSourceChips();
      renderList();
    } catch (err) {
      // Fara conexiune la pornire: aratam ultima lista salvata local, daca exista,
      // in loc de o eroare goala - util cand redeschizi aplicatia fara semnal (ex. in avion).
      const snapshot = loadLastFeedSnapshot();
      if (snapshot && snapshot.items && snapshot.items.length > 0) {
        sourceMeta = snapshot.sources || [];
        allItems = snapshot.items;
        history.replaceState({ view: 'list' }, '');
        renderTabs();
        renderSourceChips();
        renderList();
        const statusEl = document.getElementById('offlineStatus');
        statusEl.textContent = 'Fără conexiune — se arată ultima listă salvată.';
        statusEl.classList.add('visible');
        return;
      }
      mainEl.innerHTML = `
        <div class="state">
          <strong>Nu am putut încărca știrile</strong>
          Verifică legătura la internet sau încearcă din nou.
          <br><button class="retry-btn" id="retryBtn">Încearcă din nou</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', loadFeed);
    }
  }

  // ---- Pornire ----
  applyVisualSettings();
  initHeaderButtons();
  loadFeed();

  // ---- Instalare: banner propriu la prima deschidere, in loc sa astepti meniul browserului ----
  const INSTALL_DISMISSED_KEY = 'stiriNestireInstallDismissed';
  let deferredInstallPrompt = null;

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }

  function showInstallBanner(mode) {
    if (isStandalone()) return; // deja instalata/deschisa ca aplicatie
    if (localStorage.getItem(INSTALL_DISMISSED_KEY)) return;
    if (document.getElementById('updateBanner').classList.contains('visible')) return; // update-ul are prioritate

    const banner = document.getElementById('installBanner');
    const textEl = document.getElementById('installBannerText');
    const actionBtn = document.getElementById('installActionBtn');

    if (mode === 'ios') {
      textEl.textContent = 'Adaugă aplicația pe ecranul principal: atinge Distribuire, apoi „Adaugă pe ecranul principal".';
      actionBtn.style.display = 'none';
    } else {
      textEl.textContent = 'Instalează aplicația pentru acces rapid, ca orice altă aplicație.';
      actionBtn.style.display = '';
    }
    banner.classList.add('visible');
  }

  function hideInstallBanner() {
    document.getElementById('installBanner').classList.remove('visible');
  }

  // Android si PC (Chrome/Edge): browserul ne anunta cand aplicatia e instalabila
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    showInstallBanner('android-pc');
  });

  document.getElementById('installActionBtn').addEventListener('click', async () => {
    hideInstallBanner();
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    localStorage.setItem(INSTALL_DISMISSED_KEY, '1');
  });

  document.getElementById('installDismissBtn').addEventListener('click', () => {
    hideInstallBanner();
    localStorage.setItem(INSTALL_DISMISSED_KEY, '1');
  });

  window.addEventListener('appinstalled', () => {
    hideInstallBanner();
    localStorage.setItem(INSTALL_DISMISSED_KEY, '1');
  });

  // iOS (Safari): "beforeinstallprompt" nu exista deloc acolo - aratam noi indicatia manuala
  if (isIOS() && !isStandalone() && !localStorage.getItem(INSTALL_DISMISSED_KEY)) {
    showInstallBanner('ios');
  }

  // ---- Detectare versiune noua a aplicatiei ----
  if ('serviceWorker' in navigator) {
    function showUpdateBanner(waitingWorker) {
      hideInstallBanner(); // update-ul are prioritate fata de promptul de instalare
      const banner = document.getElementById('updateBanner');
      banner.classList.add('visible');
      document.getElementById('updateReloadBtn').onclick = () => {
        waitingWorker.postMessage({ type: 'SKIP_WAITING' });
      };
    }

    let refreshingPage = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshingPage) return;
      refreshingPage = true;
      window.location.reload();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(registration => {
        // Caz 1: exista deja un worker nou, in asteptare, de la o vizita anterioara
        if (registration.waiting) {
          showUpdateBanner(registration.waiting);
        }
        // Caz 2: se instaleaza un worker nou chiar acum, cat timp pagina e deschisa
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(newWorker);
            }
          });
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
