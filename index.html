<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Știri în neștire</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C5F63" id="themeColorMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Neștire">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #F1EFE7;
    --paper-raised: #E9E6DA;
    --ink: #20241F;
    --ink-soft: #5B6058;
    --rule: #D8D4C7;
    --teal: #2C5F63;
    --brick: #8B3E32;
    --max-width: 640px;
  }

  html[data-theme="dark"] {
    --paper: #181B18;
    --paper-raised: #21251F;
    --ink: #ECE8DC;
    --ink-soft: #9AA098;
    --rule: #33372F;
    --teal: #6FB3AC;
    --brick: #D98F7C;
  }

  html[data-font-size="small"] { font-size: 14.5px; }
  html[data-font-size="medium"] { font-size: 16px; }
  html[data-font-size="large"] { font-size: 18px; }
  html[data-font-size="xlarge"] { font-size: 20.5px; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.15s ease, color 0.15s ease;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: var(--max-width);
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }

  /* Masthead */
  header.masthead {
    padding: 1.5rem 1.1rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .wordmark {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.7rem;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1.15;
  }

  .tagline {
    margin: 0.35rem 0 0;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  button.icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--ink-soft);
    padding: 0.3rem 0.4rem;
    line-height: 1;
    border-radius: 6px;
  }
  button.icon-btn:hover, button.icon-btn:focus-visible { background: var(--paper-raised); }
  button.icon-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* Settings panel */
  .settings-panel {
    border-bottom: 1px solid var(--rule);
    padding: 1rem 1.1rem 1.2rem;
    display: none;
  }
  .settings-panel.open { display: block; }

  .settings-group { margin-bottom: 1rem; }
  .settings-group:last-child { margin-bottom: 0; }

  .settings-label {
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 0 0 0.5rem;
  }

  .segmented {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }

  .segmented button {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.4rem 0.7rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .segmented button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .shade-swatch {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }
  .shade-dot {
    width: 0.85rem;
    height: 0.85rem;
    border-radius: 50%;
    border: 1px solid var(--rule);
  }

  .source-checklist {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .source-check {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
  }
  .source-check input { accent-color: var(--teal); width: 1.05rem; height: 1.05rem; }

  .select-all-btn {
    all: unset;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--teal);
    margin-top: 0.4rem;
    display: inline-block;
  }

  /* Source tabs */
  nav.tabs {
    display: flex;
    gap: 0.25rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
  }

  .tab {
    appearance: none;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.44rem 0.9rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* List */
  main { flex: 1; padding: 0.25rem 0 2.5rem; }

  ul.list { list-style: none; margin: 0; padding: 0; }
  li.item { border-bottom: 1px solid var(--rule); }

  button.item-btn {
    all: unset;
    display: block;
    width: 100%;
    padding: 1.1rem 1.25rem;
    cursor: pointer;
    box-sizing: border-box;
  }
  button.item-btn:hover, button.item-btn:focus-visible { background: var(--paper-raised); }
  button.item-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: -2px; }

  .item-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 1.19rem;
    line-height: 1.32;
    margin: 0 0 0.5rem;
    color: var(--ink);
  }

  .item-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.81rem;
    color: var(--ink-soft);
  }

  .source-tag { font-weight: 600; }

  /* Reading view */
  .reading { padding: 0.5rem 1.25rem 3.75rem; }

  button.back-btn {
    all: unset;
    display: inline-block;
    cursor: pointer;
    font-size: 0.875rem;
    color: var(--teal);
    padding: 0.75rem 0;
  }
  button.back-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .reading-meta { font-size: 0.81rem; color: var(--ink-soft); margin-bottom: 0.6rem; }

  .reading-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.625rem;
    line-height: 1.28;
    margin: 0 0 1.25rem;
    color: var(--ink);
  }

  .reading-body p {
    font-family: 'Source Serif 4', serif;
    font-size: 1.125rem;
    line-height: 1.6;
    max-width: 66ch;
    margin: 0 0 1.1em;
    color: var(--ink);
  }

  .reading-source-link {
    display: inline-block;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: var(--ink-soft);
  }

  /* States */
  .state { padding: 3.75rem 1.5rem; text-align: center; color: var(--ink-soft); font-size: 0.94rem; }
  .state strong { display: block; color: var(--ink); font-size: 1.06rem; margin-bottom: 0.4rem; font-weight: 600; }

  .retry-btn {
    margin-top: 0.9rem;
    appearance: none;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
  }

  /* Banner "versiune noua" */
  .update-banner {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 1.1rem;
    transform: translateX(-50%);
    max-width: calc(var(--max-width) - 2rem);
    width: calc(100% - 2rem);
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 0.8rem 1rem;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    font-size: 0.85rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 50;
  }
  .update-banner.visible { display: flex; }
  .update-banner button {
    appearance: none;
    border: 1px solid var(--paper);
    background: transparent;
    color: var(--paper);
    font-family: inherit;
    font-size: 0.82rem;
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <header class="masthead">
      <div>
        <p class="wordmark">Știri în neștire</p>
        <p class="tagline">Titluri, rapid. Fără reclame, fără zgomot.</p>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Setări" aria-expanded="false">⚙</button>
    </header>

    <div class="settings-panel" id="settingsPanel">
      <div class="settings-group">
        <p class="settings-label">Temă</p>
        <div class="segmented" id="themeGroup">
          <button data-value="light">Deschis</button>
          <button data-value="dark">Întunecat</button>
          <button data-value="system">Automat</button>
        </div>
      </div>
      <div class="settings-group">
        <p class="settings-label">Mărime text</p>
        <div class="segmented" id="fontSizeGroup">
          <button data-value="small">Mic</button>
          <button data-value="medium">Normal</button>
          <button data-value="large">Mare</button>
          <button data-value="xlarge">Foarte mare</button>
        </div>
      </div>
      <div class="settings-group">
        <p class="settings-label">Nuanță text</p>
        <div class="segmented" id="shadeGroup"></div>
      </div>
      <div class="settings-group">
        <p class="settings-label">Surse afișate</p>
        <div class="segmented" id="countryQuickGroup" style="margin-bottom:0.6rem;">
          <button data-value="all">Toate</button>
          <button data-value="RO">Românești</button>
          <button data-value="International">Internaționale</button>
        </div>
        <div class="source-checklist" id="sourceChecklist"></div>
        <button class="select-all-btn" id="selectAllBtn">Selectează tot</button>
      </div>
    </div>

    <nav class="tabs" id="tabs"></nav>
    <main id="main">
      <div class="state">Se încarcă titlurile…</div>
    </main>

    <div class="update-banner" id="updateBanner">
      <span>O versiune nouă e disponibilă.</span>
      <button id="updateReloadBtn">Reîncarcă</button>
    </div>
  </div>

<script>
  // ---- Configurare ----
  const WORKER_URL = 'https://stiri-proxy.tomaunguru.workers.dev/';
  const SETTINGS_KEY = 'stiriNestireSettings';

  const SHADE_PRESETS = [
    { id: 'default', label: 'Standard', light: '#20241F', dark: '#ECE8DC' },
    { id: 'warm',    label: 'Alb cald',  light: '#3A2E1E', dark: '#F2E6C9' },
    { id: 'cool',    label: 'Gri rece',  light: '#1E2733', dark: '#C9D6DD' },
    { id: 'sepia',   label: 'Sepia',     light: '#4B3621', dark: '#D9C9A3' }
  ];

  const DEFAULT_SETTINGS = {
    theme: 'system',
    fontSize: 'medium',
    shade: 'default',
    selectedSources: null // null = toate sursele descoperite
  };

  function loadSettings() {
    try {
      const raw = localStorage.getItem(SETTINGS_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
    } catch {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings(settings) {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {}
  }

  let settings = loadSettings();

  // ---- Aplicarea setărilor vizuale ----
  function resolvedTheme() {
    if (settings.theme === 'system') {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return settings.theme;
  }

  function applyVisualSettings() {
    const theme = resolvedTheme();
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.fontSize = settings.fontSize;

    const shade = SHADE_PRESETS.find(s => s.id === settings.shade) || SHADE_PRESETS[0];
    document.documentElement.style.setProperty('--ink', theme === 'dark' ? shade.dark : shade.light);

    const themeColorMeta = document.getElementById('themeColorMeta');
    if (themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#181B18' : '#2C5F63');
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (settings.theme === 'system') applyVisualSettings();
  });

  // ---- Construirea panoului de setări ----
  function wireSegmented(groupEl, currentValue, onPick) {
    Array.from(groupEl.children).forEach(btn => {
      btn.setAttribute('aria-pressed', String(btn.dataset.value === currentValue));
      btn.addEventListener('click', () => {
        onPick(btn.dataset.value);
        Array.from(groupEl.children).forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
      });
    });
  }

  function initSettingsPanel() {
    wireSegmented(document.getElementById('themeGroup'), settings.theme, value => {
      settings.theme = value; saveSettings(settings); applyVisualSettings();
    });
    wireSegmented(document.getElementById('fontSizeGroup'), settings.fontSize, value => {
      settings.fontSize = value; saveSettings(settings); applyVisualSettings();
    });

    const shadeGroup = document.getElementById('shadeGroup');
    shadeGroup.innerHTML = '';
    SHADE_PRESETS.forEach(preset => {
      const btn = document.createElement('button');
      btn.dataset.value = preset.id;
      const previewColor = resolvedTheme() === 'dark' ? preset.dark : preset.light;
      btn.innerHTML = `<span class="shade-swatch"><span class="shade-dot" style="background:${previewColor}"></span>${preset.label}</span>`;
      shadeGroup.appendChild(btn);
    });
    wireSegmented(shadeGroup, settings.shade, value => {
      settings.shade = value; saveSettings(settings); applyVisualSettings();
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      const panel = document.getElementById('settingsPanel');
      const isOpen = panel.classList.toggle('open');
      document.getElementById('settingsBtn').setAttribute('aria-expanded', String(isOpen));
    });
  }

  function renderSourceChecklist() {
    const container = document.getElementById('sourceChecklist');
    container.innerHTML = '';
    const discovered = sourceMeta.map(s => s.name);
    const effectiveSelected = settings.selectedSources || discovered;

    // Grupam sursele pe categorie, ca sa fie usor de scanat lista cand cresc sursele
    const byCategory = {};
    sourceMeta.forEach(s => {
      const cat = s.category || 'Altele';
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(s);
    });

    Object.keys(byCategory).sort().forEach(cat => {
      const heading = document.createElement('p');
      heading.textContent = cat;
      heading.style.cssText = 'font-size:0.72rem;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin:0.7rem 0 0.3rem;';
      container.appendChild(heading);

      byCategory[cat].forEach(s => {
        const label = document.createElement('label');
        label.className = 'source-check';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = effectiveSelected.includes(s.name);
        checkbox.addEventListener('change', () => {
          const current = new Set(settings.selectedSources || discovered);
          if (checkbox.checked) current.add(s.name); else current.delete(s.name);
          settings.selectedSources = Array.from(current);
          saveSettings(settings);
          activeFilter = 'Toate';
          renderTabs();
          renderList();
        });
        label.appendChild(checkbox);
        const countryTag = s.country === 'RO' ? 'RO' : 'INT';
        label.appendChild(document.createTextNode(`${s.name} `));
        const tagSpan = document.createElement('span');
        tagSpan.textContent = countryTag;
        tagSpan.style.cssText = 'font-size:0.68rem;color:var(--ink-soft);border:1px solid var(--rule);border-radius:4px;padding:0.05rem 0.3rem;';
        label.appendChild(tagSpan);
        container.appendChild(label);
      });
    });

    document.getElementById('selectAllBtn').onclick = () => {
      settings.selectedSources = null;
      saveSettings(settings);
      renderSourceChecklist();
      activeFilter = 'Toate';
      renderTabs();
      renderList();
    };

    // Butoane rapide: Toate / Romanesti / Internationale
    const quickGroup = document.getElementById('countryQuickGroup');
    Array.from(quickGroup.children).forEach(btn => {
      btn.onclick = () => {
        if (btn.dataset.value === 'all') {
          settings.selectedSources = null;
        } else {
          settings.selectedSources = sourceMeta.filter(s => s.country === btn.dataset.value).map(s => s.name);
        }
        saveSettings(settings);
        renderSourceChecklist();
        activeFilter = 'Toate';
        renderTabs();
        renderList();
      };
    });
  }

  // ---- Stare ----
  let allItems = [];
  let sourceMeta = []; // [{name, country, category}, ...] - vine de la Worker
  let activeFilter = 'Toate';

  const tabsEl = document.getElementById('tabs');
  const mainEl = document.getElementById('main');

  // ---- Utilitare culoare pe sursă ----
  const TAG_PALETTE = ['#2C5F63', '#8B3E32', '#6B5B95', '#4C6E3C', '#8A6D1F', '#3D5A80'];
  function colorForSource(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return TAG_PALETTE[hash % TAG_PALETTE.length];
  }

  function formatRelativeTime(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    const diffMs = Date.now() - date.getTime();
    const diffMin = Math.round(diffMs / 60000);
    if (diffMin < 1) return 'chiar acum';
    if (diffMin < 60) return `acum ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `acum ${diffH} h`;
    const diffD = Math.round(diffH / 24);
    return `acum ${diffD} zile`;
  }

  function formatFullDate(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    return date.toLocaleString('ro-RO', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Sursele "efective" (cele bifate in setari) ----
  function discoveredSourceNames() {
    return sourceMeta.map(s => s.name);
  }
  function effectiveSources() {
    const discovered = discoveredSourceNames();
    return settings.selectedSources ? settings.selectedSources.filter(s => discovered.includes(s)) : discovered;
  }
  function poolItems() {
    const active = effectiveSources();
    return allItems.filter(i => active.includes(i.source));
  }

  // ---- Randare taburi ----
  function renderTabs() {
    const sources = ['Toate', ...effectiveSources()];
    tabsEl.innerHTML = '';
    sources.forEach(src => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = src;
      btn.setAttribute('aria-pressed', String(src === activeFilter));
      btn.addEventListener('click', () => {
        activeFilter = src;
        renderTabs();
        renderList();
      });
      tabsEl.appendChild(btn);
    });
  }

  // ---- Randare listă ----
  function renderList() {
    const pool = poolItems();
    const filtered = activeFilter === 'Toate' ? pool : pool.filter(i => i.source === activeFilter);

    if (filtered.length === 0) {
      mainEl.innerHTML = '<div class="state">Nicio știre de afișat momentan.</div>';
      return;
    }

    const ul = document.createElement('ul');
    ul.className = 'list';

    filtered.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item';

      const btn = document.createElement('button');
      btn.className = 'item-btn';

      const title = document.createElement('p');
      title.className = 'item-title';
      title.textContent = item.title;

      const meta = document.createElement('div');
      meta.className = 'item-meta';
      meta.innerHTML = `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span><span>·</span><span>${formatRelativeTime(item.date)}</span>`;

      btn.appendChild(title);
      btn.appendChild(meta);
      btn.addEventListener('click', () => openArticle(item));

      li.appendChild(btn);
      ul.appendChild(li);
    });

    mainEl.innerHTML = '';
    mainEl.appendChild(ul);
  }

  // ---- Vizualizare articol ----
  async function openArticle(item) {
    mainEl.innerHTML = `
      <div class="reading">
        <button class="back-btn" id="backBtn">Înapoi la titluri</button>
        <div class="state">Se încarcă articolul…</div>
      </div>`;
    document.getElementById('backBtn').addEventListener('click', renderList);

    try {
      const res = await fetch(`${WORKER_URL}?article=${encodeURIComponent(item.link)}`);
      if (!res.ok) throw new Error('Răspuns invalid de la server');
      const data = await res.json();

      const paragraphs = (data.text || '')
        .split('\n\n')
        .filter(p => p.trim())
        .map(p => `<p>${escapeHtml(p)}</p>`)
        .join('');

      mainEl.innerHTML = `
        <div class="reading">
          <button class="back-btn" id="backBtn">Înapoi la titluri</button>
          <p class="reading-meta"><span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span> · ${formatFullDate(item.date)}</p>
          <h1 class="reading-title">${escapeHtml(item.title)}</h1>
          <div class="reading-body">${paragraphs || '<p>Nu am putut extrage textul acestui articol.</p>'}</div>
          <a class="reading-source-link" href="${item.link}" target="_blank" rel="noopener">Vezi articolul original</a>
        </div>`;
      document.getElementById('backBtn').addEventListener('click', renderList);
    } catch (err) {
      mainEl.innerHTML = `
        <div class="reading">
          <button class="back-btn" id="backBtn">Înapoi la titluri</button>
          <div class="state">
            <strong>Nu am putut încărca articolul</strong>
            A apărut o problemă la extragerea textului. Poți încerca din nou sau deschide articolul original.
            <br><a class="reading-source-link" href="${item.link}" target="_blank" rel="noopener">Vezi articolul original</a>
          </div>
        </div>`;
      document.getElementById('backBtn').addEventListener('click', renderList);
    }
  }

  // ---- Încărcare inițială ----
  async function loadFeed() {
    try {
      const res = await fetch(WORKER_URL);
      if (!res.ok) throw new Error('Răspuns invalid de la server');
      const data = await res.json();

      sourceMeta = data.sources || [];
      allItems = (data.items || []).filter(i => i.title && i.link).sort((a, b) => new Date(b.date) - new Date(a.date));

      renderSourceChecklist();
      renderTabs();
      renderList();
    } catch (err) {
      mainEl.innerHTML = `
        <div class="state">
          <strong>Nu am putut încărca știrile</strong>
          Verifică legătura la internet sau încearcă din nou.
          <br><button class="retry-btn" id="retryBtn">Încearcă din nou</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', loadFeed);
    }
  }

  // ---- Pornire ----
  applyVisualSettings();
  initSettingsPanel();
  loadFeed();

  // ---- Detectare versiune noua a aplicatiei ----
  if ('serviceWorker' in navigator) {
    function showUpdateBanner(waitingWorker) {
      const banner = document.getElementById('updateBanner');
      banner.classList.add('visible');
      document.getElementById('updateReloadBtn').onclick = () => {
        waitingWorker.postMessage({ type: 'SKIP_WAITING' });
      };
    }

    let refreshingPage = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshingPage) return;
      refreshingPage = true;
      window.location.reload();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(registration => {
        // Caz 1: exista deja un worker nou, in asteptare, de la o vizita anterioara
        if (registration.waiting) {
          showUpdateBanner(registration.waiting);
        }
        // Caz 2: se instaleaza un worker nou chiar acum, cat timp pagina e deschisa
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(newWorker);
            }
          });
        });
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
