  // ---- Cache offline pentru text de articole (IndexedDB - poate creste mult mai mult) ----
  const OFFLINE_DB_NAME = 'stiriNestireOffline';
  const OFFLINE_STORE = 'articles';

  // O singura conexiune, deschisa la prima nevoie si refolosita (inainte: cate una noua
  // la fiecare citire/scriere, niciodata inchisa).
  let offlineDbPromise = null;
  function openOfflineDB() {
    if (!offlineDbPromise) {
      offlineDbPromise = openOfflineDBOnce().catch(e => { offlineDbPromise = null; throw e; });
    }
    return offlineDbPromise;
  }
  function openOfflineDBOnce() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB indisponibil')); return; }
      const req = indexedDB.open(OFFLINE_DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(OFFLINE_STORE)) {
          req.result.createObjectStore(OFFLINE_STORE, { keyPath: 'link' });
        }
      };
      req.onsuccess = () => {
        const db = req.result;
        db.onversionchange = () => { db.close(); offlineDbPromise = null; };
        db.onclose = () => { offlineDbPromise = null; };
        resolve(db);
      };
      req.onerror = () => reject(req.error);
    });
  }
  async function offlineGet(link) {
    try {
      const db = await openOfflineDB();
      return await new Promise((resolve, reject) => {
        const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).get(link);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    } catch { return null; }
  }
  async function offlineSet(entry) {
    try {
      const db = await openOfflineDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        tx.objectStore(OFFLINE_STORE).put(entry);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  async function offlineGetAllKeys() {
    try {
      const db = await openOfflineDB();
      return await new Promise((resolve, reject) => {
        const req = db.transaction(OFFLINE_STORE, 'readonly').objectStore(OFFLINE_STORE).getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    } catch { return []; }
  }

  async function offlineClear() {
    try {
      const db = await openOfflineDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        tx.objectStore(OFFLINE_STORE).clear();
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  // Articolele offline mai vechi de 14 zile se sterg singure la pornire,
  // ca spatiul ocupat pe telefon sa nu creasca la nesfarsit.
  const OFFLINE_MAX_AGE_MS = 14 * 24 * 60 * 60 * 1000;
  async function offlinePrune() {
    try {
      const db = await openOfflineDB();
      const limit = Date.now() - OFFLINE_MAX_AGE_MS;
      await new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        const req = tx.objectStore(OFFLINE_STORE).openCursor();
        req.onsuccess = () => {
          const cursor = req.result;
          if (!cursor) return;
          if (!cursor.value.cachedAt || cursor.value.cachedAt < limit) cursor.delete();
          cursor.continue();
        };
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    } catch {}
  }
  async function updateOfflineInfo() {
    const el = document.getElementById('offlineInfo');
    if (!el) return;
    const count = (await offlineGetAllKeys()).length;
    el.textContent = count === 0
      ? 'Niciun articol salvat. (Se șterg automat după 14 zile.)'
      : `${count} ${count === 1 ? 'articol salvat' : 'articole salvate'}. Se șterg automat după 14 zile.`;
  }

  // Descarca, la cerere (buton), textul articolelor din sectiunea curent
  // selectata, fara poze (doar text - cat mai usor). Sare peste ce e deja
  // descarcat, ca sa nu reia acelasi lucru de fiecare data.
  let offlineDownloadRunning = false;
  let offlineDownloadLabel = '';
  async function downloadOfflineArticles() {
    if (offlineDownloadRunning) return; // a doua atingere rapida nu mai porneste inca o descarcare
    const statusEl = document.getElementById('offlineStatus');
    // Mesajul apare si pe butonul din panou (panoul se poate redesena intre timp)
    const setStatus = text => {
      statusEl.textContent = text;
      statusEl.classList.toggle('visible', Boolean(text));
      offlineDownloadLabel = text ? `⬇ ${text}` : '';
      const b = document.getElementById('offlineDownloadBtn');
      if (b) {
        b.textContent = offlineDownloadLabel || '⬇ Salvează pentru citit fără internet';
        b.disabled = offlineDownloadRunning;
      }
    };

    offlineDownloadRunning = true;
    const pool = poolItems();
    if (pool.length === 0) {
      offlineDownloadRunning = false;
      setStatus('Nimic de descărcat momentan.');
      setTimeout(() => setStatus(''), 2500);
      return;
    }
    const cachedKeys = new Set(await offlineGetAllKeys());
    const toDownload = pool.filter(i => !cachedKeys.has(i.link)).slice(0, 40);
    if (toDownload.length === 0) {
      offlineDownloadRunning = false;
      setStatus('Ai deja salvat tot pentru citit fără internet.');
      setTimeout(() => setStatus(''), 2500);
      return;
    }

    setStatus(`Se salvează ${toDownload.length} articole pentru citit fără internet…`);

    let done = 0;
    let saved = 0;
    let idx = 0;
    async function worker() {
      while (idx < toDownload.length) {
        const item = toDownload[idx++];
        try {
          const res = await fetch(`${WORKER_URL}?article=${encodeURIComponent(item.link)}`);
          const data = await res.json();
          // Articolele fara text (blocate de site, doar pentru abonati) nu se salveaza:
          // altfel ar parea "descarcate" si n-ar mai fi reincercate.
          if (res.ok && data && data.text) {
            await offlineSet({ link: item.link, title: item.title, source: item.source, date: item.date, text: data.text, cachedAt: Date.now() });
            saved++;
          }
        } catch {}
        done++;
        setStatus(`Se salvează articolele… (${done}/${toDownload.length})`);
      }
    }
    await Promise.all([worker(), worker(), worker()]); // 3 cereri simultane
    offlineDownloadRunning = false;
    const missed = toDownload.length - saved;
    setStatus(`Gata — ${saved} ${saved === 1 ? 'articol salvat' : 'articole salvate'} pentru citit fără internet.`
      + (missed ? ` ${missed} fără text disponibil (site blocat sau doar pentru abonați).` : ''));
    setTimeout(() => setStatus(''), 3000);
  }

  const CATEGORY_LABELS = {
    Actualitati: 'Actualități',
    Vremea: 'Vremea',
    Sport: 'Sport',
    Financiar: 'Financiar',
    IT: 'IT/Tech',
    Religie: 'Religie',
    Cultura: 'Cultură',
    International: 'Internațional'
  };
  const CATEGORY_ORDER = ['Actualitati', 'Vremea', 'Sport', 'Financiar', 'IT', 'Religie', 'Cultura', 'International'];

  // 'Vremea' nu e o categorie legata de o sursa anume - e un filtru dupa cuvinte
  // cheie in titlu, aplicat peste sursele de Actualitati generale (nu Sport,
  // Religie, Financiar, IT sau Cultura - acolo vremea n-are ce cauta).
  // Ca sa evitam fals-pozitive (ex. "vreme" insemnand si "timp", "furtuna"
  // folosit metaforic despre scandaluri), cerem fie un semnal PUTERNIC de unul
  // singur (ANM, cod rosu/portocaliu/galben, "fenomene meteo", viscol, canicula),
  // fie cel putin DOUA semnale slabe impreuna (ploi, temperaturi, frig, etc.).
  // Potrivirea ignora diacriticele: multe site-uri scriu inca "ş/ţ" cu sedila, altele
  // "ș/ț" cu virgula, altele deloc - toate devin aici aceleasi litere simple.
  function normalizeForMatch(str) {
    return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function normalizedKeywords(list) {
    return [...new Set(list.map(normalizeForMatch))];
  }
  const WEATHER_STRONG = normalizedKeywords([
    'anm', 'cod rosu', 'cod portocaliu', 'cod galben',
    'prognoza meteo', 'fenomene meteo', 'alerta meteo', 'avertizare meteo',
    'viscol', 'canicul', 'ninsoare', 'ninsori', 'meteorolog',
    'val de caldura', 'val de frig'
  ]);
  // Fiecare cuvant slab e distinct ("vremea" nu mai numara dublu, fiind inclus in "vreme").
  const WEATHER_WEAK = normalizedKeywords([
    'ploi', 'ploaie', 'vreme', 'temperatur', 'grade',
    'racoare', 'frig', 'caldura', 'meteo',
    'seceta', 'inundat', 'grindin', 'polei',
    'zapada', 'inghet', 'prognoz', 'furtun', 'vijelie'
  ]);
  // Cuvintele foarte scurte (ex. "anm") se cauta doar ca vorba intreaga.
  const shortKeywordRe = new Map();
  function containsKeyword(text, keyword) {
    if (keyword.length <= 3) {
      let re = shortKeywordRe.get(keyword);
      if (!re) { re = new RegExp(`\\b${keyword}\\b`); shortKeywordRe.set(keyword, re); }
      return re.test(text);
    }
    return text.includes(keyword);
  }
  // Doar sursele romanesti de actualitate: vremea n-are ce cauta la Sport sau IT,
  // iar in titlurile straine abrevieri ca "ANM" ar da potriviri false.
  function isGeneralNewsSource(sourceName) {
    const meta = sourceMeta.find(s => s.name === sourceName);
    return Boolean(meta && meta.category === 'Actualitati' && meta.country === 'RO');
  }
  // Rezultatul se tine minte per articol (la fiecare reincarcare a feed-ului articolele sunt
  // obiecte noi, deci WeakMap-ul se goleste singur).
  const weatherCache = new WeakMap();
  function isWeatherItem(item) {
    const known = weatherCache.get(item);
    if (known !== undefined) return known;
    let result = false;
    if (isGeneralNewsSource(item.source)) {
      const t = normalizeForMatch(item.title);
      result = WEATHER_STRONG.some(k => containsKeyword(t, k))
        || WEATHER_WEAK.filter(k => containsKeyword(t, k)).length >= 2;
    }
    weatherCache.set(item, result);
    return result;
  }
  const mainEl = document.getElementById('main');

  // Masoara inaltimea reala a barei de jos si o pune intr-o variabila CSS (lista, panoul
  // de filtre si panoul "Aa" se aseaza deasupra ei), indiferent de safe-area (notch) sau de
  // cat de mare e fontul ales de utilizator.
  function updateStickyOffsets() {
    const navBarBottom = document.getElementById('navBarBottom');
    if (navBarBottom) {
      document.documentElement.style.setProperty('--navbar-bottom-h', `${navBarBottom.getBoundingClientRect().height}px`);
    }
  }
  window.addEventListener('resize', updateStickyOffsets);
  window.addEventListener('resize', () => updateNarrowMeasure());
  window.addEventListener('orientationchange', updateStickyOffsets);
  window.addEventListener('load', updateStickyOffsets); // fonturile Google incarcate cu putin timp in urma pot schimba usor inaltimile

  // ---- Utilitare culoare pe sursă ----
  const TAG_PALETTE = ['#2C5F63', '#8B3E32', '#6B5B95', '#4C6E3C', '#8A6D1F', '#3D5A80'];
  function colorForSource(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return TAG_PALETTE[hash % TAG_PALETTE.length];
  }

  // O sursa poate raporta o data din viitor (eroare/programare editoriala, ex.
  // Ziarul Lumina foloseste data editiei tiparite de duminica pentru tot ce
  // publica online in cursul saptamanii). Nu avem cum sa aflam ora reala de
  // publicare in cazul asta, asa ca preferam sa n-o afisam deloc, in loc sa
  // aratam o ora gresita.
  function isFutureDate(dateStr) {
    const parsed = new Date(dateStr).getTime();
    return !isNaN(parsed) && parsed > Date.now();
  }

  function formatRelativeTime(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    const diffMs = Date.now() - date.getTime();
    const diffMin = Math.max(0, Math.round(diffMs / 60000)); // o data din viitor (surse cu erori) devine "chiar acum"
    if (diffMin < 1) return 'chiar acum';
    if (diffMin < 60) return `acum ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `acum ${diffH} h`;
    const diffD = Math.round(diffH / 24);
    return `acum ${diffD} zile`;
  }

  // Timpul folosit la SORTARE: o data din viitor (eroare de sursa) e adusa la "acum",
  // ca sa nu ramana fixata permanent in capul listei, inaintea stirilor reale mai proaspete.
  function effectiveTimestamp(dateStr) {
    const parsed = new Date(dateStr).getTime();
    if (isNaN(parsed)) return 0;
    return Math.min(parsed, Date.now());
  }

  const DATE_LOCALES = { ro: 'ro-RO', fr: 'fr-FR', en: 'en-GB', de: 'de-DE' };
  function formatFullDate(dateStr, lang = 'ro') {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    return date.toLocaleString(DATE_LOCALES[lang] || 'ro-RO', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  // Escapeaza si ghilimelele (varianta veche nu o facea), ca textul sa fie sigur
  // si in interiorul atributelor HTML.
  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function isHttpLink(url) {
    try { const u = new URL(url); return u.protocol === 'https:' || u.protocol === 'http:'; } catch { return false; }
  }
  // Linkurile vin din feed-uri externe: acceptam doar http(s), niciodata "javascript:" etc.
  function safeHref(url) {
    return isHttpLink(url) ? escapeHtml(new URL(url).href) : '#';
  }

  // ---- Sursele "efective" (cele bifate in setari) ----
  function discoveredSourceNames() {
    return sourceMeta.map(s => s.name);
  }
  function effectiveSources() {
    const discovered = discoveredSourceNames();
    return settings.selectedSources ? settings.selectedSources.filter(s => discovered.includes(s)) : discovered;
  }
  // Sursele (cu metadate), bifate in setari, care apartin unei anumite categorii.
  // 'International' = orice sursa cu country !== 'RO', DAR nu si cele deja
  // incadrate la IT/Tech (acelea apar doar acolo, ca sa nu se duplice).
  // 'IT' e singura categorie care accepta si surse internationale (ex. XDA
  // Developers), pentru ca subiectul conteaza mai mult decat tara aici.
  function sourcesInCategory(category, ignoreSelection = false) {
    if (category === 'Vremea') return []; // nu e legata de surse, e un filtru pe continut
    const active = new Set(ignoreSelection ? discoveredSourceNames() : effectiveSources());
    return sourceMeta.filter(s => {
      if (!active.has(s.name)) return false;
      if (category === 'International') return s.country !== 'RO' && s.category !== 'IT';
      if (category === 'IT') return s.category === 'IT';
      return s.category === category && s.country === 'RO';
    });
  }
  // Reuniunea surselor din toate categoriile active (pentru randul secundar de chip-uri)
  function sourcesInActiveCategories() {
    const seen = new Map();
    activeCategories.forEach(cat => {
      sourcesInCategory(cat).forEach(s => seen.set(s.name, s));
    });
    return Array.from(seen.values());
  }
  // keepLink: un articol care ramane in lista chiar daca e citit (cel deschis acum), ca
  // "Articolul urmator" sa-si gaseasca pozitia si cu "ascunde citite" pornit.
  function poolItems({ keepLink = null } = {}) {
    return settings.dedupe ? dedupedPool({ keepLink }) : basePool({ keepLink });
  }
  // allSources = true: toate sursele categoriilor active (si cele debifate in Setari sau
  // neselectate in panou) - folosit doar de modul "Fara dubluri".
  // skipRead = true: nu ascunde articolele citite (modul "Fara dubluri" o face pe grup).
  function basePool({ allSources = false, skipRead = false, keepLink = null, skipSearch = false } = {}) {
    const names = new Set(allSources ? discoveredSourceNames() : effectiveSources());
    let items = allItems.filter(i => names.has(i.source));

    if (activeCategories.size > 0) {
      const structuralCats = Array.from(activeCategories).filter(c => c !== 'Vremea');
      const wantsWeather = activeCategories.has('Vremea');

      let combined = [];
      if (structuralCats.length > 0) {
        const namesInCats = new Set();
        structuralCats.forEach(cat => sourcesInCategory(cat, allSources).forEach(s => namesInCats.add(s.name)));
        combined = combined.concat(items.filter(i => namesInCats.has(i.source)));
      }
      if (wantsWeather) {
        combined = combined.concat(items.filter(isWeatherItem));
      }
      const seenLinks = new Set();
      items = combined.filter(i => {
        if (seenLinks.has(i.link)) return false;
        seenLinks.add(i.link);
        return true;
      });
    }

    if (activeSources.size > 0 && !allSources) {
      // Aplicam doar sursele din activeSources care apartin categoriilor curent
      // active (sau, daca nu e nicio categorie activa, orice sursa efectiva).
      // Restul raman memorate in activeSources, fara efect acum, dar gata sa
      // redevina relevante daca utilizatorul reselecteaza categoria potrivita.
      const validScope = activeCategories.size > 0
        ? new Set(sourcesInActiveCategories().map(s => s.name))
        : names;
      const effectiveNarrow = new Set(Array.from(activeSources).filter(n => validScope.has(n)));
      if (effectiveNarrow.size > 0) {
        items = items.filter(i => effectiveNarrow.has(i.source));
      }
    }
    if (searchQuery && !skipSearch) {
      items = items.filter(i => i.title.toLowerCase().includes(searchQuery));
    }
    if (settings.hideRead && !skipRead) {
      items = items.filter(i => !readLinks.has(i.link) || i.link === keepLink);
    }
    return items;
  }

  // ---- "Fara dubluri": aceeasi stire din mai multe surse apare o singura data ----
  // Doua titluri sunt considerate aceeasi stire daca, in aceeasi limba si in cel mult
  // 36 de ore unul de altul, au in comun cel putin doua cuvinte importante, cu o pondere
  // suficienta. Cuvintele foarte frecvente in lista (ex. "Bucuresti", "Guvernul") conteaza
  // mai putin decat cele rare (ex. un nume propriu). Cuvintele de legatura se ignora, iar
  // cuvintele lungi se compara dupa primele 5 litere (romanilor / Romania -> "roman").
  // Cand ezita, algoritmul prefera sa lase articolele separate.
  const DEDUPE_WINDOW_MS = 36 * 60 * 60 * 1000;
  const DEDUPE_MIN_SCORE = 0.42;
  const DEDUPE_STOPWORDS = new Set(`
    a ai al ale alt alta altele am ar are as asa asta astazi au avea azi ca cand care cat ce cea cei cel cele celor cine cu cum da daca dar de deci decat despre din dintr dintre doar dupa e ea ei el ele era este eu fara fi fie fiind fost iar ii il in inca insa intr intre isi la le li lor lui mai mare mi mult multe ne nici noi nou noua nu o ori pe pentru prin sa sau se si sunt sus ta tot toti toate tu un una unei unor unui va vor zi zile ani an acum acesta aceasta acest aceste acestei acestui acestor iata vezi video foto live update breaking ultima ora oficial afla lucru
    the of and for with from that this have has are was were will into after over about than what when who why how its his her their they them you your our not but new says said say amid more most also just been being onto upon off out up down very
    le la les des un une du de et en au aux pour par sur dans avec sans sous est sont qui que quoi dont ou mais pas plus ce cette ces son sa ses leur leurs il elle ils elles nous vous apres avant selon entre contre comme tout tous toute toutes fait faire dit encore deja
    der die das den dem des ein eine einer eines einem und oder aber mit von vom zu zum zur im in an am auf aus bei nach fur uber unter vor ist sind war wird werden hat haben nicht auch noch wie was wer sich als so nur schon jetzt neue neuer neues
  `.trim().split(/\s+/));

  function dedupeTokens(title) {
    const norm = normalizeForMatch(title).replace(/[^a-z0-9]+/g, ' ');
    const out = new Set();
    for (const w of norm.split(' ')) {
      if (!w) continue;
      if (/^\d+$/.test(w)) { if (w.length >= 2) out.add(w); continue; } // ani, sume, scoruri
      if (w.length < 3 || DEDUPE_STOPWORDS.has(w)) continue;
      out.add(w.length > 5 ? w.slice(0, 5) : w);
    }
    return out;
  }

  // items: articole; returneaza grupuri de indici (fiecare grup = o stire)
  function clusterStories(items) {
    const langBySource = new Map(sourceMeta.map(s => [s.name, s.lang || 'ro']));
    const lang = items.map(i => langBySource.get(i.source) || 'ro');
    const time = items.map(i => effectiveTimestamp(i.date));
    const toks = items.map(i => dedupeTokens(i.title));
    const df = new Map();
    toks.forEach(set => set.forEach(t => df.set(t, (df.get(t) || 0) + 1)));
    const N = Math.max(items.length, 1);
    const idf = t => Math.log(1 + N / (df.get(t) || 1));
    const weight = toks.map(set => { let w = 0; set.forEach(t => { w += idf(t); }); return w; });
    const score = (a, b) => {
      const [small, big] = toks[a].size <= toks[b].size ? [toks[a], toks[b]] : [toks[b], toks[a]];
      let shared = 0, w = 0;
      small.forEach(t => { if (big.has(t)) { shared++; w += idf(t); } });
      return shared < 2 ? 0 : w / Math.min(weight[a], weight[b]);
    };
    const order = items.map((_, i) => i).sort((x, y) => time[y] - time[x]);
    const clusters = [];
    const byToken = new Map(); // cuvant -> grupurile care il contin
    for (const i of order) {
      let best = null, bestScore = 0;
      const candidates = new Set();
      toks[i].forEach(t => (byToken.get(t) || []).forEach(c => candidates.add(c)));
      // in ordinea crearii grupurilor, ca la egalitate de scor sa castige acelasi grup ca inainte
      for (const c of [...candidates].sort((x, y) => x.idx - y.idx)) {
        if (c.lang !== lang[i]) continue;
        if (time[i] && c.newest && c.newest - time[i] > DEDUPE_WINDOW_MS) continue;
        for (const m of c.members) {
          const sc = score(i, m);
          if (sc > bestScore) { bestScore = sc; best = c; }
        }
      }
      let target = best;
      if (best && bestScore >= DEDUPE_MIN_SCORE) best.members.push(i);
      else { target = { members: [i], lang: lang[i], newest: time[i], idx: clusters.length }; clusters.push(target); }
      toks[i].forEach(t => {
        const list = byToken.get(t);
        if (!list) byToken.set(t, [target]);
        else if (list[list.length - 1] !== target && !list.includes(target)) list.push(target);
      });
    }
    return clusters.map(c => c.members);
  }

  // Celelalte articole despre aceeasi stire, dupa linkul articolului afisat.
  let dupesByLink = new Map();
  let dedupeCache = { key: null, groups: null };

  function dedupedPool({ keepLink = null } = {}) {
    // Gruparea se face pe lista FARA cautare: ramane aceeasi cat timp tastezi (si nu
    // se schimba de la o litera la alta); cautarea filtreaza apoi grupurile.
    const preferred = basePool({ skipRead: true, skipSearch: true });          // sursele bifate
    const preferredLinks = new Set(preferred.map(i => i.link));
    const wide = basePool({ allSources: true, skipRead: true, skipSearch: true }); // toate sursele categoriilor
    const key = wide.length + '|' + wide.map(i => i.link).join('\n');
    if (dedupeCache.key !== key) dedupeCache = { key, groups: clusterStories(wide) };

    const orderedNames = applyCustomOrder(sourceMeta, settings.sourceOrder, s => s.name).map(s => s.name);
    const rank = name => { const r = orderedNames.indexOf(name); return r === -1 ? Infinity : r; };
    dupesByLink = new Map();
    const reps = [];
    const matches = i => !searchQuery || i.title.toLowerCase().includes(searchQuery);
    dedupeCache.groups.forEach(idxs => {
      const all = idxs.map(i => wide[i]);
      // Cu o cautare activa: grupul apare daca macar un titlu se potriveste, iar
      // reprezentantul se alege dintre titlurile care se potrivesc.
      if (searchQuery && !all.some(matches)) return;
      // Reprezentantul: intai sursele bifate, in ordinea ta din Setari; apoi celelalte.
      const members = all.sort((a, b) =>
        (matches(a) ? 0 : 1) - (matches(b) ? 0 : 1) ||
        (preferredLinks.has(a.link) ? 0 : 1) - (preferredLinks.has(b.link) ? 0 : 1)
        || rank(a.source) - rank(b.source)
        || effectiveTimestamp(b.date) - effectiveTimestamp(a.date));
      // O stire deja citita (din oricare sursa) se ascunde in intregime, daca ai ales asta.
      if (settings.hideRead && members.some(m => readLinks.has(m.link))
        && !members.some(m => m.link === keepLink)) return;
      const [rep, ...others] = members;
      if (others.length) dupesByLink.set(rep.link, others);
      reps.push(rep);
    });
    return reps.sort((a, b) => effectiveTimestamp(b.date) - effectiveTimestamp(a.date));
  }
  function storyIsRead(item) {
    return readLinks.has(item.link) || (dupesByLink.get(item.link) || []).some(d => readLinks.has(d.link));
  }

  // Aplica o ordine aleasa de utilizator (prin drag&drop) peste o lista de
  // elemente; elementele care nu apar in ordinea salvata raman la coada,
  // in ordinea lor naturala.
  function applyCustomOrder(items, orderArray, keyFn) {
    if (!orderArray || orderArray.length === 0) return items;
    const indexOf = id => { const i = orderArray.indexOf(id); return i === -1 ? Infinity : i; };
    return [...items].sort((a, b) => indexOf(keyFn(a)) - indexOf(keyFn(b)));
  }

  // ---- Randare taburi (categorii, selectie multipla) ----
  // Categoriile care au cel putin o sursa activa, in ordinea aleasa in Setari.
  // (Vremea e vizibila cat timp exista surse romanesti de actualitate.)
  function visibleCategories() {
    return applyCustomOrder(
      CATEGORY_ORDER.filter(c => c === 'Vremea' ? sourcesInCategory('Actualitati').length > 0 : sourcesInCategory(c).length > 0),
      settings.categoryOrder,
      c => c
    );
  }


  // ---- Gruparea surselor in panoul de filtre (la Internațional, pe limbi) ----
  // Grupurile de limba sunt denumite in limba respectiva (cine citeste in franceza
  // recunoaste imediat "Français").
  const LANG_LABELS = { fr: 'Français', en: 'English', de: 'Deutsch', ro: 'Română' };
  const INTERNATIONAL_BY_LANG = { ro: 'Internațional', fr: 'International', en: 'International', de: 'International' };
  const LANG_ORDER = ['ro', 'fr', 'en', 'de'];

  function sourcePickerGroups(sources) {
    const cats = visibleCategories().filter(c => activeCategories.has(c) && c !== 'Vremea');
    const groups = [];
    cats.forEach(cat => {
      const inCat = new Set(sourcesInCategory(cat).map(s => s.name));
      const catSources = sources.filter(s => inCat.has(s.name));
      if (catSources.length === 0) return;
      if (cat === 'International') {
        const langs = [...new Set(catSources.map(s => s.lang || 'ro'))]
          .sort((a, b) => (LANG_ORDER.indexOf(a) + 1 || 99) - (LANG_ORDER.indexOf(b) + 1 || 99));
        langs.forEach(l => groups.push({
          label: `${INTERNATIONAL_BY_LANG[l] || CATEGORY_LABELS[cat]} · ${LANG_LABELS[l] || l}`,
          sources: catSources.filter(s => (s.lang || 'ro') === l)
        }));
      } else {
        groups.push({ label: CATEGORY_LABELS[cat] || cat, sources: catSources });
      }
    });
    return groups;
  }

  // ---- Panoul de filtre: categorii + surse, deschis din bara de jos sau de sus ----
  // Exista UN SINGUR panou (#filterSheet), pozitionat fie jos, fie sus: doua panouri
  // deschise deodata sunt imposibile prin constructie. Cu panoul deschis, oricare dintre
  // butoanele de filtre il inchide.
  let filterSheetSide = null; // null = inchis | 'top' | 'bottom'
  const filterSheetEl = document.getElementById('filterSheet');

  function scopeSources() {
    return activeCategories.size === 0
      ? []
      : applyCustomOrder(sourcesInActiveCategories(), settings.sourceOrder, s => s.name);
  }

  function sourceSelectionInfo(sources) {
    const selected = sources.filter(s => activeSources.has(s.name)).map(s => s.name);
    const groups = sourcePickerGroups(sources);
    // grupul selectat integral si exclusiv (ex. doar sursele in franceza)
    const exactGroup = selected.length > 1 && groups.find(g =>
      g.sources.length === selected.length && g.sources.every(s => activeSources.has(s.name)));
    return { selected, groups, exactGroup };
  }

  // Dupa orice schimbare de categorii/surse: eticheta butoanelor de filtre si panoul (daca e deschis).
  function refreshFilterUi() {
    updateFilterButtons();
    if (filterSheetSide || isWide) renderFilterSheet();
  }

  // Eticheta butoanelor din bare: categoria aleasa + eventual sursele restranse
  function updateFilterButtons() {
    const cats = visibleCategories().filter(c => activeCategories.has(c)).map(c => CATEGORY_LABELS[c] || c);
    let label = cats.length === 0 ? 'Toate' : cats.length === 1 ? cats[0] : `${cats[0]} +${cats.length - 1}`;
    const selected = scopeSources().filter(s => activeSources.has(s.name));
    if (selected.length === 1) label += ` · ${selected[0].name}`;
    else if (selected.length > 1) label += ` · ${selected.length} surse`;
    if (settings.dedupe) label += ' · fără dubluri';
    [['filterBtnBottom', 'bottom']].forEach(([id, side]) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.querySelector('.fb-label').textContent = label;
      btn.setAttribute('aria-expanded', String(filterSheetSide === side));
    });
  }

  // Continutul panoului (categorii, comutatoare, surse, salvare offline) se poate desena in
  // panoul care se deschide din bara de jos SI, pe ecrane late, in coloana din stanga.
  function renderFilterSheet() {
    if (filterSheetSide) renderFilterContent(filterSheetEl);
    if (isWide) renderFilterContent(document.getElementById('sideFilters'));
  }
  function renderFilterContent(el) {
    const inSheet = el === filterSheetEl;
    const keepScroll = el.scrollTop;
    el.innerHTML = '';
    // Liniuta de prindere: arata ca panoul se inchide glisandu-l (jos pentru cel de jos,
    // sus pentru cel de sus). Fara buton "Gata": glisare sau atingere in afara panoului.
    const grabber = document.createElement('div');
    grabber.className = 'sheet-grabber';
    grabber.setAttribute('aria-hidden', 'true');
    if (inSheet && filterSheetSide !== 'top') el.appendChild(grabber);

    // Categorii: atingerea schimba categoria si inchide panoul (o singura atingere).
    // Cu "Mai multe deodată" pornit, categoriile se adauga/scot si panoul ramane deschis.
    const row = document.createElement('div');
    row.className = 'sheet-row';
    row.innerHTML = `<p class="sheet-section-label">Categorii</p>`;
    el.appendChild(row);

    const catChips = document.createElement('div');
    catChips.className = 'panel-chips';
    const applyCategories = (next, close) => {
      activeCategories = next;
      saveActiveFilters();
      refreshFilterUi();
      renderList();
      if (close) closeFilterSheet();
    };
    if (!settings.combineCategories) {
      const all = document.createElement('button');
      all.type = 'button';
      all.className = 'tab';
      all.textContent = 'Toate';
      all.setAttribute('aria-pressed', String(activeCategories.size === 0));
      all.addEventListener('click', () => applyCategories(new Set(), true));
      catChips.appendChild(all);
    }
    visibleCategories().forEach(cat => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'tab';
      chip.textContent = CATEGORY_LABELS[cat] || cat;
      chip.setAttribute('aria-pressed', String(activeCategories.has(cat)));
      chip.addEventListener('click', () => {
        if (settings.combineCategories) {
          const next = new Set(activeCategories);
          if (next.has(cat)) next.delete(cat); else next.add(cat);
          applyCategories(next, false);
        } else {
          applyCategories(new Set([cat]), true);
        }
      });
      catChips.appendChild(chip);
    });
    el.appendChild(catChips);

    // Doua comutatoare, cu titlu si o explicatie scurta: starea se vede din pozitia lor.
    const addSwitch = (cls, title, sub, checked, onToggle) => {
      const wrap = document.createElement('div');
      wrap.className = 'switch-row';
      const id = 'sw-' + cls + (inSheet ? '' : '-side');
      wrap.innerHTML = `<span class="switch-text"><span class="switch-title" id="${id}">${title}</span><span class="switch-sub">${sub}</span></span>
        <button type="button" class="switch ${cls}" role="switch" aria-checked="${checked}" aria-labelledby="${id}"></button>`;
      wrap.addEventListener('click', onToggle);
      el.appendChild(wrap);
    };
    addSwitch('combine-toggle', 'Mai multe categorii deodată',
      'Atingi categoriile pe rând și le vezi împreună.', settings.combineCategories, () => {
        settings.combineCategories = !settings.combineCategories;
        saveSettings(settings);
        renderFilterSheet();
      });
    // Fara dubluri: aceeasi stire din mai multe surse apare o singura data.
    addSwitch('dedupe-toggle', 'Ascunde știrile repetate',
      settings.dedupe
        ? 'Fiecare știre apare o dată, din sursele bifate mai jos; celelalte variante sunt sub titlu („Și la: …”).'
        : 'O știre publicată de mai multe surse apare o singură dată.', settings.dedupe, () => {
        settings.dedupe = !settings.dedupe;
        saveSettings(settings);
        renderFilterSheet();
        updateFilterButtons();
        renderList();
      });

    // Surse (grupate; la Internațional pe limbi, cu atingere pe titlul de grup)
    const sources = scopeSources();
    if (sources.length > 1) {
      const { groups, exactGroup } = sourceSelectionInfo(sources);
      const srow = document.createElement('div');
      srow.className = 'sheet-row';
      srow.style.marginTop = '1rem';
      srow.innerHTML = `<p class="sheet-section-label">Surse</p>`;
      el.appendChild(srow);
      // "Toate sursele" e apasat cat timp nu ai restrans lista: altfel, fara niciun buton
      // apasat, parea ca nu e aleasa nicio sursa.
      const allRow = document.createElement('div');
      allRow.className = 'panel-chips';
      allRow.style.marginBottom = '0.45rem';
      const allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.className = 'tab';
      allBtn.textContent = 'Toate sursele';
      allBtn.setAttribute('aria-pressed', String(!sources.some(s => activeSources.has(s.name))));
      allBtn.addEventListener('click', () => {
        sources.forEach(s => activeSources.delete(s.name));
        saveActiveFilters();
        refreshFilterUi();
        renderList();
      });
      allRow.appendChild(allBtn);
      el.appendChild(allRow);
      const showLabels = groups.length > 1 || (groups[0] && groups[0].label.includes('·'));
      if (groups.length > 1) {
        const hint = document.createElement('p');
        hint.className = 'panel-hint';
        hint.textContent = 'Atinge un titlu de grup ca să alegi doar sursele lui.';
        el.appendChild(hint);
      }
      groups.forEach(g => {
        if (showLabels) {
          const names = g.sources.map(s => s.name);
          const isOnlyThis = exactGroup === g;
          const lbl = document.createElement('button');
          lbl.type = 'button';
          lbl.className = 'panel-group-label';
          lbl.setAttribute('aria-pressed', String(isOnlyThis));
          lbl.textContent = (isOnlyThis ? '✓ ' : '') + g.label;
          lbl.addEventListener('click', () => {
            sources.forEach(s => activeSources.delete(s.name));
            if (!isOnlyThis) names.forEach(n => activeSources.add(n));
            saveActiveFilters();
            refreshFilterUi();
            renderList();
          });
          el.appendChild(lbl);
        }
        const chips = document.createElement('div');
        chips.className = 'panel-chips';
        g.sources.forEach(s => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'tab';
          chip.textContent = s.name;
          chip.setAttribute('aria-pressed', String(activeSources.has(s.name)));
          chip.addEventListener('click', () => {
            if (activeSources.has(s.name)) activeSources.delete(s.name); else activeSources.add(s.name);
            saveActiveFilters();
            refreshFilterUi();   // panoul ramane deschis: poti alege mai multe surse la rand
            renderList();
          });
          chips.appendChild(chip);
        });
        el.appendChild(chips);
      });
    }

    // Descarcarea pentru offline se aplica exact selectiei de mai sus, deci sta aici.
    const offlineBtn = document.createElement('button');
    offlineBtn.type = 'button';
    offlineBtn.className = 'sheet-offline-btn';
    if (inSheet || !filterSheetSide) offlineBtn.id = 'offlineDownloadBtn';
    offlineBtn.textContent = offlineDownloadLabel || '⬇ Salvează pentru citit fără internet';
    offlineBtn.disabled = offlineDownloadRunning;
    offlineBtn.addEventListener('click', downloadOfflineArticles);
    el.appendChild(offlineBtn);

    if (inSheet && filterSheetSide === 'top') el.appendChild(grabber);
    el.scrollTop = keepScroll;
  }

  let sheetOpener = null;
  function openFilterSheet(side) {
    sheetOpener = document.activeElement;
    filterSheetSide = side;
    filterSheetEl.className = `filter-sheet ${side}`;
    filterSheetEl.hidden = false;
    renderFilterSheet();
    updateFilterButtons();
    // Focusul intra in panou (util la tastatura si cititoare de ecran; pe telefon nu se vede nimic).
    const first = filterSheetEl.querySelector('button[aria-pressed="true"]') || filterSheetEl.querySelector('button');
    if (first) first.focus({ preventScroll: true });
  }
  function closeFilterSheet() {
    if (!filterSheetSide) return;
    const focusWasInside = filterSheetEl.contains(document.activeElement) || document.activeElement === document.body;
    filterSheetSide = null;
    filterSheetEl.hidden = true;
    updateFilterButtons();
    if (focusWasInside && sheetOpener && sheetOpener.isConnected && sheetOpener.focus) sheetOpener.focus({ preventScroll: true });
  }
  // Cu panoul deschis, oricare buton il inchide (nu il muta): nu pot exista doua deodata.
  function toggleFilterSheet(side) {
    if (filterSheetSide) closeFilterSheet(); else openFilterSheet(side);
  }
  // Glisare: panoul de jos se inchide tras in jos, cel de sus tras in sus. Daca in panou
  // mai e continut de derulat in acea directie, se deruleaza intai continutul.
  let sheetDrag = null;
  filterSheetEl.addEventListener('touchstart', e => {
    if (!filterSheetSide || e.touches.length !== 1) return;
    sheetDrag = { y0: e.touches[0].clientY, dy: 0, active: false, side: filterSheetSide };
  }, { passive: true });
  filterSheetEl.addEventListener('touchmove', e => {
    if (!sheetDrag) return;
    const dy = e.touches[0].clientY - sheetDrag.y0;
    const el = filterSheetEl;
    const atTop = el.scrollTop <= 0;
    const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
    const towardsClose = sheetDrag.side === 'bottom' ? (dy > 0 && atTop) : (dy < 0 && atBottom);
    if (!sheetDrag.active && !towardsClose) return; // derulare normala in interiorul panoului
    sheetDrag.active = true;
    sheetDrag.dy = dy;
    e.preventDefault();
    const offset = sheetDrag.side === 'bottom' ? Math.max(0, dy) : Math.min(0, dy);
    el.style.transform = `translate(-50%, ${offset}px)`;
  }, { passive: false });
  const endSheetDrag = () => {
    if (!sheetDrag) return;
    const { active, dy, side } = sheetDrag;
    sheetDrag = null;
    filterSheetEl.style.transform = '';
    if (active && Math.abs(dy) > 60 && (side === 'bottom' ? dy > 0 : dy < 0)) closeFilterSheet();
  };
  filterSheetEl.addEventListener('touchend', endSheetDrag);
  filterSheetEl.addEventListener('touchcancel', endSheetDrag);


  document.getElementById('filterBtnBottom').addEventListener('click', () => toggleFilterSheet('bottom'));

  // Atingere in afara panoului: il inchide, iar actiunea atinsa (ex. un articol) se executa
  // normal. composedPath() e calculat la momentul evenimentului, deci merge si cand panoul
  // tocmai s-a redesenat.
  document.addEventListener('click', e => {
    if (!filterSheetSide) return;
    const path = e.composedPath();
    const inside = [filterSheetEl, document.getElementById('filterBtnBottom')]
      .some(el => path.includes(el));
    if (!inside) closeFilterSheet();
  });
  // ---- Taste rapide (PC): / caută, j/k urmatorul/anteriorul, f favorit, Esc inchide ----
  function currentReadingItem() {
    if (isWide) return readerItem;
    return currentView === 'article' ? currentArticleItem : null;
  }
  function stepArticle(dir) {
    const list = poolItems();
    if (!list.length) return;
    const cur = currentReadingItem();
    let idx = cur ? list.findIndex(i => i.link === cur.link
      || (dupesByLink.get(i.link) || []).some(d => d.link === cur.link)) : -1;
    const next = idx === -1 ? (dir > 0 ? list[0] : null) : list[idx + dir];
    if (!next) return;
    if (isWide || currentView === 'list') navigateToArticle(next);
    else navigateToArticle(next, history.state && history.state.from);
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const pop = document.getElementById('aaPopover');
      if (filterSheetSide) { closeFilterSheet(); return; }
      if (pop && !pop.hidden) { closeAaPopover(); return; }
      if (document.activeElement && document.activeElement.id === 'searchInput') { document.activeElement.blur(); return; }
      if (isWide && readerItem) { closeReaderPane(); return; }
      if (currentView !== 'list') goBackInApp();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
    if (e.key === '/') {
      e.preventDefault();
      const bar = document.getElementById('searchBar');
      if (currentView !== 'list' || !bar.classList.contains('visible')) document.getElementById('searchBtn').click();
      else document.getElementById('searchInput').focus();
    } else if (e.key === 'j') {
      stepArticle(1);
    } else if (e.key === 'k') {
      stepArticle(-1);
    } else if (e.key === 'f') {
      const container = isWide ? document.getElementById('readerPane') : mainEl;
      const star = currentReadingItem() && container.querySelector('#favStarReading');
      if (star) star.click();
    }
  });

  // ---- Randare listă ----
  // Ora afisata langa sursa. Datele estimate (Ziarul Lumina cu data editiei tiparite,
  // Historia fara data) sunt marcate cu "≈" - reprezinta momentul in care Worker-ul
  // a vazut prima oara articolul, nu ora oficiala.
  function relTimeText(item) {
    return (item.dateEstimated ? '≈ ' : '') + formatRelativeTime(item.date);
  }

  function buildListItem(item) {
    const li = document.createElement('li');
    li.className = 'item' + (isWide && readerItem && readerItem.link === item.link ? ' is-open' : '');
    li.dataset.link = item.link;
    const itemLang = langOf(item);
    if (itemLang !== 'ro') li.lang = itemLang;

    const btn = document.createElement('button');
    btn.className = 'item-btn';

    if (item.image) {
      const img = document.createElement('img');
      img.className = 'item-thumb';
      img.src = `${WORKER_URL}?image=${encodeURIComponent(item.image)}`;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', () => img.remove());
      btn.appendChild(img);
    }

    const textWrap = document.createElement('div');
    textWrap.className = 'item-text';

    const title = document.createElement('p');
    title.className = 'item-title' + ((settings.dedupe ? storyIsRead(item) : readLinks.has(item.link)) ? ' is-read' : '');
    title.textContent = item.title;

    const meta = document.createElement('div');
    meta.className = 'item-meta';
    const sourceTag = `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span>`;
    meta.innerHTML = isFutureDate(item.date)
      ? sourceTag
      : `${sourceTag}<span>·</span><span class="rel-time" data-date="${escapeHtml(item.date)}" data-est="${item.dateEstimated ? 1 : 0}">${escapeHtml(relTimeText(item))}</span>`;

    textWrap.appendChild(title);
    textWrap.appendChild(meta);
    btn.appendChild(textWrap);
    btn.addEventListener('click', () => navigateToArticle(item));

    const star = document.createElement('button');
    star.className = 'fav-star' + (isFavorite(item.link) ? ' active' : '');
    star.setAttribute('aria-label', 'Favorit');
    star.setAttribute('aria-pressed', String(isFavorite(item.link)));
    star.textContent = isFavorite(item.link) ? '★' : '☆';
    star.addEventListener('click', () => {
      toggleFavorite(item);
      star.classList.toggle('active');
      star.textContent = isFavorite(item.link) ? '★' : '☆';
      star.setAttribute('aria-pressed', String(isFavorite(item.link)));
    });

    li.appendChild(btn);
    li.appendChild(star);

    const dupes = settings.dedupe ? (dupesByLink.get(item.link) || []) : [];
    if (dupes.length) {
      const names = [...new Set(dupes.map(d => d.source).filter(n => n !== item.source))];
      const shown = names.slice(0, 2).join(', ');
      const more = names.length > 2 ? ` +${names.length - 2}` : '';
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'dupe-toggle';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.innerHTML = `<span class="dupe-arrow">›</span> ${names.length
        ? `Și la: ${escapeHtml(shown)}${more}`
        : `Încă ${dupes.length} ${dupes.length === 1 ? 'articol' : 'articole'} din aceeași sursă`}`;
      let listEl = null;
      toggle.addEventListener('click', () => {
        if (listEl) { listEl.remove(); listEl = null; toggle.setAttribute('aria-expanded', 'false'); return; }
        listEl = document.createElement('ul');
        listEl.className = 'dupe-list';
        dupes.forEach(d => {
          const dli = document.createElement('li');
          const b = document.createElement('button');
          b.type = 'button';
          b.innerHTML = `<span class="${readLinks.has(d.link) ? 'is-read' : ''}">${escapeHtml(d.title)}</span>
            <span class="dupe-meta"><span class="source-tag" style="color:${colorForSource(d.source)}">${escapeHtml(d.source)}</span>${isFutureDate(d.date) ? '' : ` · ${escapeHtml(relTimeText(d))}`}</span>`;
          b.addEventListener('click', () => navigateToArticle(d));
          dli.appendChild(b);
          listEl.appendChild(dli);
        });
        li.appendChild(listEl);
        toggle.setAttribute('aria-expanded', 'true');
      });
      li.appendChild(toggle);
    }
    return li;
  }

  // Lista se construieste in transe de cate 50: prima transa imediat, urmatoarele
  // pe masura ce derulezi spre final. Inainte se construiau toate (sute) la fiecare
  // schimbare de tab, ceea ce se simtea pe telefoanele mai slabe.
  const LIST_PAGE_SIZE = 50;
  let listObserver = null;

  // Pozitia din lista, retinuta cand pleci spre un articol, Setari sau Favorite,
  // ca "inapoi" sa te readuca exact unde erai (inainte: lista sarea la inceput).
  let listReturnState = null;
  function rememberListPosition() {
    if (currentView === 'list') {
      listReturnState = { y: window.scrollY, count: mainEl.querySelectorAll('li.item').length };
    }
  }

  function renderList(options = {}) {
    // Daca lista apare din alta pagina (ex. un tab apasat din Setari, Ajutor sau Favorite),
    // inlocuim intrarea curenta din istoric cu lista. Altfel, "inapoi" dintr-un articol
    // deschis ulterior ar fi dus la pagina de dinainte, nu la titluri.
    if (history.state && history.state.view && history.state.view !== 'list') {
      history.replaceState({ view: 'list' }, '');
    }
    currentView = 'list';
    const filtered = poolItems();
    const heading = document.getElementById('listHeading');
    if (heading) {
      const label = document.querySelector('#filterBtnBottom .fb-label');
      heading.textContent = `${label && label.textContent ? label.textContent : 'Știri'} · ${filtered.length} ${filtered.length === 1 ? 'știre' : 'știri'}`;
    }

    if (listObserver) { listObserver.disconnect(); listObserver = null; }
    mainEl.innerHTML = '';

    if (filtered.length === 0) {
      const state = document.createElement('div');
      state.className = 'state';
      const onlyWeather = activeCategories.size === 1 && activeCategories.has('Vremea');
      state.textContent = onlyWeather
        ? 'Nicio știre despre vreme în acest moment. Secțiunea se completează singură când sursele publică prognoze sau avertizări meteo.'
        : settings.hideRead
          ? 'Nicio știre necitită de afișat momentan.'
          : 'Nicio știre de afișat momentan.';
      mainEl.appendChild(state);
      updateNavButtons();
      if (!options.keepScroll) window.scrollTo(0, 0);
      return;
    }

    maybeAddWelcomeCard();
    const ul = document.createElement('ul');
    ul.className = 'list';
    const sentinel = document.createElement('div');
    sentinel.className = 'list-sentinel';
    mainEl.appendChild(ul);
    mainEl.appendChild(sentinel);

    let rendered = 0;
    function renderMore() {
      const next = filtered.slice(rendered, rendered + LIST_PAGE_SIZE);
      const fragment = document.createDocumentFragment();
      next.forEach(item => fragment.appendChild(buildListItem(item)));
      ul.appendChild(fragment);
      rendered += next.length;
      if (rendered >= filtered.length) {
        if (listObserver) { listObserver.disconnect(); listObserver = null; }
        sentinel.remove();
      }
    }
    renderMore();
    // La revenire, desenam cel putin cate articole erau vizibile inainte, ca pozitia sa existe.
    if (options.restore) {
      while (rendered < options.restore.count && rendered < filtered.length) renderMore();
    }

    if (rendered < filtered.length) {
      if ('IntersectionObserver' in window) {
        listObserver = new IntersectionObserver(entries => {
          if (entries.some(e => e.isIntersecting)) renderMore();
        }, { rootMargin: '800px' });
        listObserver.observe(sentinel);
      } else {
        while (rendered < filtered.length) renderMore();
      }
    }

    updateNavButtons();
    if (options.restore) window.scrollTo(0, options.restore.y);
    else if (!options.keepScroll) window.scrollTo(0, 0);
    if (!options.restore && !options.keepScroll) listReturnState = null;
  }

  // Orele relative ("acum 5 min") se actualizeaza singure, cat timp aplicatia e deschisa.
  setInterval(() => {
    document.querySelectorAll('.rel-time').forEach(el => {
      el.textContent = (el.dataset.est === '1' ? '≈ ' : '') + formatRelativeTime(el.dataset.date);

  // ---- Vizualizare articol ----
  function navigateToArticle(item, fromOverride) {
    if (isWide && currentView !== 'article') {
      openInReader(item, fromOverride || (currentView === 'favorites' ? 'favorites' : 'list'));
      return;
    }
    rememberListPosition();
    const from = fromOverride || (currentView === 'favorites' ? 'favorites' : 'list');
    // Cate articole ai deschis la rand (prin "Articolul urmator"): butonul "Inapoi la
    // titluri" sare peste toate deodata, direct la lista (sau la Favorite).
    const depth = (currentView === 'article' && history.state && history.state.view === 'article')
      ? (history.state.depth || 1) + 1 : 1;
    history.pushState({ view: 'article', item, from, depth }, '');
    renderArticleView(item, from);
  }

  };
  const INCOMPLETE_TEXT_CHARS = 600;

  // Despartire in silabe pentru romana, dupa regulile DOOM. Telefoanele Android nu au
  // dictionar de silabisire pentru romana, deci browserul nu despartea singur. Inseram
  // cratime "invizibile" (U+00AD), afisate doar daca respectivul cuvant ajunge la capat
  // de rand. Reguli aplicate:
  //  - V-CV: ca-să; "ch" si "gh" sunt un singur sunet (ches-tiu-ne)
  //  - VC-CV: ar-tă; dar consoana + l/r trec impreuna: a-cru, ta-blă (exceptii: tl, dl -> at-las)
  //  - trei consoane: as-pru; exceptiile DOOM lpt, mpt, mpț, nct, ncț, ncș, ndv, rct, rtf, stm: sculp-tor
  //  - patru sau mai multe consoane: dupa a doua (ins-truc-ție, opt-spre-ze-ce)
  //  - hiat: doar perechile care sunt INTOTDEAUNA hiat (po-e-zie, co-or-do-na); "ea", "ia", "io"...
  //    pot fi si diftong, deci nu le despartim niciodata
  //  - la capat de rand: minimum 2 litere ramase pe rand si minimum 2 pe randul nou. O silaba
  //    finala de 2 litere trece pe randul nou doar daca se termina in a, ă, â, e, o (mereu silaba:
  //    ca-să, ma-re, cultu-ră); "i" si "u" finale pot fi nesilabice ("po-mi", "lu-ni", "cu-lori" ar fi
  //    gresite), deci acolo cerem minimum 3 litere; abrevierile (NATO) nu se despart
  //  - cuvintele se despart de la 5 litere in sus (mul-te, toa-te, du-pă)
  // (Franceza, engleza, germana: le desparte browserul, care are dictionare pentru ele.)
  const RO_VOWELS = new Set('aăâeiîouyAĂÂEIÎOUY'.split('')); // y: in nume straine (Hyun-dai)
  const RO_SYLLABIC_FINAL = new Set('aăâeo'.split(''));
  const RO_OBSTRUENTS = new Set('bcdfghptv'.split(''));
  const RO_KEEP_TWO = ['lpt', 'mpt', 'mpț', 'mpţ', 'nct', 'ncț', 'ncţ', 'ncș', 'ncş', 'ndv', 'rct', 'rtf', 'stm'];
  const RO_ALWAYS_HIATUS = ['aa', 'ae', 'ao', 'ee', 'oe', 'oo', 'uu'];
  function hyphenateRoWord(word) {
    if (word === word.toUpperCase()) return word;
    const low = word.toLowerCase();
    const units = [];
    for (let i = 0; i < low.length; i++) {
      if ((low[i] === 'c' || low[i] === 'g') && low[i + 1] === 'h') { units.push({ s: i, e: i + 2, v: false }); i++; }
      else units.push({ s: i, e: i + 1, v: RO_VOWELS.has(low[i]) });
    }
    const vowelIdx = units.map((u, i) => u.v ? i : -1).filter(i => i >= 0);
    let out = '', last = 0;
    for (let k = 0; k + 1 < vowelIdx.length; k++) {
      const a = vowelIdx[k], b = vowelIdx[k + 1], cons = b - a - 1;
      let at = null;
      if (cons === 0) {
        if (RO_ALWAYS_HIATUS.includes(low[units[a].s] + low[units[b].s])) at = b;
      } else if (cons === 1) {
        at = a + 1;
      } else if (cons === 2) {
        const c1 = low.slice(units[a + 1].s, units[a + 1].e), c2 = low[units[a + 2].s];
        const togetherOnNextLine = c1.length === 1 && RO_OBSTRUENTS.has(c1) && (c2 === 'l' || c2 === 'r')
          && !(c2 === 'l' && (c1 === 't' || c1 === 'd'));
        at = togetherOnNextLine ? a + 1 : a + 2;
      } else if (cons === 3) {
        at = RO_KEEP_TWO.includes(low.slice(units[a + 1].s, units[a + 3].e)) ? a + 3 : a + 2;
      } else {
        at = a + 3;
      }
      if (at === null) continue;
      const pos = units[at].s;
      const rest = word.length - pos;
      if (pos < 2 || rest < 2) continue;
      if (rest === 2 && !RO_SYLLABIC_FINAL.has(low[low.length - 1])) continue;
      out += word.slice(last, pos) + '\u00AD';
      last = pos;
    }
    return out + word.slice(last);
  }
  function hyphenateRo(text) {
    return text.replace(/[A-Za-zĂÂÎȘŞȚŢăâîșşțţ]{5,}/g, hyphenateRoWord);
  }

  function langOf(item) {
    const meta = sourceMeta.find(s => s.name === item.source);
    const lang = (meta && meta.lang) || 'ro';
    return READING_STRINGS[lang] ? lang : 'ro';
  }

  function readingHeaderHtml(item, t, inPane = false) {
    return `
      <div class="reading-header">
        <button class="back-btn" id="backBtn">${escapeHtml(t.back)}</button>
        <div class="reading-actions">
          ${inPane ? `<span class="size-buttons"><button class="share-btn" data-size="-1" title="Text mai mic" aria-label="Text mai mic">A−</button><button class="share-btn" data-size="1" title="Text mai mare" aria-label="Text mai mare">A+</button></span>` : ''}
          <button class="share-btn" id="shareBtn" aria-label="${escapeHtml(t.shareLabel)}">${escapeHtml(t.share)}</button>
          <button class="fav-star-reading${isFavorite(item.link) ? ' active' : ''}" id="favStarReading" aria-label="${escapeHtml(t.fav)}" aria-pressed="${isFavorite(item.link)}">${isFavorite(item.link) ? '★' : '☆'}</button>
        </div>
      </div>`;
  }

  // Distribuire prin meniul nativ al telefonului; pe calculator, copiere in clipboard.
  async function shareLink(title, url, button, copiedText = 'Link copiat ✓', text) {
    if (navigator.share) {
      try { await navigator.share(text ? { title, text, url } : { title, url }); } catch {}
      return;
    }
    try {
      await navigator.clipboard.writeText(url);
      if (button) {
        const original = button.textContent;
        button.textContent = copiedText;
        setTimeout(() => { button.textContent = original; }, 2000);
      }
    } catch {
      window.prompt('Copiază linkul:', url);
    }
  }

  function goBackToOrigin() {
    const depth = (history.state && history.state.view === 'article' && history.state.depth) || 1;
    history.go(-depth);
  }

  function wireReadingHeader(item, t, container = mainEl, inPane = false) {
    container.querySelector('#backBtn').addEventListener('click', inPane ? closeReaderPane : goBackToOrigin);
    container.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
      const next = Math.min(6, Math.max(1, Number(settings.fontSize) + Number(b.dataset.size)));
      settings.fontSize = String(next); saveSettings(settings); applyVisualSettings();
    }));
    const shareBtn = container.querySelector('#shareBtn');
    if (isHttpLink(item.link)) {
      shareBtn.addEventListener('click', () => shareLink(item.title, item.link, shareBtn, t.copied));
    } else {
      shareBtn.remove();
    }
    const star = container.querySelector('#favStarReading');
    syncBarFav();
    star.addEventListener('click', () => {
      toggleFavorite(item);
      star.classList.toggle('active');
      star.textContent = isFavorite(item.link) ? '★' : '☆';
      star.setAttribute('aria-pressed', String(isFavorite(item.link)));
      syncBarFav();
    });
  }

  // Fiecare deschidere de articol primeste un numar; raspunsurile intarziate ale unui
  // articol parasit intre timp (Inapoi, Articolul urmator) nu mai deseneaza nimic.
  let articleRenderToken = 0;
  async function renderArticleView(item, from = 'list', inPane = false) {
    const token = ++articleRenderToken;
    const container = inPane ? document.getElementById('readerPane') : mainEl;
    if (!inPane) {
      currentView = 'article';
      currentArticleItem = item;
    }
    try { localStorage.setItem('stiriNestireEngaged', '1'); } catch {}
    if (inPane) container.scrollTop = 0;
    else { updateNavButtons(); window.scrollTo(0, 0); }
    markAsRead(item.link);

    const lang = langOf(item);
    const t = { ...READING_STRINGS[lang] };
    if (from === 'favorites') t.back = t.backFav;
    if (inPane) t.back = t.close;
    const metaBase = `<span class="source-tag" style="color:${colorForSource(item.source)}">${escapeHtml(item.source)}</span>${isFutureDate(item.date) ? '' : ` · ${item.dateEstimated ? t.approx + ' ' : ''}${escapeHtml(formatFullDate(item.date, lang))}`}`;
    const metaHtml = `<p class="reading-meta">${metaBase}</p>`;
    // Timp estimat de citire: ~200 de cuvinte pe minut
    const metaWithTime = text => `<p class="reading-meta">${metaBase} · ${Math.max(1, Math.round(text.split(/\s+/).length / 200))} ${escapeHtml(t.readTime)}</p>`;

    // Urmatorul articol din lista din care ai venit (lista filtrata curenta sau Favorite)
    const sequence = from === 'favorites' ? favorites : poolItems({ keepLink: item.link });
    const position = sequence.findIndex(i => i.link === item.link
      || (from !== 'favorites' && (dupesByLink.get(i.link) || []).some(d => d.link === item.link)));
    const nextItem = position >= 0 ? sequence[position + 1] : null;
    const nextHtml = nextItem
      ? `<button class="next-article" id="nextArticleBtn"><span class="next-label">${escapeHtml(t.next)} →</span><span class="next-title">${escapeHtml(nextItem.title)}</span></button>`
      : '';
    function wireNext() {
      const btn = container.querySelector('#nextArticleBtn');
      if (btn) btn.addEventListener('click', () => navigateToArticle(nextItem, from));
    }
    // Imaginea din lista (deja descarcata, deci instant), mica, in dreapta primului paragraf
    const thumbHtml = item.image
      ? `<img class="reading-thumb" src="${WORKER_URL}?image=${encodeURIComponent(item.image)}" alt="" loading="lazy" onerror="this.remove()">`
      : '';
    const titleHtml = `<h1 class="reading-title">${escapeHtml(item.title)}</h1>`;
    const originalLink = `<a class="reading-source-link" href="${safeHref(item.link)}" target="_blank" rel="noopener">${escapeHtml(t.original)}</a>`;

    function show(inner) {
      if (token !== articleRenderToken) return;
      if (inPane ? readerItem !== item : currentView !== 'article') return;
      container.innerHTML = `<div class="reading" lang="${lang}">${readingHeaderHtml(item, t, inPane)}${inner}</div>`;
      wireReadingHeader(item, t, container, inPane);
    }

    show(`<div class="state">${escapeHtml(t.loading)}</div>`);

    function renderBody(text, notice) {
      const paragraphs = text.split('\n\n').filter(p => p.trim())
        .map(p => `<p>${escapeHtml(lang === 'ro' ? hyphenateRo(p) : p)}</p>`).join('');
      const shortNote = text.length < INCOMPLETE_TEXT_CHARS
        ? `<p class="reading-note">${escapeHtml(t.incomplete)}</p>` : '';
      show(`${metaWithTime(text)}${titleHtml}
        ${notice ? `<p class="offline-status visible" style="margin-bottom:1rem;">${escapeHtml(notice)}</p>` : ''}
        <div class="reading-body">${thumbHtml}${paragraphs}</div>
        ${shortNote}
        ${originalLink}
        ${nextHtml}`);
      wireNext();
      updateNarrowMeasure(container);
    }

    function renderFailure(reason) {
      show(`${metaHtml}${titleHtml}
        <div class="reading-failure">
          <strong>${escapeHtml(t.failTitle)}</strong>
          <p>${escapeHtml(t.reasons[reason] || t.reasons.error)}</p>
          ${originalLink}
        </div>
        ${nextHtml}`);
      wireNext();
    }

    // Motivul vine de la Worker ('blocked', 'empty', 'timeout', 'error'); fara
    // raspuns, diferentiem intre lipsa conexiunii si o eroare de server.
    let data = null;
    let reason = null;
    try {
      const res = await fetch(`${WORKER_URL}?article=${encodeURIComponent(item.link)}`);
      if (res.ok) data = await res.json();
      else reason = 'error';
    } catch {
      reason = navigator.onLine === false ? 'offline' : 'error';
    }

    if (data && data.text) {
      renderBody(data.text);
      offlineSet({ link: item.link, title: item.title, source: item.source, date: item.date, text: data.text, cachedAt: Date.now() });
      return;
    }
    if (data) reason = data.reason && data.reason !== 'ok' ? data.reason : 'empty';

    // Varianta salvata offline, daca exista, e mai buna decat un mesaj de eroare.
    const cached = await offlineGet(item.link);
    if (cached && cached.text) {
      renderBody(cached.text, t.offlineSaved);
      return;
    }
    renderFailure(reason);
  }

  // ---- Navigare inapoi/inainte (buton fizic al telefonului + butoanele proprii) ----
  function goBackInApp() {
    if (currentView === 'list') return; // nu avem unde sa mergem inapoi in aplicatie
    history.back();
  }
  // ---- Progresul lecturii (bara subtire de sus, doar in pagina de articol) ----
  let scrollTicking = false;
  function updateReadingProgress() {
    const fill = document.getElementById('readProgressFill');
    if (!fill) return;
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    fill.style.transform = `scaleX(${ratio})`;
  }
  window.addEventListener('scroll', () => {
    if (scrollTicking || currentView !== 'article') return;
    scrollTicking = true;
    requestAnimationFrame(() => { scrollTicking = false; updateReadingProgress(); });
  }, { passive: true });

  var installLogicReady = false; // devine true dupa ce blocul de instalare (la finalul scriptului) e initializat

  // Apelat la fiecare schimbare de pagina (prin updateNavButtons)
  function onViewChanged() {
    closeAaPopover();
    if (currentView !== 'list') closeFilterSheet();
    if (currentView !== 'list' && listObserver) { listObserver.disconnect(); listObserver = null; }
    document.documentElement.classList.toggle('view-article', currentView === 'article');
    updateReadingProgress();
    if (installLogicReady) {
      if (currentView === 'article') hideInstallBanner(); // nu acoperim textul pe care il citesti
      else maybeShowInstallBanner();
    }
  }

  function updateNavButtons() {
    onViewChanged();
    // Fila paginii curente apare evidentiata (Favorite / Setări)
    [['favoritesBtn', 'favorites'], ['settingsBtn', 'settings']].forEach(([id, view]) => {
      const b = document.getElementById(id);
      if (!b) return;
      if (currentView === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  window.addEventListener('popstate', event => {
    const state = event.state;
    if (state && state.view === 'article' && state.item) {
      if (isWide) { renderList(); openInReader(state.item, state.from || 'list'); return; }
      renderArticleView(state.item, state.from || 'list');
      return;
    }
    if (state && state.view === 'settings') {
      renderSettingsView();
      return;
    }
    if (state && state.view === 'favorites') {
      renderFavoritesView();
      return;
    }
    if (state && state.view === 'help') {
      renderHelpView();
      return;
    }
    const restore = listReturnState;
    listReturnState = null;
    renderList(restore ? { restore } : {});
  });


  // ---- Încărcare inițială ----
  let statusTimer = null;
  function showStatus(text, hideAfterMs) {
    const statusEl = document.getElementById('offlineStatus');
    clearTimeout(statusTimer);
    statusEl.textContent = text;
    statusEl.classList.toggle('visible', Boolean(text));
    if (hideAfterMs) statusTimer = setTimeout(() => statusEl.classList.remove('visible'), hideAfterMs);
  }

  function describeLoadFailure() {
    return navigator.onLine === false
      ? 'Fără conexiune la internet'
      : 'Serverul de știri nu răspunde momentan';
  }

  // mode: 'initial' (la pornire) | 'manual' (butonul ↻) | 'auto' (revenire in aplicatie)
  async function loadFeed({ mode = 'initial' } = {}) {
    if (feedLoading) return;
    feedLoading = true;
    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) refreshBtn.classList.add('spinning');
    const previousLinks = new Set(allItems.map(i => i.link));

    try {
      const res = await fetch(WORKER_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('server');
      const data = await res.json();

      sourceMeta = data.sources || [];
      failedSources = data.failedSources || [];
      allItems = (data.items || [])
        .filter(i => i.title && isHttpLink(i.link))
        .sort((a, b) => effectiveTimestamp(b.date) - effectiveTimestamp(a.date));
      saveLastFeedSnapshot();
      lastFeedLoadAt = Date.now();

      if (mode === 'initial') {
        history.replaceState({ view: 'list' }, '');
        refreshFilterUi();
        renderList();
        updateStickyOffsets();
        return;
      }

      const newCount = allItems.filter(i => !previousLinks.has(i.link)).length;
      const label = newCount > 0 ? `${newCount} ${newCount === 1 ? 'știre nouă' : 'știri noi'}` : 'Lista e la zi';
      refreshFilterUi();
      if (currentView === 'list') {
        // Reimprospatarea automata nu te muta din locul in care citeai; cea manuala te duce sus.
        if (mode === 'manual' || window.scrollY < 200) {
          renderList();
        } else {
          showStatus(`${label} — apasă ↻ ca să le vezi`, 5000);
          return;
        }
      }
      showStatus(label, 3000);
    } catch (err) {
      if (mode !== 'initial') {
        showStatus(`${describeLoadFailure()} — lista rămâne cea de dinainte.`, 4000);
        return;
      }
      // La pornire, fara raspuns: aratam ultima lista salvata local, daca exista.
      const snapshot = loadLastFeedSnapshot();
      if (snapshot && snapshot.items && snapshot.items.length > 0) {
        sourceMeta = snapshot.sources || [];
        allItems = snapshot.items.filter(i => i.title && isHttpLink(i.link));
        history.replaceState({ view: 'list' }, '');
        refreshFilterUi();
        renderList();
        updateStickyOffsets();
        showStatus(`${describeLoadFailure()} — se arată ultima listă salvată.`);
        return;
      }
      mainEl.innerHTML = `
        <div class="state">
          <strong>Nu am putut încărca știrile</strong>
          ${describeLoadFailure()}. Încearcă din nou peste câteva momente.
          <br><button class="retry-btn" id="retryBtn">Încearcă din nou</button>
        </div>`;
      document.getElementById('retryBtn').addEventListener('click', () => loadFeed());
    } finally {
      feedLoading = false;
      if (refreshBtn) refreshBtn.classList.remove('spinning');
    }
  }

  // Revenire in aplicatie dupa mai mult de 5 minute: reimprospatare automata, discreta.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && lastFeedLoadAt && Date.now() - lastFeedLoadAt > 5 * 60 * 1000) {
      loadFeed({ mode: 'auto' });
    }
  });

  // ---- Pornire ----
  applyVisualSettings();
  initHeaderButtons();
  applyLayout();
  loadFeed();
  offlinePrune();

  // ---- Instalare ----
  // - Bannerul apare dupa ce utilizatorul a citit primul articol (sau dupa ~40 de secunde),
  //   cand a inteles ce face aplicatia - nu din prima secunda. Nu apare peste un articol.
  // - In browserele interne (Facebook, Messenger, Instagram, TikTok...) instalarea nu e
  //   posibila: aratam imediat cum sa deschida pagina in Chrome/Safari.
  // - Inchis cu ✕: revine discret dupa 14 zile. Din Setari si Ajutor se poate instala oricand.
  const INSTALL_DISMISSED_KEY = 'stiriNestireInstallDismissed'; // momentul ultimei inchideri
  const INSTALLED_KEY = 'stiriNestireInstalled';
  const ENGAGED_KEY = 'stiriNestireEngaged';
  const INSTALL_SNOOZE_MS = 14 * 24 * 60 * 60 * 1000;
  const APP_SHARE_TEXT = 'Știri din peste 35 de surse, românești și internaționale. Fără cont, fără reclame.';
  const IOS_SHARE_ICON = '<svg class="install-share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
  let deferredInstallPrompt = null;

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOS() {
    // iPad-urile noi se prezinta drept Mac; le recunoastem dupa ecranul tactil
    return /iphone|ipad|ipod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function isAndroid() { return /android/i.test(navigator.userAgent); }
  function isInAppBrowser() {
    return /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line\/|musical_ly|BytedanceWebview|Snapchat|LinkedInApp|GSA\/|; wv\)/i
      .test(navigator.userAgent);
  }
  function canOfferInstall() {
    return !isStandalone() && !localStorage.getItem(INSTALLED_KEY);
  }
  function installSnoozed() {
    const t = Number(localStorage.getItem(INSTALL_DISMISSED_KEY) || 0);
    return t > 0 && Date.now() - t < INSTALL_SNOOZE_MS;
  }
  function currentInstallMode() {
    if (isInAppBrowser()) return 'inapp';
    if (deferredInstallPrompt) return 'prompt';
    if (isIOS()) return 'ios';
    return 'manual'; // alte browsere (ex. Firefox pe PC): doar indicatii
  }

  function showInstallBanner(mode) {
    if (document.getElementById('updateBanner').classList.contains('visible')) return; // update-ul are prioritate
    const banner = document.getElementById('installBanner');
    const textEl = document.getElementById('installBannerText');
    const actionBtn = document.getElementById('installActionBtn');
    actionBtn.style.display = '';
    actionBtn.onclick = null;

    if (mode === 'prompt') {
      textEl.textContent = 'Instalează aplicația: pornește din iconiță, pe tot ecranul, ca orice altă aplicație.';
      actionBtn.textContent = 'Instalează';
      actionBtn.onclick = runInstallPrompt;
    } else if (mode === 'ios') {
      textEl.innerHTML = `Adaugă aplicația pe ecranul principal: <b>1.</b> atinge ${IOS_SHARE_ICON}<b>Partajare</b> · <b>2.</b> alege „Adaugă pe ecranul principal".`;
      actionBtn.style.display = 'none';
    } else if (mode === 'inapp') {
      if (isAndroid()) {
        textEl.textContent = 'Ești în browserul intern al altei aplicații, unde instalarea nu e posibilă. Deschide pagina în Chrome ca s-o poți instala.';
        actionBtn.textContent = 'Deschide în Chrome';
        actionBtn.onclick = () => {
          location.href = `intent://${location.host}${location.pathname}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(location.href)};end`;
        };
      } else {
        textEl.textContent = 'Ești în browserul intern al altei aplicații, unde instalarea nu e posibilă. Copiază linkul și deschide-l în Safari.';
        actionBtn.textContent = 'Copiază linkul';
        actionBtn.onclick = async () => {
          try { await navigator.clipboard.writeText(new URL('./', location.href).href); actionBtn.textContent = 'Link copiat ✓'; }
          catch { window.prompt('Copiază linkul:', new URL('./', location.href).href); }
        };
      }
    } else {
      textEl.textContent = 'Folosește meniul browserului: „Instalează aplicația" sau „Adaugă pe ecranul principal". Pe PC, instalarea merge în Chrome și Edge.';
      actionBtn.style.display = 'none';
    }
    banner.classList.add('visible');
  }

  function hideInstallBanner() {
    document.getElementById('installBanner').classList.remove('visible');
  }

  async function runInstallPrompt() {
    hideInstallBanner();
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    if (choice && choice.outcome === 'accepted') localStorage.setItem(INSTALLED_KEY, '1');
    else localStorage.setItem(INSTALL_DISMISSED_KEY, String(Date.now()));
    refreshInstallButtons();
  }

  // Oferta automata: doar pe lista, doar dupa implicare, doar daca nu a fost amanata.
  function maybeShowInstallBanner() {
    if (!canOfferInstall() || installSnoozed()) return;
    const mode = currentInstallMode();
    if (mode === 'manual') return; // fara buton de instalare: nu insistam, ramane in Setari/Ajutor
    if (mode !== 'inapp') {
      if (currentView !== 'list' || !localStorage.getItem(ENGAGED_KEY)) return;
    }
    showInstallBanner(mode);
  }

  // Butoanele permanente din Setari si Ajutor
  function wireInstallAndShareButtons(installId, shareId) {
    const installBtn = document.getElementById(installId);
    const shareBtn = document.getElementById(shareId);
    if (installBtn) {
      installBtn.hidden = !canOfferInstall();
      installBtn.addEventListener('click', () => {
        const mode = currentInstallMode();
        if (mode === 'prompt') runInstallPrompt(); else showInstallBanner(mode);
      });
    }
    if (shareBtn) {
      shareBtn.addEventListener('click', () =>
        shareLink('Știri în neștire', new URL('./', location.href).href, shareBtn, 'Link copiat ✓', APP_SHARE_TEXT));
    }
  }
  function refreshInstallButtons() {
    ['settingsInstallBtn', 'helpInstallBtn'].forEach(id => {
      const b = document.getElementById(id);
      if (b) b.hidden = !canOfferInstall();
    });
  }

  // Android si PC (Chrome/Edge/Samsung): browserul anunta ca aplicatia e instalabila
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
    maybeShowInstallBanner();
  });

  document.getElementById('installDismissBtn').addEventListener('click', () => {
    hideInstallBanner();
    localStorage.setItem(INSTALL_DISMISSED_KEY, String(Date.now()));
  });

  window.addEventListener('appinstalled', () => {
    hideInstallBanner();
    localStorage.setItem(INSTALLED_KEY, '1');
    refreshInstallButtons();
  });

  // Implicare: primul articol citit (marcat in pagina articolului) sau ~40 de secunde in aplicatie
  setTimeout(() => {
    localStorage.setItem(ENGAGED_KEY, '1');
    maybeShowInstallBanner();
  }, 40000);
  // Browser intern: aratam indicatia devreme, inainte ca omul sa inchida pagina
  if (isInAppBrowser()) setTimeout(maybeShowInstallBanner, 2500);
  installLogicReady = true;

  // ---- Detectare versiune noua a aplicatiei ----
  if ('serviceWorker' in navigator) {
    function showUpdateBanner(waitingWorker) {
      hideInstallBanner(); // update-ul are prioritate fata de promptul de instalare
      const banner = document.getElementById('updateBanner');
      banner.classList.add('visible');
      document.getElementById('updateReloadBtn').onclick = () => {
        userRequestedUpdate = true;
        waitingWorker.postMessage({ type: 'SKIP_WAITING' });
      };
    }

    let refreshingPage = false;
    // La prima vizita nu exista inca un service worker care controleaza pagina; cand cel
    // nou preia controlul (clients.claim) nu e o actualizare, deci nu reincarcam pagina
    // (altfel cine deschisese deja un articol era aruncat inapoi la lista).
    const hadController = Boolean(navigator.serviceWorker.controller);
    let userRequestedUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshingPage || !(hadController || userRequestedUpdate)) return;
      refreshingPage = true;
      window.location.reload();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(registration => {
        // La revenirea in aplicatie (cel mult o data pe ora) cerem si o verificare de versiune.
        let lastUpdateCheck = Date.now();
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && Date.now() - lastUpdateCheck > 60 * 60 * 1000) {
            lastUpdateCheck = Date.now();
            registration.update().catch(() => {});
          }
        });
        // Caz 1: exista deja un worker nou, in asteptare, de la o vizita anterioara
        if (registration.waiting) {
          showUpdateBanner(registration.waiting);
        }
        // Caz 2: se instaleaza un worker nou chiar acum, cat timp pagina e deschisa
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showUpdateBanner(newWorker);
            }
          });
        });
      }).catch(() => {});
    });
  }
</script>
